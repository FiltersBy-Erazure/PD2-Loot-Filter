# The Erazure website (GitHub Pages), built by MkDocs with the Material theme.
# Preview: double-click site_preview.bat. Publish: a push to main, where .github/workflows/pages.yml builds and
# deploys it. The pages are in docs/ (next to this file).
site_name: Erazure's PD2 Loot Filter
site_url: https://filtersby-erazure.github.io/PD2-Loot-Filter/
site_author: Erazure
site_description: >-
  Erazure's loot filter for Project Diablo 2: its versions, filter levels, unique and set item tiers,
  non-magical bases, and how to customize it.

repo_name: FiltersBy-Erazure/PD2-Loot-Filter
repo_url: https://github.com/FiltersBy-Erazure/PD2-Loot-Filter
edit_uri: ""

theme:
  name: material
  custom_dir: overrides  # overrides/main.html: every visit starts dark
  language: en
  icon:
    logo: material/treasure-chest
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.indexes  # a tab's index.md is its own page (Resources)
    - navigation.top
    - search.suggest
    - search.highlight
  palette:  # dark first: every visit starts dark (overrides/main.html); the sun/moon icon switches for the visit
    - scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

extra_css:
  - stylesheets/erazure.css
extra_javascript:
  - javascripts/erazure.js  # the Back to top button under a page's sticky bar

# Adds the players' pages (the repo-root Erazure-*.html, written by build.bat) and the Resources pages (resources/,
# written by hand) to the site
hooks:
  - hooks.py
watch:
  - ../Erazure-Unique-Set-Tiers.html
  - ../Erazure-Non-Magic-Bases.html
  - ../Erazure-Filter-Levels.html
  - ../Erazure-Minimal-Style.html
  - ../Erazure-Skill-Shop-Highlights.html
  - ../Erazure-Magic-Items.html
  - ../Erazure-Rare-Items.html
  - ../Erazure-Grail-Planner.html
  - ../Erazure-Grail-Planner-Compendium.png
  - ../Erazure-Grail-Planner-Glyphs.png
  - ../Erazure-Filter-Editor.html
  - ../Erazure-Filter-Editor-Source.js
  - resources

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Versions: versions.md
  - Minimal Version: minimal.md
  - Filter Levels: filter-levels.md
  - Unique & Set Tiers: tiers.md
  - Grail Planner: grail.md
  - Non-magical Bases: bases.md
  - Magic Items: magic.md
  - Rare Items: rare.md
  - Skill & Shop Highlights: shop.md
  - Customization: customization.md
  - Filter Editor: editor.md
  - Examples: examples.md
  - Resources:
      - resources/index.md
      - Infinity Merc Bases: resources/infinity-merc-bases.md
      - Map Experience: resources/map-experience.md
      - Event and Boss Map Runs: resources/event-boss-runs.md
      - Ohm vs Jewel: resources/ohm-vs-jewel.md
      - Damage Calculator: resources/damage-calculator.md
      - Run Speed: resources/run-speed.md
      - IAS Calculator: resources/ias-calculator.md
