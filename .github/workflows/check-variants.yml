name: Check filter variants are in sync

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify all 8 filters match Erazure-Main.filter
        run: python tools/build_variants.py --check
