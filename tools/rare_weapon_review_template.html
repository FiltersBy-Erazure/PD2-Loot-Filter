<title>Select Weapons Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Template for the author's Select Weapons review page (tools/rare_weapon_review.py writes tools/.cache/rare_weapon_review.html
     with the data embedded; published as a private claude.ai page whose db, collection level9, keeps the choices). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  @font-face { font-family: "AvQest"; src: local("AvQest"); }  /* the D2-style font, if the viewer has it installed */
  /* Layout: a bar that stays at the top (save state, item level for the rolls, which rows, weapon classes), the
     intro (the new level name, how to read a row, the summary of choices), then one section per weapon class with a
     card per family: a grid row per base and eth state (base, stats, today's strip of filter levels 0-12, the Select Weapons level's
     choice), and a fold-out table of what a rare can roll. Dark first, like the players' pages. */
  :root {
    --bg: #151412; --panel: #1f1d1a; --raised: #26231f; --fg: #ece7de; --muted: #a59e91; --line: #36322c;
    --soft: #2a2723; --accent: #d8b45e; --accent-ink: #151412;
    --s-hide: #ef7a72; --s-name: #8d877b; --s-look: #c9b27a; --s-icon: #8bb4e8; --s-chat: #7cc474;
    --changed: #d8b45e; --ground-1: #3a3428; --ground-2: #26221b; --ground-3: #15130f;
    --display: "Cinzel", "Trajan Pro", Georgia, serif;
    --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --label: "AvQest", "Palatino Linotype", Palatino, Georgia, serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f1ec; --panel: #fffdf8; --raised: #f7f3ea; --fg: #23211c; --muted: #6b655a; --line: #ded7c9;
      --soft: #ece6da; --accent: #8a6d1f; --accent-ink: #fffdf8;
      --s-hide: #b3261e; --s-name: #9a9385; --s-look: #8a6d1f; --s-icon: #2f6db3; --s-chat: #2f8a3a;
      --changed: #8a6d1f; color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f3f1ec; --panel: #fffdf8; --raised: #f7f3ea; --fg: #23211c; --muted: #6b655a; --line: #ded7c9;
    --soft: #ece6da; --accent: #8a6d1f; --accent-ink: #fffdf8;
    --s-hide: #b3261e; --s-name: #9a9385; --s-look: #8a6d1f; --s-icon: #2f6db3; --s-chat: #2f8a3a;
    --changed: #8a6d1f; color-scheme: light;
  }
  * , *::before, *::after { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10;
                 background: var(--panel); }
  .gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width: 1320px; margin: 0 auto; }
  button, select, textarea, input { font: inherit; color: inherit; }
  button:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; }

  /* the bar */
  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel);
         border-bottom: 1px solid var(--line); padding-block: 8px; }
  .bar .wrap { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .bar .name { font: 700 15px/1.2 var(--display); letter-spacing: .03em; white-space: nowrap; }
  .bar label { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--muted); }
  .bar select { padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  .status { font-size: 13px; color: var(--muted); min-width: 0; }
  .status.ok { color: var(--s-chat); } .status.bad { color: var(--s-hide); }
  .btn { padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--raised);
         cursor: pointer; font-size: 13.5px; }
  .btn:hover { border-color: var(--accent); }
  .jump { display: flex; gap: 6px; overflow-x: auto; max-width: 100%; padding-bottom: 2px; flex: 1 1 100%; }
  .jump a { white-space: nowrap; font-size: 13px; color: var(--fg); text-decoration: none; padding: 2px 9px;
            border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
  .jump a:hover { border-color: var(--accent); }
  .spacer { flex: 1 1 auto; }
  @media (max-width: 700px) { .bar { position: static; } }  /* phones: the bar would cover half the screen */

  /* the intro */
  h1 { font: 700 28px/1.15 var(--display); letter-spacing: .02em; margin: 20px 0 6px; text-wrap: balance; }
  .intro { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px 22px; margin-bottom: 8px; }
  @media (max-width: 960px) { .intro { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
  .panel h2 { font: 700 12.5px/1.3 var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
              margin: 0 0 8px; }
  .panel p, .panel li { max-width: 74ch; margin: 0 0 6px; font-size: 14.5px; }
  .panel ul { margin: 0 0 4px; padding-left: 18px; }
  .names { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-items: center; margin-bottom: 10px; }
  .names .tag { font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .names .d2label { white-space: normal; text-align: left; }  /* the level names wrap on phones */
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; margin-top: 4px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sum { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px;
          border: 1px solid var(--line); background: var(--bg); font-size: 13px; }
  .chip b { font-variant-numeric: tabular-nums; }
  .changes { font-size: 13.5px; max-height: 260px; overflow: auto; }
  .changes div { margin-bottom: 4px; }
  .changes a { color: var(--fg); }
  .muted { color: var(--muted); }

  /* sections and families */
  section.cat { margin-top: 26px; }
  section.cat > h2 { font: 700 22px/1.2 var(--display); letter-spacing: .02em; margin: 0 0 4px; scroll-margin-top: 120px; }
  .wnote { font-size: 13.5px; color: var(--muted); margin: 0 0 10px; max-width: 100ch; }
  .wnote span { display: block; }
  article.fam { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 16px;
                scroll-margin-top: 120px; min-width: 0; }
  .fhead { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; padding: 10px 14px;
           border-bottom: 1px solid var(--line); }
  .fhead h3 { font: 700 18px/1.2 var(--display); margin: 0; letter-spacing: .02em; }
  .chain { font-size: 13.5px; color: var(--muted); }
  .fhead .setall { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  .fhead select { padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); max-width: 100%; }
  .rows { display: grid; grid-template-columns: minmax(170px, 1fr) minmax(210px, 1.3fr) minmax(250px, 1.25fr) minmax(250px, 1.25fr); }
  .rows > .hd { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
                padding: 8px 12px 4px; border-bottom: 1px solid var(--line); }
  .row { display: contents; }
  .row > .c { padding: 9px 12px; border-bottom: 1px solid var(--line); min-width: 0; scroll-margin-top: 140px; }
  .row.changed > .c:first-child { box-shadow: inset 3px 0 0 var(--changed); }
  .row.eth > .c { background: color-mix(in srgb, var(--soft) 45%, transparent); }
  .row[hidden] { display: none; }
  .bname { font-weight: 700; }
  .tier { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-right: 6px; }
  .ethb { font-size: 11.5px; font-weight: 700; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line);
          margin-left: 6px; color: var(--fg); background: var(--bg); }
  .small { font-size: 12.5px; color: var(--muted); }
  .dmg { font-variant-numeric: tabular-nums; font-size: 14px; }
  .dmg b { font-weight: 600; }
  .kv { display: flex; flex-wrap: wrap; gap: 0 10px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .kv span b { color: var(--fg); font-weight: 600; }
  .strip { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 2px; max-width: 290px; }
  .strip i { display: block; font-style: normal; font-size: 10.5px; line-height: 17px; text-align: center; color: #15130f;
             border-radius: 3px; background: var(--sc); font-variant-numeric: tabular-nums; }
  .strip i.l9 { outline: 2px solid var(--fg); outline-offset: 1px; }
  .s-hide { --sc: var(--s-hide); } .s-name { --sc: var(--s-name); } .s-look { --sc: var(--s-look); }
  .s-icon { --sc: var(--s-icon); } .s-chat { --sc: var(--s-chat); }
  .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; background: var(--sc); }
  .cls { margin-top: 4px; font-size: 12px; color: var(--muted); }
  .cls .strip { max-width: 220px; margin-top: 2px; } .cls .strip i { line-height: 11px; font-size: 0; }
  .now { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
  details.why { margin-top: 4px; font-size: 12.5px; color: var(--muted); }
  details.why summary { cursor: pointer; }
  details.why div { margin: 3px 0 0; }
  .pick select { width: 100%; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  .row.changed .pick select { border-color: var(--changed); }
  .preview { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 26px; }
  .pill { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--s-hide); color: #15130f; }
  .note { font-size: 12px; color: var(--muted); }
  @media (max-width: 900px) {
    .rows { grid-template-columns: minmax(0, 1fr); }
    .rows > .hd { display: none; }
    .row > .c { border-bottom: 0; padding-block: 6px; }
    .row > .c:last-child { border-bottom: 1px solid var(--line); padding-bottom: 12px; }
    .row.changed > .c { box-shadow: inset 3px 0 0 var(--changed); }
  }
  .fnote { padding: 8px 14px 10px; border-top: 1px solid var(--line); }
  .fnote textarea { width: 100%; min-height: 38px; resize: vertical; padding: 6px 8px; border: 1px solid var(--line);
                    border-radius: 6px; background: var(--bg); font-size: 14px; }
  .fnote label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 4px; }

  /* what a rare can roll */
  details.rolls { border-top: 1px solid var(--line); }
  details.rolls > summary { cursor: pointer; padding: 9px 14px; font-weight: 600; }
  details.rolls > summary .small { font-weight: 400; margin-left: 6px; }
  .rollwrap { overflow-x: auto; padding: 0 14px 12px; }
  table.roll { border-collapse: collapse; width: 100%; min-width: 720px; font-size: 13px; }
  table.roll th, table.roll td { text-align: left; vertical-align: top; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  table.roll thead th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  table.roll th.sec { font: 700 12px/1.3 var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--accent);
                      padding-top: 10px; }
  table.roll th.stat { font-weight: 600; width: 190px; }
  .tl { display: flex; gap: 8px; justify-content: space-between; }
  .tl span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
  .tl.any { font-weight: 600; } .tl.any span:last-child { color: var(--fg); }
  .rollnote { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; max-width: 110ch; }
  button.more { margin: 8px 0 0; }

  /* the in-game look (the players' pages' drawing) */
  .ground { display: inline-block; max-width: 100%; text-align: center; border-radius: 5px; padding: 2px 5px;
            background: radial-gradient(ellipse at 50% 45%, var(--ground-1) 0%, var(--ground-2) 55%, var(--ground-3) 100%); }
  .d2label { display: inline-block; font-family: var(--label); font-size: 14px; line-height: 1.12; text-align: center;
             white-space: pre; background: rgba(0, 0, 0, .74); padding: 2px 6px 0; vertical-align: middle; max-width: 100%;
             overflow: hidden; text-overflow: ellipsis; }
  .c-WHITE { color: #e8e8e8; } .c-RED { color: #ff4d4d; } .c-GREEN { color: #00ff00; } .c-BLUE { color: #6969ff; }
  .c-GOLD { color: #c7b377; } .c-GRAY { color: #696969; } .c-TAN { color: #d0c27d; } .c-ORANGE { color: #ffa800; }
  .c-YELLOW { color: #ffff64; } .c-PURPLE { color: #ae00ff; } .c-DARK_GREEN { color: #008000; }
  .c-CORAL { color: #ff7f6e; } .c-SAGE { color: #a3b88f; } .c-TEAL { color: #3fb5b5; } .c-LIGHT_GRAY { color: #a8a8a8; }
  .icon { position: relative; display: inline-block; width: 16px; height: 16px; background: #0c0b09; border-radius: 2px;
          vertical-align: middle; flex: none; }
  .icon span { position: absolute; }
  .chat { display: inline-flex; color: var(--muted); vertical-align: middle; }
  .chat svg { width: 20px; height: 20px; }
  .sound { white-space: nowrap; font-size: 12px; color: var(--muted); }
  footer { color: var(--muted); font-size: 13px; padding-block: 24px 32px; }
  .copybox { width: 100%; min-height: 120px; margin-top: 8px; font: 12px/1.4 ui-monospace, Consolas, monospace;
             background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="bar gut">
  <div class="wrap">
    <span class="name" id="barName">Select Weapons</span>
    <span id="status" class="status" role="status" aria-live="polite">Loading your saved choices…</span>
    <span class="spacer"></span>
    <label for="show">Rows
      <select id="show">
        <option value="all">All</option>
        <option value="changed">Changed here</option>
        <option value="hidden9">Hidden on Select Weapons now</option>
        <option value="shown9">Shown on Select Weapons now</option>
      </select>
    </label>
    <label for="ilvl">Rolls at item level <select id="ilvl"></select></label>
    <button id="copy" class="btn" type="button">Copy my choices</button>
    <nav class="jump" id="jump" aria-label="Weapon classes"></nav>
  </div>
</div>

<main class="gut">
  <div class="wrap">
    <h1 id="h1">Select Weapons</h1>
    <div class="intro">
      <div class="panel">
        <h2 id="lvHead">Select Weapons</h2>
        <div class="names">
          <span class="tag">Name</span><span id="name9"></span>
        </div>
        <ul id="about"></ul>
        <h2>How to read a row</h2>
        <ul id="howto"></ul>
        <div class="legend" id="legend"></div>
      </div>
      <div class="panel">
        <h2>Your choices</h2>
        <div class="sum" id="sum"></div>
        <div class="changes" id="changes"></div>
      </div>
    </div>
    <div id="cats"></div>
    <footer id="foot"></footer>
  </div>
</main>

<script>
const DATA = /*__DATA__*/null;
const LV = DATA.levels.length;  // filter levels 0..12
const CHOICE = Object.fromEntries(DATA.choices.map((c) => [c.id, c]));
const FAM = Object.fromEntries(DATA.fams.map((f) => [f.code, f]));
const ROW = {};
for (const f of DATA.fams) for (const r of f.rows) ROW[r.id] = {fam: f.code, row: r};
const state = {picks: {}, notes: {}};  // family code -> {row id: choice}; family code -> note
for (const f of DATA.fams) { state.picks[f.code] = {}; state.notes[f.code] = ""; }
const view = {show: "all", ilvl: DATA.ilvls[0]};
try { const v = JSON.parse(localStorage.getItem("level9-review-view") || "{}"); if (v && DATA.ilvls.includes(v.ilvl)) view.ilvl = v.ilvl; } catch (e) {}

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "text") e.textContent = v; else if (k === "cls") e.className = v; else e.setAttribute(k, v);
  }
  for (const k of kids) if (k !== null && k !== undefined && k !== false) e.append(k);
  return e;
}
function colored(color, text) {
  const s = el("span", {cls: "c-" + color});
  s.textContent = text;
  return s;
}
function label(lines) {
  const box = el("div", {cls: "d2label", role: "img"});
  const said = [];
  for (const segs of lines) {
    const d = el("div");
    for (const [c, t] of segs) d.append(colored(c, t));
    box.append(d);
    said.push(segs.map((s) => s[1]).join(""));
  }
  box.setAttribute("aria-label", "In-game label: " + said.join(" / "));
  return el("div", {cls: "ground"}, box);
}
function icon(layers) {  // BORDER / MAP / DOT / PX boxes (8 / 6 / 4 / 2 px), drawn 2x, in rule order
  if (!layers || !layers.length) return null;
  const box = el("span", {cls: "icon", title: "Minimap icon"});
  for (const layer of layers) {
    [16, 12, 8, 4].forEach((size, i) => {
      if (!layer[i]) return;
      const off = (16 - size) / 2;
      box.append(el("span", {style: `left:${off}px;top:${off}px;width:${size}px;height:${size}px;background:${DATA.palette[layer[i]] || "#fff"}`}));
    });
  }
  return box;
}
function chat() {
  const s = el("span", {cls: "chat", title: "Chat notification when it drops", "aria-label": "Chat notification"});
  s.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 3.5A1.5 1.5 0 0 1 3.5 2h9A1.5 1.5 0 0 1 14 3.5v6a1.5 1.5 0 0 1-1.5 1.5H7l-3 3v-3h-.5A1.5 1.5 0 0 1 2 9.5z"/></svg>';
  return s;
}
function kindOf(look) {
  if (look.k === "hide") return "hide";
  if (look.h) return "chat";
  if (look.i && look.i.length) return "icon";
  return look.k === "look" ? "look" : "name";
}
const KIND_WORD = {hide: "Hidden", name: "Name only", look: "Its own look", icon: "Minimap icon", chat: "Chat line and icon"};
function drawLook(look, wrap) {
  wrap.replaceChildren();
  if (look.k === "hide") {
    wrap.append(el("span", {cls: "pill", text: "Hidden"}));
    if (look.i && look.i.length) wrap.append(icon(look.i), el("span", {cls: "note", text: "BH still draws its icon"}));
    return wrap;
  }
  if (look.b) wrap.append(label(look.b));
  const ic = icon(look.i);
  if (ic) wrap.append(ic);
  if (look.h) wrap.append(chat());
  if (look.o) wrap.append(el("span", {cls: "sound", text: "♪ " + (DATA.sounds[look.o] || look.o)}));
  return wrap;
}
function strip(looks, mark9) {
  const s = el("div", {cls: "strip", role: "img"});
  const words = [];
  looks.forEach((li, lv) => {
    const k = kindOf(DATA.looks[li]);
    s.append(el("i", {cls: "s-" + k + (mark9 && lv === DATA.sel ? " l9" : ""), title: `Level ${lv}: ${KIND_WORD[k]}`, text: String(lv)}));
    words.push(`${lv} ${KIND_WORD[k].toLowerCase()}`);
  });
  s.setAttribute("aria-label", "Filter levels today: " + words.join(", "));
  return s;
}
function f1(x) { return Number.isInteger(x) ? String(x) : x.toFixed(1); }
function pct(p) { if (p <= 0) return "0%"; if (p < 0.001) return "<0.1%"; return (p * 100).toFixed(p < 0.1 ? 1 : 0) + "%"; }
function todaySel(row) { return DATA.looks[row.today.s[DATA.sel]]; }  // the Select Weapons level now
function pickOf(row) { return state.picks[ROW[row.id].fam][row.id] || "same"; }
function lookFor(row, choice) {
  if (choice === "same") return DATA.looks[row.today.s[DATA.plain]];  // what the plain Endgame level does
  if (choice === "hide") return {k: "hide", i: [], h: false, o: 0};
  return DATA.looks[row.looks[choice]];
}

// ---------------------------------------------------------------- rows
const rowEls = {};  // row id -> {wrap cells, select, preview}
function statsCell(row) {
  const st = row.stats;
  const c = el("div", {cls: "c"});
  const d = el("div", {cls: "dmg"});
  for (const [mode, lo, hi] of st.dmg) {
    d.append(el("div", {}, el("b", {text: mode + " "}), `${lo}–${hi}`, el("span", {cls: "small", text: ` · avg ${f1((lo + hi) / 2)}`})));
  }
  c.append(d);
  const kv = el("div", {cls: "kv"});
  const add = (k, v) => { if (v !== null && v !== undefined && v !== "") kv.append(el("span", {}, k + " ", el("b", {text: String(v)}))); };
  add("Speed", st.speed);
  add("Range", st.range);
  add("Str", st.str || "–");
  add("Dex", st.dex || "–");
  add("Sockets", `${st.maxsock[2]}`);
  kv.append(el("span", {title: "Most sockets (BH's MAXSOCKETS) at item level 1–25 / 26–40 / 41+"}, "by item level ", el("b", {text: st.maxsock.join(" / ")})));
  add("Size", st.size);
  add("Hands", st.hands);
  if (st.dur) add("Durability", st.dur);
  c.append(kv);
  return c;
}
function todayCell(row) {
  const c = el("div", {cls: "c"});
  c.append(strip(row.today.s, true));
  for (const [names, s] of row.today.x) {
    c.append(el("div", {cls: "cls"}, el("span", {text: names.join(", ") + " see:"}), strip(s, true)));
  }
  const lo = Math.min(DATA.sel, DATA.plain), hi = Math.max(DATA.sel, DATA.plain);
  const same = row.today.s[lo] === row.today.s[hi];
  for (const lv of same ? [hi] : [lo, hi]) {
    const now = el("div", {cls: "now"}, el("span", {text: same ? `Levels ${lo} and ${hi} now:` : `Level ${lv} now:`}));
    drawLook(DATA.looks[row.today.s[lv]], now.appendChild(el("span", {cls: "preview", style: "margin:0"})));
    c.append(now);
  }
  if (row.today.r.length) {
    const why = el("details", {cls: "why"}, el("summary", {text: "Rules today"}));
    for (const w of row.today.r) {
      const k = {hide: "Hidden", show: "Shows as", notify: "Notify"}[w.k] || w.k;
      why.append(el("div", {}, `${w.lv}: ${k}` + (w.i.length ? " + icon" : "") + (w.h ? " + chat" : "") + (w.c ? ` (${w.c})` : "") + ` · ${w.w}`));
    }
    c.append(why);
  }
  return c;
}
function pickCell(row) {
  const c = el("div", {cls: "c pick"});
  const id = "pick-" + row.id;
  const sel = el("select", {id, "aria-label": `Level ${DATA.sel} for ${row.eth ? "Eth " : ""}${row.name}`});
  for (const ch of DATA.choices) sel.append(el("option", {value: ch.id, text: ch.l}));
  sel.value = pickOf(row);
  sel.addEventListener("change", () => setPick(row, sel.value));
  const prev = el("div", {cls: "preview"});
  const note = el("div", {cls: "note"});
  c.append(sel, prev, note);
  rowEls[row.id] = Object.assign(rowEls[row.id] || {}, {sel, prev, note});
  return c;
}
function paintRow(row) {
  const r = rowEls[row.id];
  const choice = pickOf(row);
  if (r.sel.value !== choice) r.sel.value = choice;
  drawLook(lookFor(row, choice), r.prev);
  r.note.textContent = CHOICE[choice].n ? "Looks " + CHOICE[choice].n : "";
  r.wrap.classList.toggle("changed", choice !== "same");
  r.wrap.dataset.today9 = kindOf(todaySel(row));
}
function rowEl(row) {
  const wrap = el("div", {cls: "row" + (row.eth ? " eth" : "")});
  rowEls[row.id] = {wrap};
  const base = el("div", {cls: "c", id: "row-" + row.id},  // the anchor: the row itself has no box (display: contents)
    el("div", {}, el("span", {cls: "tier", text: row.tier}), el("span", {cls: "bname", text: row.name}), row.eth ? el("span", {cls: "ethb", text: "Eth"}) : null),
    el("div", {cls: "small", text: `${row.code} · quality level ${row.stats.qlvl} · required level ${row.stats.lvl}`}));
  wrap.append(base, statsCell(row), todayCell(row), pickCell(row));
  return wrap;
}

// ---------------------------------------------------------------- what a rare can roll
const CAT = Object.fromEntries(DATA.catalog.map((c) => [c.k, c]));
function keyLabel(key, param) {
  if (key === "clsk") return `+ ${DATA.classes[param]} skills`;
  if (key === "tab") { const t = DATA.tabs[String(param)]; return t ? `+ ${t[0]} skills (${t[1]})` : "+ skill tab"; }
  return CAT[key].l;
}
function rollTable(fam, full) {
  const i = DATA.ilvls.indexOf(view.ilvl);
  const tiers = [0, 1, 2].map((t) => fam.rows.find((r) => r.tier === ["Normal", "Exceptional", "Elite"][t] && !r.eth));
  const tabs = tiers.map((r) => DATA.rolltab[fam.rolls[`${r.code}:${r.alvl[i]}`]]);
  const keys = [];
  const seen = new Set();
  for (const tab of tabs) for (const [k, p] of tab) { const id = k + ":" + p; if (!seen.has(id)) { seen.add(id); keys.push([k, p]); } }
  const order = Object.fromEntries(DATA.catalog.map((c, n) => [c.k, n]));
  keys.sort((a, b) => order[a[0]] - order[b[0]] || (a[1] || 0) - (b[1] || 0));
  const table = el("table", {cls: "roll"});
  const head = el("tr", {}, el("th", {text: "Stat"}));
  tiers.forEach((r) => head.append(el("th", {}, `${r.tier} · ${r.name}`, el("div", {cls: "small", text: `affix level ${r.alvl[i]}`}))));
  table.append(el("thead", {}, head));
  const body = el("tbody");
  let sec = null;
  for (const [k, p] of keys) {
    const s = CAT[k].s;
    if (!full && !DATA.main.includes(s)) continue;
    if (s !== sec) { sec = s; body.append(el("tr", {}, el("th", {cls: "sec", colspan: "4", text: s}))); }
    const cells = tabs.map((tab) => tab.find((e) => e[0] === k && e[1] === p));
    const tr = el("tr", {}, el("th", {cls: "stat", text: keyLabel(k, p)}));
    const same = cells.every((x) => JSON.stringify(x) === JSON.stringify(cells[0]));
    const cellEl = (x) => {
      const td = el("td");
      if (!x) { td.append(el("span", {cls: "muted", text: "Can't roll"})); return td; }
      td.append(el("div", {cls: "tl any"}, el("span", {text: "Any"}), el("span", {text: pct(x[3])})));
      for (const [t, lvl, pr] of x[2]) td.append(el("div", {cls: "tl", title: `affix level ${lvl}+; the chance counts this tier or better`}, el("span", {text: DATA.texts[t]}), el("span", {text: (x[2].length > 1 ? "≥ " : "") + pct(pr)})));
      return td;
    };
    if (same) { const td = cellEl(cells[0]); td.colSpan = 3; tr.append(td); } else cells.forEach((x) => tr.append(cellEl(x)));
    body.append(tr);
  }
  table.append(body);
  return table;
}
function rollsBlock(fam) {
  const d = el("details", {cls: "rolls"});
  const sum = el("summary", {}, "What a rare can roll", el("span", {cls: "small", text: ""}));
  d.append(sum);
  const box = el("div", {cls: "rollwrap"});
  d.append(box);
  let full = false;
  d.render = () => {
    sum.lastChild.textContent = `item level ${view.ilvl}: 3 prefixes and 3 suffixes`;
    if (!d.open) return;
    box.replaceChildren(rollTable(fam, full));
    const more = el("button", {cls: "btn more", type: "button", text: full ? "Show the main stats only" : "Show every stat (attack rating, elements, demons and undead, other)"});
    more.addEventListener("click", () => { full = !full; d.render(); });
    box.append(more, el("p", {cls: "rollnote", text: "Each line is an affix tier with the chance that a rare of this base has that tier or a better one; Any is the chance of the stat at all. One prefix and one suffix group each at most; outside maps (in maps PD2 weighs tiered affixes higher). From docs/pd2-magic-affixes.tsv; the same for ethereal items."}));
  };
  d.addEventListener("toggle", () => d.render());
  d.render();
  return d;
}

// ---------------------------------------------------------------- families and sections
const famEls = {};
function famEl(fam) {
  const a = el("article", {cls: "fam", id: "fam-" + fam.code});
  const setall = el("select", {id: "all-" + fam.code, "aria-label": `Set every row of the ${fam.name} family`});
  setall.append(el("option", {value: "", text: "Set every row…"}));
  for (const ch of DATA.choices) setall.append(el("option", {value: ch.id, text: ch.l}));
  setall.addEventListener("change", () => {
    if (!setall.value) return;
    for (const r of fam.rows) state.picks[fam.code][r.id] = setall.value === "same" ? undefined : setall.value;
    for (const r of fam.rows) if (!state.picks[fam.code][r.id]) delete state.picks[fam.code][r.id];
    setall.value = "";
    for (const r of fam.rows) paintRow(r);
    changed(fam.code);
  });
  a.append(el("div", {cls: "fhead"}, el("h3", {text: fam.name}), el("span", {cls: "chain", text: fam.chain.join(" → ")}),
    el("label", {cls: "setall", for: "all-" + fam.code}, "Whole family", setall)));
  const grid = el("div", {cls: "rows"});
  for (const h of ["Base", "Stats", "Now (filter levels 0–12)", "Level " + DATA.sel]) grid.append(el("div", {cls: "hd", text: h}));
  for (const r of fam.rows) grid.append(rowEl(r));
  a.append(grid);
  const ta = el("textarea", {id: "note-" + fam.code, placeholder: "Anything else about this family (a condition, a different look…)"});
  ta.addEventListener("input", () => { state.notes[fam.code] = ta.value; changed(fam.code, 900); });
  a.append(el("div", {cls: "fnote"}, el("label", {for: "note-" + fam.code, text: "Note"}), ta));
  const rolls = rollsBlock(fam);
  a.append(rolls);
  famEls[fam.code] = {a, ta, rolls};
  for (const r of fam.rows) paintRow(r);
  return a;
}
function build() {
  const cats = document.getElementById("cats");
  const jump = document.getElementById("jump");
  for (const g of DATA.groups) {
    const id = "cat-" + g.cat.toLowerCase().replace(/[^a-z]+/g, "-");
    const s = el("section", {cls: "cat"}, el("h2", {id, text: g.cat}));
    if (g.note.length) {
      const n = el("p", {cls: "wnote"});
      for (const line of g.note) n.append(el("span", {text: line}));
      n.append(el("span", {text: "PD2 wiki (docs/items)"}));
      s.append(n);
    }
    for (const code of g.fams) s.append(famEl(FAM[code]));
    cats.append(s);
    jump.append(el("a", {href: "#" + id, text: g.cat}));
  }
  const legend = document.getElementById("legend");
  for (const k of ["hide", "name", "look", "icon", "chat"]) legend.append(el("span", {}, el("span", {cls: "sw s-" + k}), KIND_WORD[k]));
  document.getElementById("name9").append(label([DATA.name9]));
  const S = DATA.sel, P = DATA.plain;
  document.getElementById("barName").textContent = `Level ${S} · Select Weapons`;
  document.getElementById("h1").textContent = `Level ${S}: Select Weapons`;
  document.getElementById("lvHead").textContent = `Level ${S}`;
  const list = (id, lines) => { for (const t of lines) document.getElementById(id).append(el("li", {text: t})); };
  list("about", [
    `Level ${S} is level ${P} plus the rows set to something else here. Every other rare weapon behaves as on level ${P}.`,
    "Large Charms show from item level 90 on levels 8 to 10 (the rest hidden).",
    "Caduceus and Matriarchal Javelin stay as they are, so they are not on this page."]);
  list("howto", [
    "Each row is an unidentified rare of that base on the ground outside town, in the Main version, for a character at level 90.",
    `The strip shows filter levels 0 to 12 as the filter is now, level ${S} outlined. Choices saved here reach the filter when Claude applies them.`,
    "Ethereal rows: damage x1.25, rounded down. The PD2 wiki: “" + DATA.ethNote + "”",
    `Pick what level ${S} should do. Your choice saves as you click. “${CHOICE.same.l}” makes level ${S} do what level ${P} does.`]);
  const sel = document.getElementById("ilvl");
  for (const i of DATA.ilvls) sel.append(el("option", {value: String(i), text: String(i)}));
  sel.value = String(view.ilvl);
  sel.addEventListener("change", () => {
    view.ilvl = +sel.value;
    try { localStorage.setItem("level9-review-view", JSON.stringify({ilvl: view.ilvl})); } catch (e) {}
    for (const f of Object.values(famEls)) f.rolls.render();
  });
  const show = document.getElementById("show");
  show.addEventListener("change", () => { view.show = show.value; filterRows(); });
  document.getElementById("foot").textContent = `Built ${DATA.version} by tools/rare_weapon_review.py from the filter's own rules (tools/magic_rare_map.py's engine), docs/pd2-base-stats.tsv, docs/pd2-bases.tsv, docs/pd2-magic-affixes.tsv and the PD2 wiki's notes in docs/items.`;
  summary();
}
function filterRows() {
  for (const f of DATA.fams) {
    let any = false;
    for (const r of f.rows) {
      const w = rowEls[r.id].wrap;
      const k = kindOf(todaySel(r));
      const keep = view.show === "all" || (view.show === "changed" && pickOf(r) !== "same") ||
        (view.show === "hidden9" && k === "hide") || (view.show === "shown9" && k !== "hide");
      w.hidden = !keep;
      any = any || keep;
    }
    famEls[f.code].a.hidden = !any;
  }
  for (const s of document.querySelectorAll("section.cat")) s.hidden = !s.querySelector("article.fam:not([hidden])");
}

// ---------------------------------------------------------------- the summary
function summary() {
  const counts = {};
  const lines = {};
  for (const f of DATA.fams) for (const r of f.rows) {
    const p = pickOf(r);
    counts[p] = (counts[p] || 0) + 1;
    if (p !== "same") (lines[p] = lines[p] || []).push(r);
  }
  const sum = document.getElementById("sum");
  sum.replaceChildren();
  for (const ch of DATA.choices) if (counts[ch.id]) sum.append(el("span", {cls: "chip"}, ch.l, el("b", {text: String(counts[ch.id])})));
  const box = document.getElementById("changes");
  box.replaceChildren();
  const any = DATA.choices.some((ch) => ch.id !== "same" && lines[ch.id]);
  if (!any) { box.append(el("p", {cls: "muted", text: `No row changed yet. Rows you set to anything but “${CHOICE.same.l}” are listed here.`})); return; }
  for (const ch of DATA.choices) {
    if (ch.id === "same" || !lines[ch.id]) continue;
    const d = el("div", {}, el("b", {text: ch.l + ": "}));
    lines[ch.id].forEach((r, n) => {
      if (n) d.append(", ");
      d.append(el("a", {href: "#row-" + r.id, text: (r.eth ? "Eth " : "") + r.name}));
    });
    box.append(d);
  }
  const notes = DATA.fams.filter((f) => state.notes[f.code].trim());
  if (notes.length) box.append(el("div", {}, el("b", {text: "Notes: "}), notes.map((f) => f.name).join(", ")));
}

// ---------------------------------------------------------------- saving (db collection level9, one doc per family)
let db = null;
const dirty = {}, timers = {}, inflight = {};
function setStatus(text, kind) { const s = document.getElementById("status"); s.textContent = text; s.className = "status" + (kind ? " " + kind : ""); }
function setPick(row, choice) {
  const fam = ROW[row.id].fam;
  if (choice === "same") delete state.picks[fam][row.id]; else state.picks[fam][row.id] = choice;
  paintRow(row);
  changed(fam);
}
function changed(fam, wait = 300) {
  summary();
  if (view.show !== "all") filterRows();
  if (!db) return;
  dirty[fam] = true;
  clearTimeout(timers[fam]);
  timers[fam] = setTimeout(() => save(fam), wait);
  setStatus("Saving…");
}
async function save(fam) {
  if (inflight[fam]) { timers[fam] = setTimeout(() => save(fam), 400); return; }
  dirty[fam] = false;
  inflight[fam] = true;
  const body = {rows: Object.assign({}, state.picks[fam]), note: state.notes[fam], savedAt: new Date().toISOString()};
  try {
    await db.doc("level9/" + fam).set(body);
    const t = new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
    if (!Object.values(dirty).some(Boolean)) setStatus("Saved " + t, "ok");
  } catch (e) {
    dirty[fam] = true;
    setStatus("Couldn't save (" + ((e && e.code) || "error") + "). Use Copy my choices so nothing is lost.", "bad");
  } finally {
    inflight[fam] = false;
  }
}
function applyRemote(code, data) {
  if (!FAM[code] || dirty[code] || inflight[code]) return;
  const rows = data && typeof data.rows === "object" && data.rows ? data.rows : {};
  const picks = {};
  for (const [id, ch] of Object.entries(rows)) if (ROW[id] && ROW[id].fam === code && CHOICE[ch] && ch !== "same") picks[id] = ch;
  state.picks[code] = picks;
  state.notes[code] = data && typeof data.note === "string" ? data.note : "";
  const ta = famEls[code].ta;
  if (document.activeElement !== ta && ta.value !== state.notes[code]) ta.value = state.notes[code];
  for (const r of FAM[code].rows) paintRow(r);
}
function copyChoices() {
  const out = {};
  for (const f of DATA.fams) {
    if (Object.keys(state.picks[f.code]).length || state.notes[f.code].trim()) out[f.code] = {family: f.name, rows: state.picks[f.code], note: state.notes[f.code]};
  }
  const text = JSON.stringify(out, null, 2);
  const done = () => setStatus("Copied your choices", "ok");
  const fallback = () => {
    let box = document.getElementById("copybox");
    if (!box) { box = el("textarea", {id: "copybox", cls: "copybox", "aria-label": "Your choices as text"}); document.getElementById("changes").after(box); }
    box.value = text; box.focus(); box.select();
    setStatus("Select all and copy the text under Your choices", "");
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}
document.getElementById("copy").addEventListener("click", copyChoices);

build();
const use = window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null);
use.then((d) => {
  db = d;
  if (!d) { setStatus("Saving isn't available in this view. Use Copy my choices.", "bad"); return; }
  setStatus("Ready: choices save as you click", "ok");
  d.collection("level9").onSnapshot((snap) => {
    if (snap.metadata.hasPendingWrites) return;
    let latest = null;
    const seen = new Set();
    for (const doc of snap.docs) {
      const data = doc.data() || {};
      seen.add(doc.id);
      applyRemote(doc.id, data);
      if (data.savedAt && (!latest || data.savedAt > latest)) latest = data.savedAt;
    }
    for (const f of DATA.fams) if (!seen.has(f.code)) applyRemote(f.code, {});  // a document removed: no choices
    summary();
    if (view.show !== "all") filterRows();
    if (latest && !Object.values(dirty).some(Boolean)) setStatus("Saved choices loaded (last change " + new Date(latest).toLocaleString([], {dateStyle: "medium", timeStyle: "short"}) + ")", "ok");
  }, (e) => setStatus("Saved choices couldn't be loaded (" + ((e && e.code) || "error") + "). Use Copy my choices.", "bad"));
}, () => setStatus("Saving isn't available in this view. Use Copy my choices.", "bad"));
</script>
