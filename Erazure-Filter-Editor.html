    if (spec.corrupt) own[key(360, 0)] = spec.corrupt;
    for (const k of Object.keys(own)) stats[k] = own[k];
    // what the socket fillers bring (BH's stat words read them, its special stats' list too)
    const sock = {};
    shown(sock, spec.sockStats);
    for (const k of Object.keys(sock)) stats[k] = (stats[k] || 0) + sock[k];
    for (const sid of [16, 17, 18, 21, 22, 23, 24, 31, 159, 160]) {
      const v = (own[key(sid, 0)] || 0) + (sock[key(sid, 0)] || 0);
      if (v) list[sid] = v;
    }
    // what the base and the item's state give
    const sockets = Math.max(0, Math.min(spec.sockets || 0, 6));
    if (sockets) stats["194"] = (stats["194"] || 0) + sockets;
    if (b.code === "gld") stats["14"] = spec.gold || 1;
    if (b.stack || spec.qty) stats["70"] = spec.qty || 1;
    const eth = !!spec.eth || !!(u && u.eth);
    if (b.dur && !b.nodur) { stats["72"] = b.dur; stats["73"] = b.dur; }
    if (spec.def !== undefined) stats["31"] = spec.def;
    else if (b.armor && b.maxac) {
      const ed = own["16"] || 0, flat = own["31"] || 0;
      let d = b.maxac + (ed > 0 ? 1 : 0);
      if (eth) d = Math.floor(d * 3 / 2);
      stats["31"] = Math.floor(d * (100 + ed) / 100) + flat;
    }
    if (b.weapon && b.dmg) {
      const ethd = (x) => eth ? Math.floor(x * 3 / 2) : x;
      if (b.mindam || b.maxdam) { stats["21"] = ethd(b.mindam) + (own["21"] || 0); stats["22"] = ethd(b.maxdam) + (own["22"] || 0); }
      if (b.min2 || b.max2) { stats["23"] = ethd(b.min2) + (own["23"] || 0); stats["24"] = ethd(b.max2) + (own["24"] || 0); }
      if (b.minmis || b.maxmis) { stats["159"] = ethd(b.minmis) + (own["159"] || 0); stats["160"] = ethd(b.maxmis) + (own["160"] || 0); }
    }
    const disc = (q === "UNI" || q === "SET") ? {
      ALLDISCOVERED: spec.discovered !== false, ANYDISCOVERED: spec.discovered !== false,
      ALLOWNED: spec.owned !== false, ANYOWNED: spec.owned !== false} : {
      ALLDISCOVERED: false, ANYDISCOVERED: false, ALLOWNED: false, ANYOWNED: false};
    return {
      code: b.code, base: b, quality: q, id, eth, rw: !!spec.rw, socketed: Math.min(spec.filled || 0, sockets),
      ilvl: spec.ilvl === undefined ? 85 : spec.ilvl, stats, list, own,
      prefixes: spec.prefixes || [], suffixes: spec.suffixes || [], automod: spec.automod === undefined ? -1 : spec.automod,
      place: spec.place || "GROUND", disc, gameName: gameName(Object.assign({}, spec, {id, quality: q}), b, u),
      lvlreq: spec.lvlreq !== undefined ? spec.lvlreq : Math.max(b.lvlreq || 0, u ? u.lvlreq : 0),
      sell: spec.sell, buy: spec.buy,
    };
  }

  /* A short description of the spec: "Ethereal Superior Thresher, 4 sockets". */
  function describe(spec) {
    const b = base(spec.code);
    if (!b) return spec.code || "?";
    const q = spec.quality || "NORM";
    const u = spec.uni != null ? unique(spec.uni) : null;
    const plain = b.name.replace(/ÿc./g, "");
    const parts = [];
    if (spec.eth) parts.push("Ethereal");
    if (u) parts.push(u.name + (u.name !== plain ? " (" + plain + ")" : ""));
    else {
      if (q !== "NORM" || !b.misc) parts.push(q === "NORM" ? "" : QUALITY_NAMES[q]);
      parts.push(b.code === "gld" ? (spec.gold || 1) + " Gold" : plain);
    }
    let s = parts.filter(Boolean).join(" ");
    if (spec.sockets) s += ", " + spec.sockets + " socket" + (spec.sockets > 1 ? "s" : "");
    if (spec.rw) s += ", " + spec.rw;
    if (!NMAG[q] && !spec.id && (q !== "NORM")) s += ", unidentified";
    return s;
  }

  /* Every item the player can pick: [{key, label, sub, spec}], bases (non-magical), then unique and set items. */
  let pickList = null;
  function picks() {
    if (pickList) return pickList;
    const out = [];
    for (const b of C.bases.values()) {
      if (!b.spawnable && !b.quest && b.code !== "gld" && !/^(pk|t[0-9]|bet|ceh|fed|tes|ubr)/.test(b.code)) continue;
      const plain = b.name.replace(/ÿc./g, "");
      out.push({key: "b:" + b.code, label: plain, sub: b.cat === "Other" ? "Misc" : b.cat, spec: {code: b.code}});
    }
    for (const u of C.uniques) {
      const b = base(u.code);
      if (!b) continue;
      out.push({key: "u:" + u.index, label: u.name, sub: (u.kind === "SET" ? "Set" : "Unique") + " · " +
        b.name.replace(/ÿc./g, ""), spec: {code: u.code, quality: u.kind, uni: u.index, id: true}});
    }
    pickList = out;
    return out;
  }

  /* Search the pick list: the best matches first (whole word starts, then anywhere). */
  function search(text, limit) {
    const q = text.trim().toLowerCase();
    if (!q) return [];
    const words = q.split(/\s+/);
    const scored = [];
    for (const p of picks()) {
      const hay = (p.label + " " + p.sub + " " + p.spec.code).toLowerCase();
      if (!words.every((w) => hay.indexOf(w) >= 0)) continue;
      const l = p.label.toLowerCase();
      const score = (l === q ? 0 : l.startsWith(q) ? 1 : hay.split(/[\s·(),]+/).some((w) => w.startsWith(words[0])) ? 2 : 3) +
                    (p.key[0] === "b" ? 0 : 0.5);
      scored.push([score, p]);
    }
    scored.sort((a, b) => a[0] - b[0] || a[1].label.localeCompare(b[1].label));
    return scored.slice(0, limit || 30).map((x) => x[1]);
  }

  /* ---------------------------------------------------------------- an item copied in the game

     BH copies the item under the mouse when the player presses Ctrl+C (StashExport::CopyItemJSONToClipboard): its
     base's name (type), quality, item level, place, ethereal, unidentified, sockets, defense, quantity, its own name,
     runeword, the items in its sockets, and its stats (the item's own stat list: a stat's id and value, life and mana
     as shown; skills, skill tabs, class skills, charges and chances to cast by name). */
  const QUALITY_WORDS = {None: "NORM", Inferior: "INF", Normal: "NORM", Superior: "SUP", Magic: "MAG", Set: "SET",
                         Rare: "RARE", Unique: "UNI", Crafted: "CRAFT"};
  const PLACE_WORDS = {Inventory: "INVENTORY", Equip: "EQUIPPED", Belt: "INVENTORY", Cube: "CUBE", Stash: "STASH"};
  const TAB_IDS = {"Bow and Crossbow Skills (Amazon)": 0, "Passive and Magic Skills (Amazon)": 1,
    "Javalin and Spear Skills (Amazon)": 2, "Fire Skills (Sorceress)": 8, "Lightning Skills (Sorceress)": 9,
    "Cold Skills (Sorceress)": 10, "Curses Skills (Necromancer)": 16, "Poison and Bone Skills (Necromancer)": 17,
    "Summoning Skills (Necromancer)": 18, "Combat Skills (Paladin)": 24, "Offensive Auras (Paladin)": 25,
    "Defensive Auras (Paladin)": 26, "Combat Skills (Barbarian)": 32, "Masteries (Barbarian)": 33,
    "Warcries (Barbarian)": 34, "Summoning (Druid)": 40, "Shapeshifting (Druid)": 41, "Elemental (Druid)": 42,
    "Traps (Assassin)": 48, "Shadow Desciplines (Assassin)": 49, "Martial Arts (Assassin)": 50};
  const CLASS_SKILL_IDS = {"Amazon Skills": 0, "Sorceress Skills": 1, "Necromancer Skills": 2, "Paladin Skills": 3,
                           "Barbarian Skills": 4, "Druid Skills": 5, "Assassin Skills": 6};
  const CAST_ON = [[/on attack/i, 195], [/when you kill|on kill/i, 196], [/when you die|on death/i, 197],
                   [/on striking/i, 198], [/level.?up/i, 199], [/when casting|on cast/i, 200], [/when struck/i, 201]];
  const plainName = (s) => String(s || "").replace(/ÿc./g, "").trim().toLowerCase();

  function skillId(name, prefer) {
    const n = plainName(name);
    let best = null;
    for (const s of C.skills.values()) {
      if (plainName(s.name) !== n) continue;
      if (prefer && prefer.has(s.id)) return s.id;
      if (best === null || (s.cls && !C.skills.get(best).cls)) best = s.id;
    }
    return best;
  }

  /* One stat of BH's copy -> [stat, param, value as shown], or a note. oskills: the unique's or set item's own
     table decides between +N to a skill (107) and +N to a skill of another class (97). */
  function gameStat(st, oskills) {
    if (st.stat_id !== undefined) return [+st.stat_id, 0, +st.value];
    if (st.skill !== undefined && st.charges !== undefined) {
      const id = skillId(st.skill);
      const cur = parseInt(String(st.charges), 10);
      return id === null ? "charges of " + st.skill : [204, (id << 6) | ((+st.level || 0) & 63), isNaN(cur) ? 1 : cur];
    }
    if (st.chance !== undefined) {
      const m = CAST_ON.find(([re]) => re.test(st.name || ""));
      const sk = /level \d+ (.+?) (?:on|when)/i.exec(st.name || "");
      const id = sk ? skillId(sk[1]) : null;
      return m && id !== null ? [m[1], (id << 6) | ((+st.level || 0) & 63), +st.chance] : "chance to cast: " + st.name;
    }
    if (st.skill !== undefined && TAB_IDS[st.skill] !== undefined) return [188, TAB_IDS[st.skill], +st.value];
    if (st.skill !== undefined && CLASS_SKILL_IDS[st.skill] !== undefined) return [83, CLASS_SKILL_IDS[st.skill], +st.value];
    if (st.skill !== undefined && /^\+\d+ to /.test(st.name || "")) {
      const id = skillId(st.skill, oskills);
      if (id === null) return "skill " + st.skill;
      return [oskills && oskills.has(id) ? 97 : 107, id, +st.value];
    }
    return st.name ? String(st.name) : "a stat";
  }

  /* BH's Ctrl+C text -> {spec, notes}; throws on text that isn't an item BH copied. */
  function fromGame(text) {
    let o;
    try { o = JSON.parse(String(text).trim()); } catch (e) { throw new Error("that isn't what BH copies (Ctrl+C in game)"); }
    if (Array.isArray(o)) o = o[0];
    if (!o || typeof o !== "object" || typeof o.type !== "string") throw new Error("that isn't an item BH copied");
    const cands = [...C.bases.values()].filter((b) => plainName(b.name) === plainName(o.type));
    if (!cands.length) throw new Error(`no base is called "${o.type}"`);
    const b = cands.find((x) => x.spawnable) || cands[0];
    const quality = o.isGem || o.isRune ? "NORM" : QUALITY_WORDS[o.quality] || "NORM";
    const spec = {code: b.code, quality, ilvl: +o.iLevel || 1, eth: !!o.isEthereal, id: !o.unidentified,
                  sockets: +o.sockets || 0, place: PLACE_WORDS[o.location] || "INVENTORY", stats: [], noProps: true};
    if (o.quantity) spec.qty = +o.quantity;
    if (o.defense) spec.def = +o.defense;
    if (o.isRuneword) spec.rw = String(o.runeword || "Runeword");
    let oskills = null;
    if (quality === "UNI" || quality === "SET") {
      const u = C.uniques.find((x) => x.name === o.name && x.code === b.code) || C.uniques.find((x) => x.name === o.name);
      if (u) {
        spec.uni = u.index;
        oskills = new Set(u.props.filter(([sid]) => sid === 97).map(([, p]) => p));
      }
    } else if (o.name && spec.id) spec.name = String(o.name);
    const notes = [];
    for (const st of o.stats || []) {
      const s = gameStat(st, oskills);
      if (Array.isArray(s)) spec.stats.push(s); else notes.push(s);
    }
    if (Array.isArray(o.socketed) && o.socketed.length) {
      spec.filled = o.socketed.length;
      spec.sockStats = [];
      let plain = 0;
      for (const f of o.socketed) {
        if (!f.stats) { plain++; continue; }
        for (const st of f.stats) {
          const s = gameStat(st, null);
          if (Array.isArray(s)) spec.sockStats.push(s);
        }
      }
      if (plain) notes.push(`${plain} socketed rune${plain > 1 ? "s or gems" : " or gem"}: BH's copy leaves out what they add`);
    }
    return {spec, notes};
  }

  /* ItemStatCost's descfunc forms (shop_map.describe): the value before (descval 1) or after (2) the string. */
  function describeStat(func, val, pos, s2, v) {
    const plus = v >= 0 ? "+" : "";
    if (pos.indexOf("%d") >= 0) return pos.replace("%d", String(v)).replace(/%%/g, "%");
    const forms = {1: plus + v, 2: v + "%", 3: String(v), 4: plus + v + "%", 5: v + "%", 6: plus + v, 7: v + "%",
                   8: plus + v + "%", 9: String(v), 12: plus + v, 19: String(v), 20: "-" + v + "%"};
    const n = forms[func] !== undefined ? forms[func] : String(v);
    let text = val === 0 ? pos : val === 2 ? pos + " " + n : n + " " + pos;
    if (func >= 6 && func <= 9 && s2) text += " " + s2;
    return text;
  }

  /* A stat's line as the game words it (shop_map.stat_text): v as shown; clvl for the per-level stats. */
  function statLine(sid, p, v, clvl) {
    const st = C.stats.get(sid);
    if (!st || !st.func) return statLabel(sid, p, v);
    if (st.op === 2 && clvl) v = Math.floor(v * clvl / (1 << st.opParam));  // per level, at the character's level
    const S = (k) => C.strings[k] || "";
    const plus = v >= 0 ? "+" : "";
    const sk = (id) => { const s = C.skills.get(id); return s ? s.name : String(id); };
    switch (st.func) {
      case 13: return plus + v + " " + S("class:" + p + ":StrAllSkills");
      case 14: {
        const cls = p >> 3, tab = p & 7;
        return S("class:" + cls + ":StrSkillTab" + (tab + 1)).replace("%d", String(v)) + " " + S("class:" + cls + ":StrClassOnly");
      }
      case 27: {
        const s = C.skills.get(p), cls = s ? CLASS_CODES.indexOf(s.cls) : -1;
        return plus + v + " to " + sk(p) + (cls >= 0 ? " " + S("class:" + cls + ":StrClassOnly") : "");
      }
      case 28: return plus + v + " to " + sk(p);
      case 24: return "Level " + (p & 63) + " " + sk(p >> 6) + " " + st.text.replace("%d", String(v)).replace("%d", String(v));
      case 15: return st.text.replace("%d%%", v + "%").replace("%d", String(p & 63)).replace("%s", sk(p >> 6));
      case 16: return st.text.replace("%d", String(v)).replace("%s", sk(p));
    }
    if (sid === 17) return "+" + v + "% Enhanced Damage";
    return describeStat(st.func, st.val, sid === 7 || sid === 9 || v >= 0 ? st.text : st.neg, st.str2, v);
  }
  const CLASS_CODES = ["ama", "sor", "nec", "pal", "bar", "dru", "ass"];

  /* The affix lines of an item, top first (highest descpriority first; a group of equal values as its one line). */
  function statLines(it, clvl) {
    const own = Object.keys(it.own).map((k) => { const [s, p] = k.split(","); return [+s, +(p || 0), it.own[k]]; })
      .filter(([s, , v]) => v && !HIDDEN_STATS.has(s) && C.stats.get(s));
    const shown = (s, v) => Math.trunc(v / (1 << ((C.stats.get(s) || {}).shift || 0)));
    const groups = {};
    for (const [s, , v] of own) { const g = C.stats.get(s).dgrp; if (g) (groups[g] = groups[g] || []).push([s, v]); }
    const members = {};
    for (const st of C.stats.values()) if (st.dgrp) (members[st.dgrp] = members[st.dgrp] || []).push(st.id);
    own.sort((x, y) => (C.stats.get(y[0]).pri - C.stats.get(x[0]).pri) || (y[0] - x[0]) || (y[1] - x[1]));
    const out = [], done = new Set();
    for (const [s, p, v] of own) {
      if (done.has(s + "," + p)) continue;
      const st = C.stats.get(s), g = st.dgrp;
      if (g && groups[g].length === members[g].length && new Set(groups[g].map((x) => x[1])).size === 1) {
        for (const m of members[g]) done.add(m + ",0");
        out.push(describeStat(st.gfunc, st.gval, st.gpos, "", shown(s, v)));
        continue;
      }
      out.push(statLine(s, p, shown(s, v), clvl));
    }
    return out;
  }

  /* A stat in words: "+1 to Lightning Skills (Sorceress)", "+40 to Life", "+3 to Nova". */
  function statLabel(sid, p, v) {
    const sk = (id) => { const s = C.skills.get(id); return s ? s.name : "skill " + id; };
    const plus = (v >= 0 ? "+" : "") + v;
    if (sid === 107 || sid === 97) return `${plus} to ${sk(p)}${sid === 97 ? " (any class)" : ""}`;
    if (sid === 83) return `${plus} to ${Object.keys(CLASS_SKILL_IDS).find((k) => CLASS_SKILL_IDS[k] === p) || "class " + p}`;
    if (sid === 188) return `${plus} to ${Object.keys(TAB_IDS).find((k) => TAB_IDS[k] === p) || "skill tab " + p}`;
    if (sid === 204) return `Level ${p & 63} ${sk(p >> 6)} (${v} charges)`;
    if (sid >= 195 && sid <= 201) return `${v}% chance to cast level ${p & 63} ${sk(p >> 6)}`;
    const s = C.stats.get(sid);
    const text = s && s.text ? s.text : (s ? s.name : "stat " + sid);
    if (/%\+?d/.test(text)) return text.replace(/%\+d/, plus).replace(/%d/, String(v)).replace(/%%/g, "%");
    return `${plus} ${text}${p ? " (" + p + ")" : ""}`;
  }

  /* ---------------------------------------------------------------- the hover box

     The game's hover box as one string drawn bottom up (shop_map.tooltip's order): the sockets line, the affix lines
     (blue), the filter's description (its first line lowest), the item and affix level, the base lines, the name, the
     Cost in a shop; a color carries on to the line above. */
  const QUALITY_TINT = {UNI: "2B2215", SET: "1C3418", RARE: "31311E", CRAFT: "2F2102", MAG: "1D1D31"};
  const CLASS_ONLY = [10917, 10918, 10919, 10920, 10921, 10922, 10923];
  const HIDDEN_STATS = new Set([14, 16, 17, 18, 21, 22, 23, 24, 31, 70, 72, 73, 92, 159, 160, 194, 356, 360]);

  function hoverText(it, r, ctx, opts) {
    opts = opts || {};
    const b = it.base, S = (id) => C.strings[id] || "";
    const W = "\u00ffc0", BLUE = "\u00ffc3", RED = "\u00ffc1", GRAY = "\u00ffc5";
    const v = (sid, p) => it.stats[p ? sid + "," + p : String(sid)] || 0;
    const shown = (sid, p) => {
      const s = C.stats.get(sid);
      return Math.trunc(v(sid, p) / (1 << (s ? s.shift : 0)));
    };
    const up = [];  // bottom first
    if (v(360)) up.push(RED + "Corrupted");
    if (it.eth) up.push(BLUE + S(22745));
    if (v(194)) up.push(BLUE + S(3453) + " (" + v(194) + ")");
    if (it.id) {
      const ed = it.base.armor ? shown(16, 0) : shown(17, 0);
      const lines = statLines(it, ctx && ctx.clvl).map((l) => BLUE + l);
      if (ed) lines.unshift(BLUE + "+" + ed + "% Enhanced " + (it.base.armor ? "Defense" : "Damage"));
      for (const l of lines.reverse()) up.push(l);
    }
    if (r && r.desc) for (const l of r.desc.split("\n")) up.push(l);
    if (opts.itemLevel) up.push(W + "Item Level: " + it.ilvl);
    const base = [];  // top first
    if (b.armor && v(31)) base.push(W + S(3461) + " " + (it.own["16"] || it.own["31"] ? BLUE : W) + v(31));
    if (b.groups.indexOf("SHIELD") >= 0 && b.block) base.push(W + S(11018) + W + b.block + "%");
    if (b.weapon && b.dmg) {
      const ed = it.own["17"] || 0, col = ed || it.own["21"] || it.own["22"] ? BLUE : W;
      const dmg = (lo, hi) => [Math.floor(lo * (100 + ed) / 100) + (it.own["21"] || 0),
                               Math.floor(hi * (100 + ed) / 100) + (it.own["22"] || 0)];
      if ((b.min2 || b.max2) && b.hand & 2) { const [lo, hi] = dmg(b.min2, b.max2); base.push(W + S(3466) + " " + col + lo + " " + S(3464) + " " + hi); }
      if ((b.mindam || b.maxdam) && b.hand & 1) { const [lo, hi] = dmg(b.mindam, b.maxdam); base.push(W + S(3465) + " " + col + lo + " " + S(3464) + " " + hi); }
      if (b.throw && (b.minmis || b.maxmis)) base.push(W + S(3467) + " " + b.minmis + " " + S(3464) + " " + b.maxmis);
    }
    if (b.dur && !b.nodur) base.push(W + S(3457) + " " + b.dur + " " + S(3463) + " " + b.dur);
    if (b.cls >= 0) base.push((ctx && ctx.cls === b.cls ? W : RED) + S(CLASS_ONLY[b.cls]));
    if (b.reqdex) base.push(W + S(3459) + " " + b.reqdex);
    if (b.reqstr) base.push(W + S(3458) + " " + b.reqstr);
    if (it.lvlreq > 1) base.push((ctx && ctx.clvl >= it.lvlreq ? W : RED) + S(3469) + " " + it.lvlreq);
    for (const l of base.reverse()) up.push(l);
    for (const l of (r && r.name ? r.name : it.gameName || "").split("\n")) up.push(l);
    return up.join("\n");
  }

  /* The stats a player can add, by name: [{id, name}] (the game's own wording where it has one). */
  function statChoices() {
    const out = [];
    for (const s of C.stats.values()) {
      const t = s.text ? s.text.replace(/%[a-z0-9+]+/gi, "").replace(/\s+/g, " ").trim() : "";
      out.push({id: s.id, name: (t ? t[0].toUpperCase() + t.slice(1) : s.name) + " (stat " + s.id + ")"});
    }
    return out;
  }

  return {init, base, unique, make, describe, picks, search, statChoices, statLabel, statLine, statLines, gameName,
          fromGame, hoverText,
          QUALITY_TINT, QUALITY_NAMES,
          catalog: () => C};
})();

/* ---- tools/editor/share.js ---- */
/* Taking edits in and out of the editor: export a profile's changes as a file, a share link, or the EDITS lines of a
   saved filter; import any of them (as a new profile or over the current one). Everything read is untrusted: parsed
   as data, size-capped, normalized, never put into the page as HTML. */
var EZ = typeof EZ !== "undefined" ? EZ : {};
EZ.share = (function () {
  "use strict";
  const {h, toast, dialog} = EZ.ui;
  const LINK_KEY = "e=";
  const DISCORD = 2000;

  function payload(p) {
    return {app: "erazure-filter-editor", v: EZ.store.SCHEMA, name: p.name, file: p.file, edits: p.edits};
  }

  function exportFile(app) {
    const p = EZ.store.current();
    const text = JSON.stringify(payload(p), null, 1);
    const url = URL.createObjectURL(new Blob([text], {type: "application/json"}));
    const a = h("a", {href: url, download: app.fileName(p).replace(/\.filter$/, "") + "-changes.json"});
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    toast("Saved your changes as a file. Import it on this page (any browser) to get them back.", "good");
  }

  async function link() {
    const data = await EZ.edits.pack(payload(EZ.store.current()));
    return location.href.replace(/#.*$/, "") + "#" + LINK_KEY + data;
  }

  async function copyLink() {
    const url = await link();
    let copied = false;
    try { await navigator.clipboard.writeText(url); copied = true; } catch (e) { /* show it instead */ }
    const long = url.length > DISCORD;
    dialog({title: "Share your changes", body: [
      h("p", copied ? "The link is copied. Anyone who opens it can load your changes into their editor."
                    : "Copy this link. Anyone who opens it can load your changes into their editor."),
      h("textarea", {readonly: true, rows: 4, onfocus: (e) => e.target.select()}, url),
      long ? h("p.fe-note.warn", `The link is ${url.length.toLocaleString()} characters: too long for one Discord ` +
        "message (2,000). Share your changes as a file instead (Save changes to a file).") : null,
    ]});
  }

  /* Read an import: a saved filter (its EDITS lines), a changes file or a link. Resolves {name, file, edits} or
     throws with a message for the player. */
  async function read(text) {
    text = String(text || "").trim();
    if (!text) throw new Error("There's nothing to import.");
    if (text.length > 8 << 20) throw new Error("That's too big to be a filter or a changes file.");
    let data = null;
    const at = text.indexOf("#" + LINK_KEY);
    if (at >= 0 || /^[jz][A-Za-z0-9_-]+$/.test(text)) {
      data = await EZ.edits.unpack(at >= 0 ? text.slice(at + 1 + LINK_KEY.length) : text);
    } else if (text[0] === "{") {
      data = JSON.parse(text);
    } else {
      data = await EZ.edits.fromFile(text);
      if (!data) {
        throw new Error("This filter has no editor changes in it: it wasn't saved by the Filter Editor (or was " +
                        "edited by hand afterwards and lost its EDITS lines).");
      }
    }
    if (!data || typeof data !== "object" || data.app !== "erazure-filter-editor" || !data.edits) {
      throw new Error("That isn't a set of Filter Editor changes.");
    }
    if ((data.v || 0) > EZ.store.SCHEMA) {
      throw new Error("These changes come from a newer editor: reload the page and try again.");
    }
    const p = EZ.store.normalize({name: data.name, file: data.file, edits: data.edits});
    return {name: p.name, file: p.file, edits: p.edits};
  }

  /* Ask where the imported edits go, then put them there. */
  function offer(imported, source) {
    const n = EZ.edits.count(imported.edits);
    dialog({title: "Import changes", body: [
      h("p", h("b", imported.name), ` (${n} change${n === 1 ? "" : "s"}) ` + (source || "") + "."),
      h("p.fe-sub", "As a new profile keeps your own changes as they are; over yours replaces your current profile's " +
        "changes (Undo brings them back)."),
    ], buttons: [
      {text: "Cancel"},
      {text: "Over my current profile", onclick: () => {
        EZ.store.change((e) => {
          for (const k of Object.keys(e)) delete e[k];
          Object.assign(e, JSON.parse(JSON.stringify(imported.edits)));
        }, {label: "import"});
        toast("Imported over your current profile.", "good");
      }},
      {text: "As a new profile", primary: true, onclick: () => {
        const p = EZ.store.addProfile(imported.name, imported.edits);
        EZ.store.changeProfile((pp) => { pp.file = imported.file || pp.file; });
        toast(`Imported as the profile ${p.name}.`, "good");
      }},
    ]});
  }

  async function importText(text, source) {
    try {
      offer(await read(text), source);
    } catch (e) {
      toast(e.message || String(e), "bad", {sticky: true});
    }
  }

  function importFile() {
    const input = h("input", {type: "file", accept: ".filter,.json,.txt", style: {display: "none"}});
    input.addEventListener("change", async () => {
      const f = input.files && input.files[0];
      input.remove();
      if (!f) return;
      if (f.size > 8 << 20) { toast("That file is too big to be a filter or a changes file.", "bad"); return; }
      importText(await f.text(), "from " + f.name);
    });
    document.body.appendChild(input);
    input.click();
  }

  function importPaste() {
    const area = h("textarea", {rows: 6, placeholder: "Paste a share link, or a changes file's text"});
    dialog({title: "Import changes", body: [h("p.fe-sub", "Paste a share link or the text of a changes file."), area],
      buttons: [{text: "Cancel"}, {text: "Import", primary: true, onclick: () => { importText(area.value, "pasted"); }}]});
  }

  /* A share link opened: offer its changes (once), then take it out of the address. */
  async function fromLocation() {
    const m = /#e=([jz][A-Za-z0-9_-]+)/.exec(location.hash || "");
    if (!m) return false;
    try { history.replaceState(null, "", location.href.replace(/#.*$/, "") + "#start"); } catch (e) { /* file: */ }
    await importText(m[1], "from a share link");
    return true;
  }

  return {exportFile, copyLink, read, offer, importText, importFile, importPaste, fromLocation, link};
})();

/* ---- tools/editor/app.js ---- */
/* The Filter Editor's frame: loads the filter's source, keeps the player's profile, draws the bar, the sidebar of
   areas (each area is a module that registers itself in EZ.areas), the chosen area and the preview column, and builds,
   saves and downloads the player's filter. */
var EZ = typeof EZ !== "undefined" ? EZ : {};
EZ.areas = EZ.areas || [];
EZ.app = (function () {
  "use strict";
  const {h, fill, toast, dialog, menu} = EZ.ui;
  const SOURCE_FILE = "Erazure-Filter-Editor-Source.js";
  const STYLES = {erazure: null, minimal: "minimal.filter", corrlorized: "corrlorized.edits"};
  const STYLE_NAMES = {erazure: "Erazure", minimal: "Minimal", corrlorized: "Corrlorized"};

  const app = {src: null, data: null, root: null, area: "start", sub: "", els: {}, building: null};

  /* ---------------------------------------------------------------- the source */

  function sourceUrl(scriptSrc, v) {
    const q = v && !v.startsWith("__") ? "?v=" + v : "";
    if (scriptSrc) {
      try { return new URL("../../" + SOURCE_FILE + q, scriptSrc).href; } catch (e) { /* the file's own name */ }
    }
    return SOURCE_FILE + q;
  }

  /* The game art's folder (Erazure-Filter-Editor-Assets): beside the source file. */
  function assetBase(scriptSrc) {
    if (scriptSrc) {
      try { return new URL("../../Erazure-Filter-Editor-Assets/", scriptSrc).href; } catch (e) { /* beside the page */ }
    }
    return "Erazure-Filter-Editor-Assets/";
  }

  function loadSource(url) {
    return new Promise((resolve, reject) => {
      if (window.ERAZURE_EDITOR_SOURCE) { resolve(window.ERAZURE_EDITOR_SOURCE); return; }
      const s = document.createElement("script");
      s.src = url;
      s.onload = () => window.ERAZURE_EDITOR_SOURCE ? resolve(window.ERAZURE_EDITOR_SOURCE)
                                                     : reject(new Error("the filter's data file is empty"));
      s.onerror = () => reject(new Error("the filter's data file didn't load"));
      document.head.appendChild(s);
    });
  }

  /* ---------------------------------------------------------------- versions */

  function toggleName(base) {
    const parts = [];
    if (base.revealed) parts.push("Revealed");
    if (base.bigGG) parts.push("BIG GG");
    if (base.poe || base.style === "corrlorized") parts.push("PoE");
    if (!base.revealed && !base.bigGG) parts.unshift("Main");
    return "Erazure - " + parts.join(" - ");
  }

  /* The launcher version the player's base is: one of the source's variants. */
  function variantFor(base) {
    const toggle = toggleName(base), style = STYLES[base.style];
    return app.src.variants.find((v) => v.toggle === toggle && (v.style || null) === style) || null;
  }

  function variant() { return variantFor(EZ.store.current().edits.base); }

  /* A version's lines in alias form, before any edit (cached: the areas read them to list what can change). */
  const lineCache = new Map();
  function versionLines(v) {
    v = v || variant();
    if (!lineCache.has(v.name)) lineCache.set(v.name, EZ.core.variantLines(app.src, v));
    return lineCache.get(v.name);
  }

  /* What the player's edits change beyond their version: {count, warn, byArea} (each edit module counts its own). */
  function changes() {
    const out = {count: 0, warn: 0, byArea: {}};
    const e = EZ.store.current().edits;
    for (const a of EZ.areas) {
      const n = a.count ? a.count(e, app) : 0, w = a.warn ? a.warn(e, app) : 0;
      out.byArea[a.id] = {n, w};
      out.count += n;
      out.warn += w;
    }
    return out;
  }

  /* ---------------------------------------------------------------- building and saving */

  /* The player's filter: {bytes, lines, name, variant, crc, report}. EZ.edits applies the edits when that module is
     there; with none the file is the launcher's. */
  async function build() {
    const p = EZ.store.current(), v = variant();
    let lines = EZ.core.variantLines(app.src, v), report = null;
    if (EZ.edits && EZ.edits.apply) {
      const r = EZ.edits.apply(app.src, p, lines, app);
      lines = r.lines;
      report = r.report;
    }
    lines = EZ.core.written(app.src, lines);
    if (report && report.count) lines = (await EZ.edits.headerLines(app.src, p, v, report.count)).concat(lines);
    const bytes = EZ.core.encode(lines);
    return {bytes, lines, name: fileName(p), variant: v, crc: EZ.core.crc32(bytes), report};
  }

  function fileName(p) {
    const base = (p.file || "Erazure-Custom").replace(/\.filter$/i, "").replace(/[\\/:*?"<>|]+/g, "-").trim();
    return (base || "Erazure-Custom") + ".filter";
  }

  /* Build in the next frame (the page shows that it's working), then hand the file to fn. */
  function withBuild(what, fn) {
    if (app.building) return;
    const done = toast(h("span", h("span.fe-spin"), " " + what + "…"), null, {sticky: true});
    app.building = true;
    setTimeout(async () => {
      try {
        await fn(await build());
      } catch (e) {
        if (e && e.name === "AbortError") return;
        toast("Couldn't build your filter: " + (e && e.message || e), "bad", {sticky: true});
        if (window.console) console.error(e);
      } finally {
        app.building = false;
        done();
      }
    }, 30);
  }

  function download(built) {
    const url = URL.createObjectURL(new Blob([built.bytes], {type: "application/octet-stream"}));
    const a = h("a", {href: url, download: built.name});
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    saved(built, "download");
  }

  function saved(built, how, folder) {
    EZ.store.changeProfile((p) => {
      p.saved = {version: app.src.version, build: app.src.build, at: Date.now(), crc: built.crc, how, folder: folder || "",
                 file: built.name};
    });
    EZ.store.remember(EZ.store.current(), how === "download" ? "downloaded" : "saved to the game");
    if (how === "download") {
      toast(h("span", "Downloaded ", h("b", built.name), ". Put it in Diablo II\\ProjectD2\\filters\\local and pick it " +
              "in the launcher (Local Filter, then Save Filter)."), "good", {ms: 9000});
    } else {
      toast(h("span", "Saved ", h("b", built.name), " in ", h("b", folder), ". In game, press Numpad 0 to reload it."),
            "good", {ms: 7000});
    }
    redraw();
  }

  const canSaveInPlace = () => window.isSecureContext && "showDirectoryPicker" in window;

  async function folderHandle(ask) {
    let dir = await EZ.store.kvGet("dir");
    if (dir && dir.queryPermission) {
      let state = await dir.queryPermission({mode: "readwrite"});
      if (state === "prompt") state = await dir.requestPermission({mode: "readwrite"});
      if (state === "granted") return dir;
    }
    if (!ask) return null;
    dir = await window.showDirectoryPicker({id: "pd2-filters-local", mode: "readwrite"});
    await EZ.store.kvSet("dir", dir);
    return dir;
  }

  async function writeInPlace(built, dir) {
    let old = null;
    try {
      const f = await (await dir.getFileHandle(built.name)).getFile();
      old = await f.arrayBuffer();
    } catch (e) { /* no file yet */ }
    if (old && old.byteLength) {
      const bak = await dir.getFileHandle(built.name + ".bak", {create: true});
      const w = await bak.createWritable();
      await w.write(old);
      await w.close();
    }
    const fh = await dir.getFileHandle(built.name, {create: true});
    const w = await fh.createWritable();
    await w.write(built.bytes);
    await w.close();
  }

  /* What a module wants the player to know before saving (EZ.app.checks: fn(app) -> {text, area} or null): a
     dialog lists them, with Save anyway or Fix them (the first one's area). */
  function checked(then) {
    const issues = app.checks.map((f) => { try { return f(app); } catch (e) { return null; } }).filter(Boolean);
    if (!issues.length) { then(); return; }
    dialog({title: "Before you save", body: [
      h("p", "BH will trip over some of your changes:"),
      h("ul", issues.map((x) => h("li", x.text))),
      h("p.fe-sub", "Save anyway, or fix them first.")],
      buttons: [{text: "Fix them", onclick: () => { const at = issues.find((x) => x.area); if (at) go(at.area); }},
                {text: "Save anyway", primary: true, onclick: () => { then(); }}]});
  }

  function saveToGame() { checked(saveNow); }

  function saveNow() {
    if (!canSaveInPlace()) { withBuild("Building your filter", download); return; }
    withBuild("Saving your filter", async (built) => {
      let dir = await folderHandle(false);
      if (!dir) {
        const ok = await new Promise((resolve) => dialog({
          title: "Save straight into your game",
          body: [
            h("p", "Pick the folder ", h("code", "Diablo II\\ProjectD2\\filters\\local"), ". The editor saves ",
              h("b", built.name), " there, keeps the one it replaces as ", h("code", built.name + ".bak"),
              " and remembers the folder for next time."),
            h("ol.fe-steps",
              h("li", "Pick the ", h("b", "local"), " folder (inside ProjectD2\\filters)."),
              h("li", "Once: in the launcher open Item Filter Profiles, click ", h("b", "Local Filter"), ", pick ",
                h("b", built.name), " and click ", h("b", "Save Filter"), "."),
              h("li", "After every save here, press ", h("kbd", "Numpad 0"), " in game: the filter reloads.")),
          ],
          buttons: [{text: "Download instead", onclick: () => resolve("download")},
                    {text: "Pick the folder", primary: true, onclick: () => resolve("pick")}],
          onclose: () => resolve(null),
        }));
        if (ok === "download") { download(built); return; }
        if (ok !== "pick") return;
        dir = await folderHandle(true);
      }
      if (dir.name !== "local" && !(await new Promise((resolve) => dialog({
        title: "Is this the right folder?",
        body: [h("p", "The folder you picked is ", h("b", dir.name), ". The launcher's local filters live in ",
                 h("code", "Diablo II\\ProjectD2\\filters\\local"), ". Save here anyway?")],
        buttons: [{text: "Pick another", onclick: async () => { await EZ.store.kvSet("dir", undefined); resolve(false); }},
                  {text: "Save here", primary: true, onclick: () => resolve(true)}],
        onclose: () => resolve(false),
      })))) return;
      await writeInPlace(built, dir);
      saved(built, "folder", dir.name);
    });
  }

  async function forgetFolder() {
    await EZ.store.kvSet("dir", undefined);
    toast("The editor forgot the game folder; the next save asks for it again.");
  }

  /* ---------------------------------------------------------------- the frame */

  function go(area, sub, opts) {
    if (!EZ.areas.some((a) => a.id === area)) area = "start";
    app.area = area;
    app.sub = sub || "";
    const hash = "#" + area + (app.sub ? "/" + app.sub : "");
    if (location.hash !== hash) {
      try { history[opts && opts.replace ? "replaceState" : "pushState"](null, "", hash); } catch (e) { /* file: */ }
    }
    app.els.root.classList.remove("nav-open");
    drawArea();
    drawSide();
    if (!(opts && opts.keepScroll)) {
      const top = app.els.root.getBoundingClientRect().top + window.scrollY - topOffset();
      if (window.scrollY > top) window.scrollTo({top});
    }
  }

  function topOffset() {
    const v = getComputedStyle(app.els.root).getPropertyValue("--top").trim();
    if (v.endsWith("rem")) return parseFloat(v) * parseFloat(getComputedStyle(document.documentElement).fontSize);
    return parseFloat(v) || 0;
  }

  function fromHash() {
    const m = /^#([a-z-]+)(?:\/(.*))?$/.exec(location.hash || "");
    if (m && EZ.areas.some((a) => a.id === m[1])) {
      app.area = m[1];
      app.sub = m[2] ? decodeURIComponent(m[2]) : "";
    }
  }

  function drawBar() {
    const p = EZ.store.current(), v = variant(), ch = changes();
    const bar = app.els.bar;
    const stale = p.saved && p.saved.version !== app.src.version;
    const saveBtn = h("button.fe-btn.primary", {type: "button", onclick: saveToGame,
      title: canSaveInPlace() ? "Save your filter into the game's filters\\local folder" : "Download your filter"},
      canSaveInPlace() ? "Save to game" : "Download");
    const more = h("button.fe-btn", {type: "button", "aria-label": "More ways to save", "aria-haspopup": "menu"}, "▾");
    more.addEventListener("click", () => menu(more, [
      {text: "Download the file", sub: "to put in filters\\local yourself", onclick: () => checked(() =>
        withBuild("Building your filter", download))},
      canSaveInPlace() ? {text: "Forget the game folder", sub: "the next save asks for it again", onclick: forgetFolder} : null,
      {text: "Save changes to a file", sub: "to keep or move them (import it here)", onclick: () => EZ.share.exportFile(app)},
      {text: "Copy a share link", sub: "anyone opening it can load your changes", onclick: () => EZ.share.copyLink()},
      {text: "Import changes", sub: "a changes file, or a filter this editor saved", onclick: () => EZ.share.importFile()},
      ...(EZ.app.saveMenu || []).map((f) => f(app)),
    ]));
    fill(bar,
      h("button.fe-btn.ghost.fe-only-phone", {type: "button", "aria-label": "Areas", onclick: () => {
        app.els.root.classList.toggle("nav-open");
      }}, "☰"),
      h("div.fe-title", h("b", p.name)),
      h("button.fe-chip", {type: "button", title: "Your version: change it on Start", onclick: () => go("start")},
        v ? v.launcher : "?"),
      h("span.fe-chip" + (ch.count ? ".good" : ""), {title: "Your changes to Erazure"},
        ch.count ? EZ.ui.plural(ch.count, "change") : "No changes"),
      ch.warn ? h("button.fe-chip.warn", {type: "button", title: "Changes that need a look",
        onclick: () => go("changes")}, "⚠ " + ch.warn) : null,
      h("span.fe-chip" + (stale ? ".warn" : ""), {title: stale ? "Erazure has changed since you last saved: save " +
        "again to get the new version with your changes" : "The Erazure version this page builds"},
        stale ? "Update: " + app.src.version : app.src.version),
      app.els.search || null,
      h("span.fe-bar-gap"),
      h("button.fe-btn.ghost", {type: "button", onclick: () => EZ.store.undoStep(), disabled: !EZ.store.canUndo(),
        title: "Undo (Ctrl+Z)"}, "↶"),
      h("button.fe-btn.ghost", {type: "button", onclick: () => EZ.store.redoStep(), disabled: !EZ.store.canRedo(),
        title: "Redo (Ctrl+Y)"}, "↷"),
      h("button.fe-btn.fe-only-narrow", {type: "button", onclick: togglePreview, "aria-expanded":
        String(app.els.root.classList.contains("pv-open"))}, "Preview"),
      h("span.fe-row", {style: {gap: "0"}}, saveBtn, more));
  }

  function drawSide() {
    const ch = changes();
    const list = h("ul.fe-nav");
    let group = null;
    for (const a of EZ.areas) {
      if (group !== null && a.group !== group) list.appendChild(h("li.fe-nav-sep", {"aria-hidden": "true"}));
      group = a.group;
      const c = ch.byArea[a.id] || {n: 0, w: 0};
      list.appendChild(h("li", h("button", {type: "button", "aria-current": a.id === app.area ? "page" : null,
        title: a.title, onclick: () => go(a.id)},
        h("span.ic", {"aria-hidden": "true"}, a.icon), h("span.lbl", a.title),
        c.w ? h("span.n.warn", {title: `${c.w} need a look`}, "⚠" + c.w) : c.n ? h("span.n", String(c.n)) : null)));
    }
    fill(app.els.side, h("nav", {"aria-label": "Editor areas"}, list));
  }

  function drawArea() {
    const a = EZ.areas.find((x) => x.id === app.area) || EZ.areas[0];
    const box = app.els.area;
    fill(box);
    try {
      a.render(box, app);
    } catch (e) {
      fill(box, h("p.fe-note.bad", "This area failed to draw: " + (e && e.message || e)));
      if (window.console) console.error(e);
    }
  }

  function drawPreview() {
    const box = app.els.preview;
    if (EZ.preview && EZ.preview.render) {
      EZ.preview.render(box, app);
    } else {
      fill(box, h("div.fe-pv-head", h("h3", "Preview")),
        h("div.fe-pv-body", h("p.fe-sub", "The preview comes in a later step of the editor's build.")));
    }
  }

  function togglePreview() {
    app.els.root.classList.toggle("pv-open");
    drawBar();
  }

  function redraw() {
    drawBar();
    drawSide();
    drawArea();
  }

  function frame(root) {
    const bar = h("header.fe-bar");
    const side = h("aside.fe-side");
    const area = h("main.fe-area", {tabindex: "-1"});
    const preview = h("aside.fe-preview", {"aria-label": "Preview"});
    const grip = h("div.fe-grip", {title: "Drag to make the preview wider or narrower", "aria-hidden": "true"});
    fill(root, bar, side, area, preview);
    preview.appendChild(grip);
    const inner = h("div.fe-preview-inner");
    preview.appendChild(inner);
    Object.assign(app.els, {root, bar, side, area, preview: inner, grip});
    grip.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      const x0 = e.clientX, w0 = preview.getBoundingClientRect().width;
      const move = (ev) => {
        const w = Math.max(340, Math.min(window.innerWidth * 0.6, w0 + (x0 - ev.clientX)));
        root.style.setProperty("--pw", Math.round(w) + "px");
      };
      const up = () => {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
        try { localStorage.setItem("erazure-filter-editor-pw", root.style.getPropertyValue("--pw")); } catch (er) { /**/ }
      };
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
    });
    try {
      const pw = localStorage.getItem("erazure-filter-editor-pw");
      if (pw) root.style.setProperty("--pw", pw);
    } catch (e) { /* the default width */ }
  }

  function keys(e) {
    if (e.defaultPrevented) return;
    const t = e.target, typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable);
    if ((e.ctrlKey || e.metaKey) && !e.altKey && !typing) {
      const k = e.key.toLowerCase();
      if (k === "z" && !e.shiftKey) { if (EZ.store.undoStep()) e.preventDefault(); }

/* Items: change single items (EZ.overrides): find an item, see what Erazure and the player's filter do with it at
   every filter level, pick which of them (quality, ethereal, identified, levels, character levels) and what to do:
   show, hide, mute, another sound or icon, icon only, an alert, a changed or replaced look. */
var EZ = typeof EZ !== "undefined" ? EZ : {};
EZ.areas = EZ.areas || [];
(function () {
  "use strict";
  const {h, fill, seg, pill} = EZ.ui;
  const QUALS = [["", "Any"], ["NORM", "Normal"], ["SUP", "Superior"], ["INF", "Low quality"], ["MAG", "Magic"],
                 ["RARE", "Rare"], ["CRAFT", "Crafted"], ["SET", "Set"], ["UNI", "Unique"]];
  const ACTIONS = [
    ["show", "Show it", "Where Erazure hides it, it shows with the look Erazure's other rules give it."],
    ["hide", "Hide it", "On the ground outside town: no label, no icon, no sound. Your inventory, stash and shops " +
      "still name it."],
    ["mute", "Mute it", "No drop sound; the label, icon and chat line stay."],
    ["sound", "Another sound", "Its drop sound, wherever Erazure gives it one (or adds one)."],
    ["icon", "Another icon", "Its minimap icon, wherever Erazure gives it one."],
    ["iconOnly", "Icon only", "Keep the minimap icon; no chat line and no sound (BH gives them together)."],
    ["notify", "Add an alert", "An icon, sound and chat line of your own."],
    ["look", "Change its look", "Your text where Erazure decides its look; Erazure's tags and description stay."],
    ["replace", "Replace its look", "Your look, decided before any of Erazure's rules."],
  ];
  const ACTION_NAME = Object.fromEntries(ACTIONS.map(([k, t]) => [k, t]));
  let draft = null;  // {id (when editing), spec (the picked item), scope, action, ...}

  const plain = (s) => String(s || "").replace(/ÿc./g, "").split("\n")[0].trim();

  function newDraft(pick) {
    const q = pick.spec.quality || "";
    return {spec: Object.assign({}, pick.spec), label: pick.label,
            scope: {codes: [pick.spec.code], quality: q, eth: "any", id: "any", levels: [], clvl: ["", ""]},
            action: "hide", sound: 0, icon: "", alert: {icon: {}, sound: 0, chat: "all", tier: 4}, mode: "add",
            text: "%NAME%"};

  function summary(o) {
    const s = o.scope, cat = EZ.items.catalog();
    const names = s.codes.map((c) => { const b = cat.bases.get(c); return b ? plain(b.name) : c; });
    const q = QUALS.find(([k]) => k === (s.quality || ""));
    const bits = [(s.quality ? q[1] + " " : "") + names.slice(0, 3).join(", ") + (names.length > 3 ? ` +${names.length - 3}` : "")];
    if (s.eth === "yes") bits.push("ethereal"); else if (s.eth === "no") bits.push("not ethereal");
    if (s.id === "yes") bits.push("identified"); else if (s.id === "no") bits.push("unidentified");
    if ((s.levels || []).length) bits.push("levels " + s.levels.slice().sort((a, b) => a - b).join(", "));
    const [a, b] = s.clvl || [];
    if (a || b) bits.push("character level " + (a || 1) + "-" + (b || 99));

  /* The picked item at each filter level, Erazure's and the player's (the preview's character and place). */

        EZ.render.label(r.name, {start: r.start});

        x.map, x.dot, x.px])]) !== JSON.stringify([b.name, b.sound, b.chat, b.invisible, b.icons.map((x) => [x.border,
        x.map, x.dot, x.px])]);
      rows.push(h("tr" + (changed ? ".is-changed" : ""), h("td.fe-num", String(lv)), h("td.fe-sub.fe-small", names[lv]),
        h("td", cell(a), a.sound ? h("span.fe-pv-snd", " ♪") : null),

/* Looks: the symbols and colors around item names (Erazure's look aliases, one card per look, its labels drawn), style
   presets, a global color swap, and the minimap icons Erazure uses. */
var EZ = typeof EZ !== "undefined" ? EZ : {};
EZ.areas = EZ.areas || [];
EZ.looks = (function () {
  "use strict";
  const {h} = EZ.ui;
  const F = EZ.filter, R = EZ.render;

  /* {name: value} of a version's aliases. */
  function values(lines) {
    const out = {}, a = F.aliases(lines);
    for (const k of Object.keys(a)) out[k] = a[k].value;
    return out;
  }

  /* An output template drawn: every %ALIAS% filled (a few rounds: looks may hold other looks), %NAME% the sample. */
  function fill(tpl, vals, sample) {
    let text = tpl;
    for (let n = 0; n < 4 && /%[A-Z0-9_]+%/.test(text); n++) {
      text = text.replace(/%([A-Z0-9_]+)%/g, (m, k) => k === "NAME" || !(k in vals) ? m : vals[k]);
    }
    return R.codes(text.replace(/%NAME%/g, sample).replace(/%PERCENT%/g, "%")).replace(/%NL%/g, "\n")
      .replace(/%(?:CL|CS)%/g, " ");
  }

  function sampleFor(key, data) {
    const nc = (data.looks && data.looks.nameColor || []).find(([p]) => key.startsWith(p));
    const name = (data.looks && data.looks.sample && data.looks.sample[key]) || "Item";
    return (nc ? "%" + nc[1] + "%" : "%WHITE%") + name;
  }

  /* The looks of the style versions (Minimal's alias lines, Corrlorized's alias values from its own lines). */
  function styleValues(app, style) {
    if (style === "minimal") {
      const out = {}, lines = app.src.styles["minimal.filter"].lines;
      for (const k of Object.keys(lines)) {
        const m = F.ALIAS_RE.exec(lines[k]);
        if (m) out[k] = EZ.core.bhTrim(m[2]);
      }
      return out;
    }
    if (style === "corrlorized") {
      const v = app.src.variants.find((x) => x.style === "corrlorized.edits");
      return v ? values(app.versionLines(v)) : {};
    }
    return values(app.src.lines);
  }

  /* An icon drawn as BH draws it, scaled: the layers' boxes (8/6/4/2 game pixels) in rule order, 00 last. */
  function icon(combo, palette, scale) {
    scale = scale || 3;
    const size = 8 * scale + 4;
    const c = h("canvas", {width: size, height: size, class: "fe-icon", role: "img",
      "aria-label": combo ? "minimap icon " + combo : "no minimap icon"});
    const g = c.getContext("2d");

    for (const [l, col] of layers) if (parseInt(col, 16) === 0) draw(l, col);

  }

  function palettePicker(anchor, palette, current, onpick, allowNone) {
    const grid = h("div.fe-palette", {role: "listbox", "aria-label": "Minimap colors"});
    const close = () => { wrap.remove(); document.removeEventListener("mousedown", away, true); };
    const away = (ev) => { if (!wrap.contains(ev.target)) close(); };
    for (let i = 0; i < 256; i++) {
      const hex = i.toString(16).toUpperCase().padStart(2, "0");
      grid.appendChild(h("button.fe-swatch" + (hex === current ? ".on" : ""), {type: "button", title: hex,
        "aria-label": "color " + hex, style: {background: palette[i]}, onclick: () => { close(); onpick(hex); }}));
    }
    const wrap = h("div.fe-menu.fe-palette-menu",
      allowNone ? h("button.fe-btn.small", {type: "button", onclick: () => { close(); onpick(null); }}, "None") : null,

    wrap.style.left = Math.max(4, Math.min(r.left - rr.left, rr.width - wrap.offsetWidth - 4)) + "px";
    wrap.style.top = (r.bottom - rr.top + 4) + "px";
    setTimeout(() => document.addEventListener("mousedown", away, true));

/* Alerts: what a drop does besides its label (the chat line, the drop sound and the minimap icon). Global switches,
   and every drop sound Erazure plays with what plays it, each one swappable or silenced. */
var EZ = typeof EZ !== "undefined" ? EZ : {};
EZ.areas = EZ.areas || [];
EZ.sounds = (function () {
  "use strict";
  const {h, dialog} = EZ.ui;

  function name(data, id) {
    const n = data.sounds && data.sounds[String(id)];
    return n ? n : "sound " + id;
  }

  /* A play button when the editor has the sound's clip (the assets: EZ.sound), else the game's own test command. */
  function play(data, id) {
    if (EZ.sound) return EZ.sound.button(id, name(data, id));
    return h("span.fe-sub", {title: "Type this in the game's chat to hear it"}, `.playsound ${id}`);
  }

  /* A dialog to pick a sound: Erazure's own, PD2's PoE ones, or any by name or number. onpick(id) (0: no sound). */
  function pick(app, used, current, onpick) {
    const data = app.data;
    const search = h("input", {type: "search", placeholder: "Search sounds by name or number", "aria-label": "Search",
      style: {width: "100%"}});
    const list = h("div.fe-soundlist", {role: "listbox"});
    const all = Object.keys(data.sounds || {}).map((k) => +k);
    const row = (id, close) => h("div.fe-soundrow" + (id === current ? ".on" : ""),
      h("button.fe-btn.small", {type: "button", onclick: () => { close(); onpick(id); }}, "Pick"),
      h("span", h("b", name(data, id)), h("span.fe-sub", " #" + id)), play(data, id));
    let closeIt = null;
    const draw = () => {
      const q = search.value.trim().toLowerCase();
      EZ.ui.clear(list);
      const groups = q ? [["Matches", all.filter((id) => String(id) === q || name(data, id).toLowerCase().indexOf(q) >= 0)
        .slice(0, 300)]] : [["Erazure's drop sounds", used], ["PD2's Path of Exile drop sounds", data.poeSounds || []]];
      for (const [title, ids] of groups) {
        if (!ids.length) continue;
        list.appendChild(h("h4", title));
        for (const id of ids) list.appendChild(row(id, closeIt));
      }
      if (q && !list.children.length) list.appendChild(h("p.fe-sub", "No sound matches."));
    };
    search.addEventListener("input", draw);
    closeIt = dialog({title: "Pick a drop sound", body: [
      h("p.fe-sub", "Some of the game's sounds never play as drop sounds (looping ones and music)."),
      search, list],
      buttons: [{text: "No sound", onclick: () => onpick(0)}, {text: "Cancel"}]});
    draw();
  }

  return {name, play, pick};
})();

    const text = out.replace(/\{[^}]*\}?/, "")
      .replace(/%(CONTINUE|(BORDER|MAP|DOT|PX|LINE|NOTIFY)-[0-9a-f]{1,4}|SOUNDID-\d{1,4}|TIER-\d)%/gi, "");
    if (!text.trim()) return h("span.fe-pv-hidden", "hidden");
    return EZ.render.label(EZ.looks.fill(text, vals, sample || "%WHITE%Item"));
  }

  function alertsOf(out, app) {
    const parts = [];
    const combo = EZ.filter.icons(out);
    if (combo) parts.push(EZ.looks.icon(combo, app.data.palette || [], 2));
    for (const id of EZ.filter.sounds(out)) {
      parts.push(h("span.fe-small", "♪ " + EZ.sounds.name(app.data, id) + " "), EZ.sounds.play(app.data, id));
    }
    const tier = EZ.filter.TIER_RE.exec(out);
    if (tier && (combo || EZ.filter.sounds(out).length)) {
      parts.push(pill(+tier[1] === 0 ? "icon only" : "chat on levels 0-" + tier[1], "info"));
    }
    return parts;
  }

  /* ---------------------------------------------------------------- highlighting */

  const NOTE_WORDS = /^%(CONTINUE|(BORDER|MAP|DOT|PX|LINE|NOTIFY)-[0-9a-f]{1,4}|SOUNDID-\d{1,4}|TIER-\d)%$/i;

  function condTokens(text, bad, aliases) {
    const out = [];
    for (const part of text.split(/(\s+|[()!])/)) {
      if (!part) continue;
      if (/^\s+$/.test(part)) { out.push(part); continue; }
      let cls = "w";
      const core = part.replace(/[<>=~].*$/, "");
      if (part === "(" || part === ")" || part === "!" || /^(AND|OR|&&|\|\|)$/.test(part)) cls = "op";
      else if (bad.has(part) || bad.has(core)) cls = "bad";
      else if (aliases.has(core)) cls = "al";
      else if (/^[a-z0-9]{3}/.test(core) && !/^[0-9]+$/.test(core)) cls = "code";
      if ((cls === "w" || cls === "al") && core !== part) {
        out.push(h("span.c-" + cls, core), h("span.c-num", part.slice(core.length)));
      } else out.push(h("span.c-" + cls, part));
    }
    return out;
  }

  function outTokens(text, aliases) {
    const out = [];
    for (const part of text.split(/(%[^%\s]*%|[{}])/)) {
      if (!part) continue;
      if (part === "{" || part === "}") { out.push(h("span.c-br", part)); continue; }
      const m = /^%([A-Za-z_]+)%$/.exec(part);
      if (m && EZ.render.WORDS[m[1].toUpperCase()] !== undefined) {
        const c = EZ.render.rgb(EZ.render.WORDS[m[1].toUpperCase()]);
        out.push(h("span.c-col", {style: {color: c || "inherit"}}, part));
      } else if (NOTE_WORDS.test(part)) out.push(h("span.c-note", part));
      else if (m && aliases.has(m[1].toUpperCase())) out.push(h("span.c-al", part));
      else if (/^%.*%$/.test(part)) out.push(h("span.c-kw", part));
      else out.push(h("span.c-txt", part));
    }
    return out;
  }

  /* One line's highlighted pieces. bad: the words BH drops on it; aliases: every alias name (upper case too). */
  function lineTokens(line, bad, aliases) {
    if (/^\s*\/\//.test(line)) return [h("span.c-cmt", line)];
    const c = line.indexOf("//");
    const code = c < 0 ? line : line.slice(0, c), cmt = c < 0 ? "" : line.slice(c);
    const out = [];
    const j = code.indexOf(":");
    const m = /^(\s*)(ItemDisplay\[|Alias\[|Formula\[|ItemDisplayFilterName\[)/.exec(code);
    if (m && j > 0 && code.lastIndexOf("]", j) > 0) {
      const close = code.lastIndexOf("]", j);
      out.push(m[1], h("span.c-head", m[2]));
      const inner = code.slice(m[0].length, close);
      if (m[2] === "ItemDisplay[") out.push(...condTokens(inner, bad, aliases));
      else out.push(h("span.c-al", inner));
      out.push(h("span.c-head", code.slice(close, j + 1)));
      const rest = code.slice(j + 1);
      if (m[2] === "Formula[") out.push(h("span.c-txt", rest));
      else if (m[2] === "Alias[" && rest.indexOf("%") < 0) out.push(...condTokens(rest, bad, aliases));
      else out.push(...outTokens(rest, aliases));
    } else out.push(h("span.c-txt", code));
    if (cmt) out.push(h("span.c-cmt", cmt));
    return out;
  }

  /* ---------------------------------------------------------------- a block: the code editor and its lists */

  function codeEditor(app, which, onLint) {
    const ta = h("textarea.fe-ed-ta", {spellcheck: "false", autocomplete: "off", autocapitalize: "off",
      wrap: "off", "aria-label": which === "top" ? "Your rules above Erazure's" : "Your rules below Erazure's"});
    ta.value = blockOf(which);
    const hl = h("pre.fe-ed-hl", {"aria-hidden": "true"});
    const gutter = h("pre.fe-ed-gutter", {"aria-hidden": "true"});
    const findIn = h("input.fe-ed-find", {type: "search", placeholder: "Find", "aria-label": "Find in your rules"});
    const findN = h("span.fe-sub.fe-small");
    const lintBox = h("ul.fe-ed-lint", {"aria-live": "polite"});
    const list = h("div.fe-ed-rules");
    let findings = [];

    const rows = () => Math.min(26, Math.max(7, ta.value.split("\n").length + 2));
    ta.rows = rows();

    const selectLine = (n) => {
      const ls = ta.value.split("\n");
      let a = 0;
      for (let k = 0; k < n && k < ls.length; k++) a += ls[k].length + 1;
      ta.focus();
      ta.setSelectionRange(a, a + (ls[n] || "").length);
      ta.scrollTop = Math.max(0, n * LH - ta.clientHeight / 3);
      sync();
    };

    const sync = () => {
      hl.scrollTop = ta.scrollTop;
      hl.scrollLeft = ta.scrollLeft;
      gutter.scrollTop = ta.scrollTop;
    };
    const size = () => {
      hl.style.width = ta.clientWidth + "px";
      hl.style.height = ta.clientHeight + "px";
      gutter.style.height = ta.clientHeight + "px";
    };

    const paint = () => {
      const ls = ta.value.split("\n");
      const ctx = lintContext(app);
      const names = new Set(ctx.aliases.map((a) => a.name));
      for (const n of [...names]) names.add(n.toUpperCase());
      const byLine = new Map();
      for (const f of findings) {
        const cur = byLine.get(f.line) || {level: "info", bad: new Set()};
        if (f.level === "error" || (f.level === "warning" && cur.level === "info")) cur.level = f.level;
        if (f.word) cur.bad.add(f.word);
        byLine.set(f.line, cur);
      }
      fill(hl, ls.map((line, n) => {
        const f = byLine.get(n);
        return h("span.fe-ed-line" + (f && f.level !== "info" ? "." + (f.level === "error" ? "err" : "warn") : ""),
          line ? lineTokens(line, f && f.level === "error" ? f.bad : new Set(), names) : " ");
      }));
      fill(gutter, ls.map((line, n) => {
        const f = byLine.get(n);
        return h("span.fe-ed-num" + (f && f.level !== "info" ? "." + (f.level === "error" ? "err" : "warn") : ""),
          String(n + 1));
      }));
      size();
      sync();
    };

    const relint = () => {
      findings = lintBlock(app, which, EZ.rules.lines(ta.value).concat([]));
      paint();
      drawLint();
      drawList();
      if (onLint) onLint(findings);
    };

    const drawLint = () => {
      const shown = findings.filter((f) => f.level !== "info" || findings.length < 12);
      fill(lintBox, shown.slice(0, 60).map((f) => h("li.fe-ed-finding." + f.level,
        h("button.fe-btn.ghost.small", {type: "button", onclick: () => selectLine(f.line),
          title: "Go to line " + (f.line + 1)}, "Line " + (f.line + 1)),
        pill(f.level === "error" ? "error" : f.level === "warning" ? "check" : "note",
             f.level === "error" ? "bad" : f.level === "warning" ? "warn" : "info"),
        h("span", f.text))));
      if (shown.length > 60) lintBox.appendChild(h("li.fe-sub", `… and ${shown.length - 60} more.`));
    };

    const drawList = () => {
      const vals = aliasValues(app);
      const ls = EZ.rules.lines(ta.value);
      const items = [];
      ls.forEach((line, n) => {
        const d = EZ.rules.describe(line);
        if (d.kind === "blank" || d.kind === "comment") return;
        const kind = d.kind === "rule" ? (d.hides ? ["hides", "bad"] : d.stops ? ["decides the look", "accent"] :
          ["adds a layer", "info"]) : d.kind === "alias" ? ["alias", ""] : d.kind === "formula" ? ["formula", ""] :
          ["not a rule", "bad"];
        items.push(h("button.fe-ed-rule", {type: "button", onclick: () => selectLine(n), title: "Go to line " + (n + 1)},
          h("span.fe-num", String(n + 1)), pill(kind[0], kind[1]),
          d.kind === "rule" ? h("span.fe-ed-rulelabel", miniLabel(d.out, vals)) : h("code.fe-small", d.name || ""),
          d.kind === "rule" && d.notifies ? h("span.fe-row.fe-small", alertsOf(d.out, app)) : null));
      });
      fill(list, items.length ? items : h("p.fe-sub.fe-small", "No rules yet."));
    };

    const save = debounce(() => {
      const text = ta.value;
      EZ.store.change((ed) => {
        if (text.trim()) {
          ed.rules = ed.rules || {};
          ed.rules[which] = text;
        } else if (ed.rules) {
          delete ed.rules[which];
          if (!Object.keys(ed.rules).length) delete ed.rules;
        }
      }, {quiet: true, label: "my rules"});
    }, 700);
    const relintSoon = debounce(relint, 150);

    ta.addEventListener("input", () => {
      live[which] = ta.value;
      paint();
      relintSoon();
      save();
    });
    ta.addEventListener("scroll", sync);
    ta.addEventListener("blur", () => { save.flush(); });
    if (typeof ResizeObserver !== "undefined") new ResizeObserver(() => { size(); sync(); }).observe(ta);

    const findNext = (back) => {
      const q = findIn.value;
      if (!q) { findN.textContent = ""; return; }
      const t = ta.value.toLowerCase(), qq = q.toLowerCase();
      const hits = [];
      for (let i = t.indexOf(qq); i >= 0; i = t.indexOf(qq, i + 1)) hits.push(i);
      if (!hits.length) { findN.textContent = "no match"; return; }
      const at = back ? ta.selectionStart : ta.selectionEnd;
      let k = back ? hits.length - 1 : 0;
      for (let x = 0; x < hits.length; x++) {
        if (!back && hits[x] >= at) { k = x; break; }
        if (back && hits[x] < at - (ta.selectionEnd - ta.selectionStart === q.length ? q.length : 0)) k = x;
      }
      const i = hits[k];
      ta.focus();
      ta.setSelectionRange(i, i + q.length);
      const line = ta.value.slice(0, i).split("\n").length - 1;
      ta.scrollTop = Math.max(0, line * LH - ta.clientHeight / 3);
      sync();
      findN.textContent = `${k + 1} of ${hits.length}`;
    };
    findIn.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); findNext(e.shiftKey); }
    });
    findIn.addEventListener("input", () => { findN.textContent = ""; });

    const box = h("div.fe-ed",
      h("div.fe-ed-bar", findIn,
        h("button.fe-btn.ghost.small", {type: "button", onclick: () => findNext(true), title: "Previous (Shift+Enter)",
          "aria-label": "Previous match"}, "↑"),
        h("button.fe-btn.ghost.small", {type: "button", onclick: () => findNext(false), title: "Next (Enter)",
          "aria-label": "Next match"}, "↓"), findN,
        h("span.fe-bar-gap"),
        h("button.fe-btn.ghost.small", {type: "button", onclick: async () => {
          try { await navigator.clipboard.writeText(ta.value); EZ.ui.toast("Copied your rules."); } catch (e) {
            EZ.ui.toast("Your browser didn't let the page copy: select the text and press Ctrl+C.", "bad"); }
        }}, "Copy all")),
      h("div.fe-ed-body", gutter, h("div.fe-ed-wrap", hl, ta)),
      lintBox,
      h("h4.fe-ed-h", "What these rules draw"),
      list);
    relint();
    requestAnimationFrame(() => { size(); sync(); });
    return {box, ta, relint, selectLine, findings: () => findings};
  }

  /* ---------------------------------------------------------------- the builder */

  function builder(app, add) {
    const cat = EZ.items.catalog();
    const lines = app.versionLines();
    const card = h("section.fe-card", {id: "fe-builder"});
    const result = h("div.fe-bd-result");
    const families = (() => {
      const rev = new Map();
      for (const b of cat.bases.values()) if (b.up) rev.set(b.up.code, b.code);
      return (code) => {
        let root = code;
        for (let n = 0; n < 4 && rev.has(root); n++) root = rev.get(root);
        const out = [root];
        let b = cat.bases.get(root);
        for (let n = 0; n < 4 && b && b.up; n++) { out.push(b.up.code); b = cat.bases.get(b.up.code); }
        return out;
      };
    })();
    const levelNames = EZ.filter.levels(lines).map((l) => plainName(l.text));
    const used = Object.keys(EZ.filter.notifications(lines).sounds).map((k) => +k);

    const set = (fn, full) => {
      fn(B);
      keepForm();
      if (full) draw(); else drawResult();
    };

    const field = (label, ...kids) => h("div.fe-bd-field", h("span.fe-bd-label", label), h("div.fe-row.fe-small", kids));
    const chips = (list, on, toggleIt, title) => list.map(([value, text]) => h("button.fe-chiptog", {type: "button",
      "aria-pressed": String(on.indexOf(value) >= 0), title: title ? title(value) : null,
      onclick: () => set((b) => toggleIt(b, value), true)}, text));
    const flip = (arr, v) => { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); };
    const numIn = (value, onset, label, extra) => h("input.fe-pv-num", Object.assign({type: "number", value: value,
      "aria-label": label, oninput: (e) => set((b) => onset(b, e.target.value))}, extra || {}));
    const yesNo = (key, label) => field(label, seg([{value: "any", text: "Either"}, {value: "yes", text: "Yes"},
      {value: "no", text: "No"}], B[key], (v) => set((b) => { b[key] = v; }, true), {label}));

    function itemsField() {
      const input = h("input.fe-pv-search", {type: "search", placeholder: "Search an item: Shako, Ber Rune, Small Charm…",
        "aria-label": "Search an item"});
      const picks = h("div.fe-pv-picks", {hidden: true, role: "listbox"});
      const show = () => {
        const found = EZ.items.search(input.value, 12);
        fill(picks, found.map((p) => h("button", {type: "button", role: "option", onclick: () => {
          input.value = "";
          picks.hidden = true;
          set((b) => {
            if (b.codes.indexOf(p.spec.code) < 0) b.codes.push(p.spec.code);
            if (p.spec.quality && b.quals.indexOf(p.spec.quality) < 0) b.quals.push(p.spec.quality);
          }, true);
        }}, h("span", p.label), h("small", p.sub + " · " + p.spec.code))));
        picks.hidden = !found.length;
      };
      input.addEventListener("input", show);
      input.addEventListener("keydown", (e) => { if (e.key === "Escape") picks.hidden = true; });
      input.addEventListener("blur", () => setTimeout(() => { picks.hidden = true; }, 150));
      const group = h("select", {"aria-label": "Add a kind of item", onchange: (e) => {
        const v = e.target.value;
        e.target.value = "";
        if (v) set((b) => { if (b.groups.indexOf(v) < 0) b.groups.push(v); }, true);
      }}, h("option", {value: ""}, "…or add a kind of item"),
        GROUPS.map(([title, list]) => h("optgroup", {label: title}, list.map(([v, t]) => h("option", {value: v}, t)))));
      const chipsRow = h("div.fe-row.fe-small",
        B.codes.map((code) => {
          const base = cat.bases.get(code);
          const fam = families(code).filter((c) => cat.bases.has(c));
          const missing = fam.filter((c) => B.codes.indexOf(c) < 0);
          const shared = B.quals.filter((q) => q === "UNI" || q === "SET").map((q) =>
            cat.uniques.filter((u) => u.code === code && u.kind === q).length).reduce((a, b) => a + b, 0);
          return h("span.fe-bd-chip", {title: code},
            (base ? plainName(base.name) : code) + " ", h("code.fe-small", code),
            fam.length > 1 && missing.length ? h("button.fe-btn.ghost.small", {type: "button",
              title: "Add its other tiers: " + missing.map((c) => plainName((cat.bases.get(c) || {}).name || c)).join(", "),
              onclick: () => set((b) => { for (const c of missing) if (b.codes.indexOf(c) < 0) b.codes.push(c); }, true)},
              "+ tiers") : null,
            shared > 1 ? h("span.fe-sub", {title: "Unidentified, BH can't tell them apart: they share this base"},
              ` (${shared} share it)`) : null,
            h("button.fe-x", {type: "button", "aria-label": "Remove " + code, onclick: () =>
              set((b) => { b.codes = b.codes.filter((c) => c !== code); }, true)}, "✕"));
        }),
        B.groups.map((g) => h("span.fe-bd-chip", GROUP_NAME.get(g) || g, " ", h("code.fe-small", g),
          h("button.fe-x", {type: "button", "aria-label": "Remove " + g, onclick: () =>
            set((b) => { b.groups = b.groups.filter((x) => x !== g); }, true)}, "✕"))));
      return h("div.fe-bd-field.wide", h("span.fe-bd-label", "Items (any of these; none: every item)"),
        h("div.fe-row", h("div.fe-pv-pick.fe-bd-search", input, picks), group), chipsRow);
    }

    function statsField() {
      const skills = [...cat.skills.values()].filter((s) => CLASS_INDEX[s.cls] !== undefined)
        .sort((a, b) => CLASS_INDEX[a.cls] - CLASS_INDEX[b.cls] || a.name.localeCompare(b.name));
      const rowsBox = h("div.fe-stack");
      B.stats.forEach((s, k) => {
        const kind = h("select", {"aria-label": "Kind of stat", onchange: (e) => set((b) => {
          b.stats[k] = {kind: e.target.value, word: "", n: "", op: s.op || "min", a: s.a, b: s.b};
        }, true)}, STAT_KINDS.map(([v, t]) => h("option", {value: v, selected: s.kind === v}, t)));
        let what = null;
        if (s.kind === "word") {
          what = h("select", {"aria-label": "Stat", onchange: (e) => set((b) => { b.stats[k].word = e.target.value; })},
            h("option", {value: ""}, "Pick a stat"),
            STAT_WORDS.map(([v, t]) => h("option", {value: v, selected: s.word === v}, t)));
        } else if (s.kind === "STAT") {
          what = numIn(s.n, (b, v) => { b.stats[k].n = v; }, "Stat number", {placeholder: "id", min: 0});
        } else if (s.kind === "CLSK") {
          what = h("select", {"aria-label": "Class", onchange: (e) => set((b) => { b.stats[k].n = e.target.value; })},
            h("option", {value: ""}, "Pick a class"),
            CLASS_NAMES.map((c, i) => h("option", {value: String(i), selected: String(s.n) === String(i)}, c)));
        } else if (s.kind === "TABSK") {
          what = h("select", {"aria-label": "Skill tab", onchange: (e) => set((b) => { b.stats[k].n = e.target.value; })},
            h("option", {value: ""}, "Pick a skill tab"),
            TABS.map(([i, t]) => h("option", {value: String(i), selected: String(s.n) === String(i)}, t)));
        } else {
          what = h("select", {"aria-label": "Skill", onchange: (e) => set((b) => { b.stats[k].n = e.target.value; })},
            h("option", {value: ""}, "Pick a skill"),
            CLASS_NAMES.map((c, ci) => h("optgroup", {label: c}, skills.filter((x) => CLASS_INDEX[x.cls] === ci)
              .map((x) => h("option", {value: String(x.id), selected: String(s.n) === String(x.id)}, x.name)))));
        }
        const total = s.kind === "SKTOTAL" && s.n !== "" ? cat.skills.get(+s.n) : null;
        rowsBox.appendChild(h("div.fe-row.fe-small.fe-bd-stat", kind, what,
          h("select", {"aria-label": "Compare", onchange: (e) => set((b) => { b.stats[k].op = e.target.value; }, true)},
            OPS.map(([v, t]) => h("option", {value: v, selected: (s.op || "min") === v}, t))),
          numIn(s.a, (b, v) => { b.stats[k].a = v; }, "Value"),
          s.op === "between" ? [h("span", "and"), numIn(s.b, (b, v) => { b.stats[k].b = v; }, "Second value")] : null,
          total && total.tab === null ? h("span.fe-sub", "(its tab isn't counted)") : null,
          h("button.fe-x", {type: "button", "aria-label": "Remove this stat", onclick: () =>
            set((b) => { b.stats.splice(k, 1); }, true)}, "✕")));
      });
      return h("div.fe-bd-field.wide", h("span.fe-bd-label", "Stats (all of these)"), rowsBox,
        h("div.fe-row.fe-small", h("button.fe-btn.small", {type: "button", onclick: () =>
          set((b) => { b.stats.push({kind: "word", word: "", n: "", op: "min", a: "", b: ""}); }, true)}, "+ Add a stat"),
          h("span.fe-sub", "Stats show on identified items (and on non-magical items: sockets, defense, ED).")));
    }

    function iconField() {
      const palette = app.data.palette || [];
      const combo = EZ.rules.LAYERS.filter((l) => B.icon[l]).map((l) => l + "-" + B.icon[l]).join(" ");
      return field("Minimap icon", EZ.looks.icon(combo, palette, 3),
        EZ.rules.LAYERS.map((l) => {
          const b = h("button.fe-layer", {type: "button", title: `${l}: ${B.icon[l] || "none"}`},
            h("span.fe-layerbox", {style: {background: B.icon[l] ? palette[parseInt(B.icon[l], 16)] : "transparent"}}),
            l === "BORDER" ? "Border" : l === "MAP" ? "Map" : l === "DOT" ? "Dot" : "Pixel");
          b.addEventListener("click", () => EZ.looks.palettePicker(b, palette, B.icon[l], (col) => set((x) => {
            x.icon = Object.assign({}, x.icon);
            if (col === null) delete x.icon[l]; else x.icon[l] = col;
          }, true), true));
          return b;
        }),
        combo ? h("button.fe-btn.ghost.small", {type: "button", onclick: () => set((x) => { x.icon = {}; }, true)},
          "No icon") : null);
    }

    function drawResult() {
      const spec = specOf(B);
      const r = EZ.rules.build(spec);
      const findings = lintBlock(app, "top", [r.line]);
      const vals = aliasValues(app);
      const first = B.codes.length ? cat.bases.get(B.codes[0]) : null;
      const q = B.quals.length === 1 ? B.quals[0] : null;
      const sample = "%" + (SAMPLE_COLOR[q] || "WHITE") + "%" + (first ? plainName(first.name) : "Item");
      const copy = async () => {
        try { await navigator.clipboard.writeText(r.line); EZ.ui.toast("Copied the rule."); } catch (e) {

/* Erazure's rules (advanced): every line of the player's version as BH reads it, by section, searchable, each rule in
   words with what it draws; the rules the preview's item can match. A rule can be switched off or on, changed, or
   get the player's own lines before or after it (EZ.ops keeps each change by what its line says, so it follows
   Erazure's updates; the list of changes says where one moved or can't be found). Generated sections (rebuilt from

    "146-map-experience.filter", "270-boss-gear-tags.filter", "290-low-level-rare-tags.filter",
    "305-runeword-rolls.filter", "312-tag-count.filter"]);

    const rules = new Map();  // line -> EZ.filter.rule()
    for (let i = 0; i < lines.length; i++) {
      const r = EZ.filter.rule(lines[i]);
      if (r) rules.set(i, r);
    }
    // the twins tools write next to a rule: 280's plain twins (under their star rule), the sell twins of 210 / 220 /
    // 310 (over their hide rule): a switch-off takes them with it
    const twins = new Map(), kids = new Map();
    const tie = (kid, parent) => {
      twins.set(kid, parent);
      if (!kids.has(parent)) kids.set(parent, []);
      kids.get(parent).push(kid);
    };
    for (const s of order) {
      if (s.name.startsWith("280-")) {
        for (let i = s.a + 1; i < s.b; i++) {
          const r = rules.get(i), p = rules.get(i - 1);
          if (r && p && !r.off && / STAT360>0$/.test(r.cond) && / !STAT360>0$/.test(p.cond) &&
              r.cond.replace(/ STAT360>0$/, "") === p.cond.replace(/ !STAT360>0$/, "")) tie(i, i - 1);
        }
      }
      if (/^(210|220|310)-/.test(s.name)) {
        for (let i = s.a; i < s.b; i++) {
          const r = rules.get(i);
          if (!r || r.off || r.cond.indexOf("!SMALL_SELL_BASE") < 0) continue;
          for (let k = i - 1; k >= s.a; k--) {
            const t = rules.get(k);
            if (!t || t.off || !/(^|[\s(])SMALL_SELL_(GOLD|GRAY|NK)\b/.test(t.cond)) break;
