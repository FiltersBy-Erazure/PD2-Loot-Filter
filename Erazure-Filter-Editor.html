  margin-bottom: .5em; overflow-x: auto; }
.edit-map .fe-aliasrow { display: grid; gap: .25em; margin-top: .45em; }
.edit-map .fe-aliasrow input { width: 100%; font-size: .85em; }
.edit-map .fe-aliasname { font-size: .72em; color: var(--muted); background: none; border: 0; padding: 0; }

/* minimap icons and the palette */
.edit-map .fe-iconlist { display: grid; gap: .5em; }
.edit-map .fe-iconrow { display: flex; align-items: center; gap: .6em; padding: .35em .45em; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel2); flex-wrap: wrap; }
.edit-map canvas.fe-icon { width: 28px; height: 28px; image-rendering: pixelated; border-radius: 3px; flex: none; }
.edit-map .fe-iconinfo { flex: 1 1 280px; min-width: 0; }
.edit-map .fe-layer { display: inline-flex; align-items: center; gap: .3em; border: 1px solid var(--line2);
  background: var(--panel); border-radius: 6px; padding: .1em .45em; cursor: pointer; color: var(--fg); font-size: .85em; }
.edit-map .fe-layerbox { width: .95em; height: .95em; border: 1px solid var(--line2); display: inline-block; }
.edit-map .fe-palette-menu { padding: .5em; }
.edit-map .fe-palette { display: grid; grid-template-columns: repeat(16, 16px); gap: 2px; margin-top: .4em; }
.edit-map .fe-swatch { width: 16px; height: 16px; border: 1px solid rgba(255,255,255,.12); padding: 0; cursor: pointer;
  border-radius: 2px; }
.edit-map .fe-swatch.on, .edit-map .fe-swatch:hover { outline: 2px solid var(--focus); outline-offset: 0; }

/* sounds */
.edit-map .fe-soundlist { display: grid; gap: .4em; max-height: none; }
.edit-map .fe-dialog .fe-soundlist { max-height: 55vh; overflow: auto; margin-top: .6em; }
.edit-map .fe-soundrow { display: flex; flex-wrap: wrap; align-items: center; gap: .3em 1em; padding: .4em .55em;
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); }
.edit-map .fe-soundrow.on { border-color: var(--accent); }
.edit-map .fe-soundmain { flex: 1 1 320px; min-width: 0; }
.edit-map .fe-soundto { color: var(--accent); }

/* profiles and history */
.edit-map .fe-profiles { display: grid; gap: .6em; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.edit-map ul.fe-histlist { list-style: none; margin: .3em 0 0; padding: 0; }
.edit-map ul.fe-histlist li { display: flex; align-items: center; justify-content: space-between; gap: .6em;

/* narrower screens: the sidebar shrinks to its icons, then the preview becomes a drawer */
@media (max-width: 1400px) {

  .edit-map .fe-nav .n { position: absolute; top: .15em; right: .3em; font-size: .66em; padding: 0 .3em; }
  .edit-map .fe-nav-sep { margin: .4em .5em; }
}
@media (max-width: 1000px) {
  .edit-map .fe-app { grid-template-columns: 64px minmax(0, 1fr); grid-template-areas: "bar bar" "side area"; }
  .edit-map .fe-preview { position: fixed; top: calc(var(--top) + var(--bar)); right: 0; bottom: 0; height: auto;

}
@media (max-width: 640px) {

  .edit-map .fe-side { position: fixed; top: calc(var(--top) + var(--bar)); left: 0; bottom: 0; max-height: none;
    width: min(18em, 85vw); z-index: 31; transform: translateX(-105%); transition: transform .2s; box-shadow: var(--shadow); }
  .edit-map .fe-app.nav-open .fe-side { transform: none; }
  .edit-map .fe-nav .lbl { display: inline; }
  .edit-map .fe-nav button { justify-content: flex-start; padding: .6em .9em; }
  .edit-map .fe-nav .n { position: static; }
  .edit-map .fe-preview { width: 100vw; }
  .edit-map .fe-area { padding: .8em .8em 3em; }
  .edit-map .fe-search { order: 9; flex-basis: 100%; max-width: none; }
}
@media (min-width: 641px) { .edit-map .fe-only-phone { display: none !important; } }
@media (min-width: 1001px) { .edit-map .fe-only-narrow { display: none !important; } }
@media (prefers-reduced-motion: reduce) {

}

    return close;
  }

  function trapTab(e, box) {
    const els = [...box.querySelectorAll("button, input, select, textarea, a[href], [tabindex='0']")]
      .filter((x) => !x.disabled && x.offsetParent !== null);
    if (!els.length) return;
    const first = els[0], last = els[els.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  function confirmBox(title, text, yes, onyes) {
    dialog({title, body: [h("p", text)], buttons: [{text: "Cancel"}, {text: yes, primary: true, onclick: onyes}]});
  }

  /* A menu under an anchor: menu(anchor, [{text, sub, onclick, disabled}]) */
  let openMenu = null;
  function menu(anchor, items) {
    if (openMenu) openMenu();
    const box = h("div.fe-menu", {role: "menu"});
    for (const it of items) {
      if (!it) continue;
      box.appendChild(h("button", {type: "button", role: "menuitem", disabled: !!it.disabled, onclick: () => {
        close();
        it.onclick();
      }}, h("span", h("span", it.text), it.sub ? h("small", it.sub) : null)));
    }
    const root = host || document.body;
    root.appendChild(box);
    const r = anchor.getBoundingClientRect(), rr = root.getBoundingClientRect();
    const w = box.offsetWidth;
    let left = r.right - rr.left - w;
    if (left < 4) left = 4;
    box.style.left = left + "px";
    box.style.top = (r.bottom - rr.top + 4) + "px";
    const away = (e) => { if (!box.contains(e.target) && e.target !== anchor) close(); };
    const key = (e) => {
      if (e.key === "Escape") { close(); anchor.focus(); }
      else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        const bs = [...box.querySelectorAll("button:not(:disabled)")];
        const i = bs.indexOf(document.activeElement);
        const n = e.key === "ArrowDown" ? (i + 1) % bs.length : (i - 1 + bs.length) % bs.length;
        if (bs[n]) bs[n].focus();
        e.preventDefault();
      }
    };
    function close() {
      box.remove();
      document.removeEventListener("mousedown", away, true);
      document.removeEventListener("keydown", key, true);
      openMenu = null;
    }
    document.addEventListener("mousedown", away, true);
    document.addEventListener("keydown", key, true);
    openMenu = close;
    const first = box.querySelector("button:not(:disabled)");
    if (first) first.focus();
    return close;
  }

  /* A segmented choice: seg([{value, text, title}], current, onchange, {label}) */
  function seg(options, current, onchange, opts) {
    const box = h("div.fe-seg", {role: "group", "aria-label": opts && opts.label || null});
    for (const o of options) {
      box.appendChild(h("button", {type: "button", "aria-pressed": String(o.value === current), title: o.title || null,
        disabled: !!o.disabled, onclick: () => { if (o.value !== current) onchange(o.value); }}, o.text));
    }
    return box;
  }

  /* A switch: toggle(label, checked, onchange, {disabled, title, sub}) */
  function toggle(label, checked, onchange, opts) {
    opts = opts || {};
    const input = h("input", {type: "checkbox", checked: !!checked, disabled: !!opts.disabled,
      onchange: (e) => onchange(e.target.checked)});
    return h("label.fe-switch", {title: opts.title || null}, input, h("span.track"),
      h("span", h("span", label), opts.sub ? h("small.fe-sub", {style: {display: "block"}}, opts.sub) : null));
  }

  /* An option card in a choice: option(title, sub, pressed, onclick) */
  function option(title, sub, pressed, onclick, extra) {
    return h("button.fe-option", {type: "button", "aria-pressed": String(!!pressed), onclick},
      h("b", title), sub ? h("small", sub) : null, extra || null);
  }

  function pill(text, kind) {
    return h("span.fe-pill" + (kind ? "." + kind : ""), text);
  }

  function debounce(fn, ms) {
    let t = null;
    const d = (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    d.flush = (...args) => { clearTimeout(t); fn(...args); };
    return d;
  }

  /* "2 minutes ago", "yesterday", "Nov 9" */
  function ago(ms) {
    if (!ms) return "";
    const s = Math.round((Date.now() - ms) / 1000);
    if (s < 45) return "just now";
    if (s < 90) return "a minute ago";
    const m = Math.round(s / 60);
    if (m < 60) return `${m} minutes ago`;
    const hrs = Math.round(m / 60);
    if (hrs < 24) return hrs === 1 ? "an hour ago" : `${hrs} hours ago`;
    const d = new Date(ms);
    return d.toLocaleDateString(undefined, {month: "short", day: "numeric", year:
      d.getFullYear() === new Date().getFullYear() ? undefined : "numeric"});
  }

  function plural(n, one, many) {
    return `${n.toLocaleString()} ${n === 1 ? one : (many || one + "s")}`;
  }

  return {h, add, clear, fill, setHost, toast, dialog, confirmBox, menu, seg, toggle, option, pill, debounce, ago,
          plural};
})();

/* ---- tools/editor/store.js ---- */
/* The Filter Editor's storage: the player's profiles (each an edit set: what they changed, never a filter file) in
   localStorage, undo / redo for this visit, a persistent history and the game folder's handle in IndexedDB. Every read
   and write is guarded: a private window or blocked storage keeps the editor working for the visit, and says so. */
var EZ = typeof EZ !== "undefined" ? EZ : {};
EZ.store = (function () {
  "use strict";
  const KEY = "erazure-filter-editor";
  const SCHEMA = 1;
  const UNDO_MAX = 100;
  const HISTORY_MAX = 30;

  function newEdits() {
    return {v: SCHEMA, base: {style: "erazure", revealed: false, bigGG: false, poe: false}};
  }

  function newProfile(name) {
    const id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    return {id, name: name || "My Erazure", file: "Erazure-Custom", edits: newEdits(), saved: null,
            created: Date.now(), changed: Date.now()};
  }

  let data = null, okToSave = true, warned = false;
  const undo = [], redo = [];
  const listeners = new Set();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) data = JSON.parse(raw);
    } catch (e) {
      okToSave = false;
    }
    if (!data || typeof data !== "object" || data.v !== SCHEMA || !data.profiles) {
      const p = newProfile();
      data = {v: SCHEMA, current: p.id, order: [p.id], profiles: {[p.id]: p}};
    }
    for (const id of Object.keys(data.profiles)) normalize(data.profiles[id]);
    if (!data.profiles[data.current]) data.current = data.order[0];
    return data;
  }

  /* An edit set read back from storage, a file or a link: every field the editor reads, of the right kind. */
  function normalize(p) {
    const e = p.edits && typeof p.edits === "object" ? p.edits : newEdits();
    const b = e.base && typeof e.base === "object" ? e.base : {};
    e.v = SCHEMA;
    e.base = {style: ["erazure", "minimal", "corrlorized"].includes(b.style) ? b.style : "erazure",
              revealed: !!b.revealed, bigGG: !!b.bigGG, poe: !!b.poe};
    p.edits = e;
    p.name = typeof p.name === "string" && p.name.trim() ? p.name.slice(0, 60) : "My Erazure";
    p.file = typeof p.file === "string" ? p.file : "Erazure-Custom";
    return p;
  }

  function save() {
    if (!okToSave) return false;
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      okToSave = false;
      if (!warned) {
        warned = true;
        EZ.ui.toast("This browser won't keep your changes (a private window or blocked storage). Use Save changes " +
                    "to a file before you leave.", "bad", {sticky: true});
      }
      return false;
    }
  }

  function current() { return data.profiles[data.current]; }
  function profiles() { return data.order.map((id) => data.profiles[id]).filter(Boolean); }
  function storageOk() { return okToSave; }

  /* Change the current profile's edits: fn(edits) changes them in place. One undo step per call. */
  function change(fn, opts) {
    const p = current();
    const before = JSON.stringify(p.edits);
    fn(p.edits);
    const after = JSON.stringify(p.edits);
    if (after === before) return false;
    if (!(opts && opts.noUndo)) {
      undo.push({id: p.id, edits: before});
      if (undo.length > UNDO_MAX) undo.shift();
      redo.length = 0;
    }
    p.changed = Date.now();
    save();
    emit({what: "edits", label: opts && opts.label, quiet: !!(opts && opts.quiet)});
    return true;
  }

  /* Change the current profile's own fields (name, file, saved); opts.quiet: the area isn't drawn again. */
  function changeProfile(fn, opts) {
    fn(current());
    current().changed = Date.now();
    save();
    emit({what: "profile", quiet: !!(opts && opts.quiet)});
  }

  function step(from, to) {
    const p = current();
    for (let i = from.length - 1; i >= 0; i--) {
      if (from[i].id !== p.id) continue;
      const s = from.splice(i, 1)[0];
      to.push({id: p.id, edits: JSON.stringify(p.edits)});
      p.edits = normalize({edits: JSON.parse(s.edits)}).edits;
      p.changed = Date.now();
      save();
      emit({what: "edits", undo: true});
      return true;
    }
    return false;
  }

  const undoStep = () => step(undo, redo);
  const redoStep = () => step(redo, undo);
  const canUndo = () => undo.some((s) => s.id === data.current);
  const canRedo = () => redo.some((s) => s.id === data.current);

  function switchTo(id) {
    if (!data.profiles[id] || id === data.current) return;
    data.current = id;
    save();
    emit({what: "switch"});
  }

  function addProfile(name, edits) {
    const p = newProfile(name);
    if (edits) p.edits = normalize({edits: JSON.parse(JSON.stringify(edits))}).edits;
    data.profiles[p.id] = p;
    data.order.push(p.id);
    data.current = p.id;
    save();
    emit({what: "switch"});
    return p;
  }

  function removeProfile(id) {
    if (data.order.length < 2) return false;
    delete data.profiles[id];
    data.order = data.order.filter((x) => x !== id);
    if (data.current === id) data.current = data.order[0];
    save();
    emit({what: "switch"});
    return true;
  }

  function on(fn) { listeners.add(fn); return () => listeners.delete(fn); }
  function emit(ev) { for (const fn of listeners) fn(ev); }

  /* IndexedDB: the game folder handles (File System Access) and the history snapshots. */
  let dbp = null;
  function db() {
    if (!dbp) {
      dbp = new Promise((resolve, reject) => {
        if (!("indexedDB" in window)) { reject(new Error("no IndexedDB")); return; }
        const req = indexedDB.open(KEY, 1);
        req.onupgradeneeded = () => {
          const d = req.result;
          if (!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    return dbp;
  }

  async function kvGet(key) {
    try {
      const d = await db();
      return await new Promise((resolve, reject) => {
        const r = d.transaction("kv").objectStore("kv").get(key);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    } catch (e) {
      return undefined;
    }
  }

  async function kvSet(key, value) {
    try {
      const d = await db();
      await new Promise((resolve, reject) => {
        const t = d.transaction("kv", "readwrite");
        if (value === undefined) t.objectStore("kv").delete(key);
        else t.objectStore("kv").put(value, key);
        t.oncomplete = () => resolve();
        t.onerror = () => reject(t.error);
      });
      return true;
    } catch (e) {
      return false;
    }
  }

  /* A snapshot of a profile's edits in its history (the last HISTORY_MAX saves), newest first. */
  async function remember(p, why) {
    const key = "history:" + p.id;
    const list = (await kvGet(key)) || [];
    const edits = JSON.stringify(p.edits);
    if (list.length && list[0].edits === edits) return;
    list.unshift({at: Date.now(), why: why || "", edits});
    await kvSet(key, list.slice(0, HISTORY_MAX));
  }

  async function history(p) { return (await kvGet("history:" + p.id)) || []; }

  return {load, save, current, profiles, change, changeProfile, undoStep, redoStep, canUndo, canRedo, switchTo,
          addProfile, removeProfile, on, normalize, newEdits, storageOk, kvGet, kvSet, remember, history, SCHEMA};
})();

/* ---- tools/editor/filter.js ---- */
/* The Filter Editor's reading of Erazure's lines (alias form, from the source): sections, rules, aliases, the
   filter level names, Erazure's own player options (050) and the cards of the aliases that draw something (the
   alias editor's: 040's symbol aliases and 020's version names). Everything here is read from the lines, never from
   the page's own data, so it follows each new Erazure. */
var EZ = typeof EZ !== "undefined" ? EZ : {};
EZ.filter = (function () {
  "use strict";

  const OPTIONS_SECTION = "050-customization.filter";
  const SYMBOLS_SECTION = "040-aliases.filter";
  const CUBE_SECTION = "020-horadric-cube.filter";
  const RULE_RE = /^(\s*\/\/+\s*)?(ItemDisplay\[)/;
  const ALIAS_RE = /^Alias\[([A-Za-z0-9_]+)\]:(.*)$/;
  const NOTIFY_RE = /%(?:BORDER|MAP|DOT|PX|LINE)-[0-9a-f]{1,4}%|%SOUNDID-\d{1,4}%/i;
  const ICON_RE = /%(BORDER|MAP|DOT|PX)-([0-9a-f]{1,4})%/gi;
  const SOUND_RE = /%SOUNDID-(\d{1,4})%/gi;
  const TIER_RE = /%TIER-(\d)%/i;
  const LEVEL_RE = /^ItemDisplayFilterName\[\]:/;

  /* {name: [first line, one past the last]} of the source's sections, for the lines of a version (a style edits
     patch adds lines: their places come from section starts counted on the version's own lines, found by the
     sections' first lines). */
  function sections(src, lines) {
    const out = {}, list = src.sections;
    if (lines === src.lines || lines.length === src.lines.length) {
      for (let k = 0; k < list.length; k++) {
        out[list[k][0]] = [list[k][1], k + 1 < list.length ? list[k + 1][1] : lines.length];
      }
      return out;
    }
    let at = 0;
    for (let k = 0; k < list.length; k++) {
      const first = src.lines[list[k][1]];
      while (at < lines.length && lines[at] !== first) at++;
      out[list[k][0]] = [at, lines.length];
      if (k) out[list[k - 1][0]][1] = at;
    }
    return out;
  }

  function sectionOf(secs, i) {
    for (const name of Object.keys(secs)) {
      const [a, b] = secs[name];
      if (i >= a && i < b) return name;
    }
    return null;
  }

  /* A rule line's parts as BH reads it: {off: the // prefix of a switched-off rule or "", cond, out, comment,
     head: the text up to the output}, or null for a line that isn't a rule. */
  function rule(line) {
    const m = RULE_RE.exec(line);
    if (!m) return null;
    const off = m[1] || "";
    const text = line.slice(off.length);
    const c = text.indexOf("//");
    const code = c < 0 ? text : text.slice(0, c);
    const j = code.indexOf(":");
    if (j < 0) return null;
    const key = code.slice(0, j).trim();
    if (!key.endsWith("]")) return null;
    return {off, cond: key.slice("ItemDisplay[".length, key.length - 1), out: code.slice(j + 1),
            comment: c < 0 ? "" : text.slice(c), head: off + code.slice(0, j + 1)};
  }

  const notifies = (out) => NOTIFY_RE.test(out);
  const continues = (out) => out.indexOf("%CONTINUE%") >= 0;

  /* The icon keywords of an output, in order ("BORDER-91 MAP-9B DOT-62 PX-68"), "" for none. */
  function icons(out) {
    const found = [];
    ICON_RE.lastIndex = 0;
    let m;
    while ((m = ICON_RE.exec(out))) found.push(m[1].toUpperCase() + "-" + m[2].toUpperCase());
    return found.join(" ");
  }

  function sounds(out) {
    const found = [];
    SOUND_RE.lastIndex = 0;
    let m;
    while ((m = SOUND_RE.exec(out))) found.push(+m[1]);
    return found;
  }

  /* {name: {i, value}} of the alias definitions (the first of a name, as BH reads them all). */
  function aliases(lines) {
    const out = {};
    for (let i = 0; i < lines.length; i++) {
      const m = ALIAS_RE.exec(lines[i]);
      if (m && !out[m[1]]) out[m[1]] = {i, value: EZ.core.bhTrim(m[2].split("//")[0])};
    }
    return out;
  }

  /* The filter level names: [{i, text}] (BH reads 12 at most; level 0 is BH's own "Show All Items"). */
  function levels(lines) {
    const out = [];
    for (let i = 0; i < lines.length && out.length < 12; i++) {
      if (LEVEL_RE.test(lines[i])) {
        const v = lines[i].slice(lines[i].indexOf(":") + 1);
        const c = v.indexOf("//");
        out.push({i, text: c < 0 ? v : v.slice(0, c)});
      }
    }
    return out;
  }

  /* Erazure's own player options (050): [{title, options: [{id, label, lines: [line index], conds}]}], each
     option's rules switched off in the filter until the player switches it on. Options of one group whose rules
     test the same items (the same conditions) are one choice: choice = the option ids that compete. */
  function options(src, lines) {
    const secs = sections(src, lines);
    const range = secs[OPTIONS_SECTION];
    if (!range) return [];
    const groups = [];
    let group = null, opt = null;
    for (let i = range[0]; i < range[1]; i++) {
      const line = lines[i];
      const g = /^\/\/\s+=+\s+(.+?)\s+=+\s*$/.exec(line);
      if (g) {
        group = {title: g[1], options: []};
        groups.push(group);
        opt = null;
        continue;
      }
      if (!group) continue;
      if (!line.trim()) { opt = null; continue; }
      const r = rule(line);
      if (r && r.off) {
        if (opt) {
          opt.lines.push(i);
          opt.conds.push(r.cond.replace(/\s+/g, " ").trim());
        }
        continue;
      }
      const l = /^\/\/\s{2,}(\S.*?)\s*$/.exec(line);
      if (l && !l[1].startsWith("=")) {
        opt = {id: group.title + " / " + l[1], label: l[1], group: group.title, lines: [], conds: []};
        group.options.push(opt);
      }
    }
    for (const gr of groups) {
      gr.options = gr.options.filter((o) => o.lines.length);
      const byConds = new Map();
      for (const o of gr.options) {
        const key = o.conds.slice().sort().join("\n");
        if (!byConds.has(key)) byConds.set(key, []);
        byConds.get(key).push(o);
      }
      for (const set of byConds.values()) for (const o of set) o.choice = set.map((x) => x.id);
    }
    return groups.filter((gr) => gr.options.length);
  }

  /* ---------------------------------------------------------------- look cards (tools/alias_editor.py's) */

  const GROUPS = [  // (id, title, note, which cards: by their first alias's name), in the page's order
    ["uniques", "Unique items", "Unidentified uniques, by tier.", (n) => n.startsWith("UNI_") || n.startsWith("FACET")],
    ["sets", "Set items", "Unidentified set items, by tier.", (n) => n.startsWith("SET")],
    ["rares", "Rare and magic items", "Unidentified rares, jewels, rings, charms and magic crafting bases.",
     (n) => n.startsWith("RARE_") || n.startsWith("MAGIC_")],
    ["runes", "Runes", "Single runes and stacks.", (n) => n.indexOf("RUNE") >= 0 || n.endsWith("BIG_GG")],
    ["pd2", "PD2 items and keys", "Shards, Puzzle items, the Cube, Vial and Mirror, keys, tokens, uber items and " +
     "Craft Infusions.", (n) => !n.endsWith("VERSION_NAME") && !/^(HIGHLIGHT|AMPLIFY|LOWER_RES)/.test(n)],
    ["highlights", "Description highlights", "Lines in item descriptions.",
     (n) => /^(HIGHLIGHT|AMPLIFY|LOWER_RES)/.test(n)],
    ["cube", "Horadric Cube", "Each version's name in the Horadric Cube's description.",
     (n) => n.endsWith("VERSION_NAME")],
  ];
  const keyOf = (name) => name.replace(/_(LEFT|RIGHT)$/, "");
  const OFF_TOGGLES = ["BIG_GG", "POE_SOUNDS", "REVEALED"];

  function lookAliases(src, lines) {
    const secs = sections(src, lines), out = [];
    const [a0, a1] = secs[SYMBOLS_SECTION] || [0, 0];
    let title = "", inComment = false;
    for (let i = a0; i < a1; i++) {
      const line = lines[i];
      if (line.startsWith("// ") && !inComment) title = line.slice(3).split(":")[0].trim();
      inComment = line.startsWith("//");
      const m = ALIAS_RE.exec(line);
      if (m && m[2].indexOf("%") >= 0 && !m[2].startsWith("(")) out.push({name: m[1], i, value: m[2], title});
    }
    const [c0, c1] = secs[CUBE_SECTION] || [0, 0];
    for (let i = c0; i < c1; i++) {
      const m = ALIAS_RE.exec(lines[i]);
      if (m && m[1].endsWith("VERSION_NAME")) out.push({name: m[1], i, value: m[2], title: m[2]});
    }
    return out;
  }

  /* A rule's output as the label it draws with this card's aliases: aliases and %NAME% left in, the description
     where the alias sits in it (alias_editor.template). */
  function template(names, line) {
    const r = rule(line);
    let out = r.out;
    const body = /\{(.*)\}/.exec(out);
    if (body && body[1].indexOf("%" + names[0] + "%") >= 0) {
      out = body[1].split(/%CL%|%NL%/).find((p) => p.indexOf("%" + names[0] + "%") >= 0);
    } else {
      out = out.replace(/\{.*\}/, "");
    }
    out = out.replace(/%(CONTINUE|(BORDER|MAP|DOT|PX)-[0-9A-Fa-f]+|SOUNDID-\d+|TIER-\d)%/g, "");
    const band = /\bED(?:>(\d+)|~(\d+)-)/.exec(r.cond);
    const ed = String((band ? (band[1] ? +band[1] + 1 : +band[2]) : 500) + 12);
    return out.replace(/%QTY%/g, "12").replace(/%ILVL%/g, "92").replace(/%ED%/g, ed).replace(/%EDAM%/g, ed)
      .replace(/\s+$/, "");
  }

  /* The look cards: [{key, title, group, aliases: [{name, i, value}], tpls: [{tpl, at}]}] (alias_editor.page_data,
     its looks(): the different labels the card's aliases decide, at most 3, one item before a stack). */
  function lookCards(src, lines) {
    const list = lookAliases(src, lines);
    const names = new Set(list.map((a) => a.name));
    const order = new Map(list.map((a, k) => [a.name, k]));
    const rules = [];
    for (let i = 0; i < lines.length; i++) if (lines[i].startsWith("ItemDisplay[")) rules.push(i);
    const cards = [], seen = new Set();
    for (const a of list) {
      if (seen.has(a.name)) continue;
      const key = keyOf(a.name);
      const group = list.filter((b) => keyOf(b.name) === key);
      for (const b of group) seen.add(b.name);
      const gnames = group.map((b) => b.name);
      const found = [];
      for (const i of rules) {
        const line = lines[i];
        const r = rule(line);
        if (!r) continue;
        const words = r.cond.replace(/[()]/g, " ").split(/\s+/);
        if (OFF_TOGGLES.some((t) => words.indexOf(t) >= 0)) continue;
        const used = [...names].filter((n) => line.indexOf("%" + n + "%") >= 0);
        if (!used.length) continue;
        const last = used.reduce((x, y) => (order.get(x) > order.get(y) ? x : y));
        if (gnames.indexOf(last) < 0) continue;
        const tpl = template(gnames, line);
        const same = (t) => t.replace(/(%[A-Z_]+%)+(?=%NAME%)/g, "");
        if (!found.some((f) => same(f.tpl) === same(tpl))) found.push({tpl, at: i, stack: r.cond.indexOf("QTY>") >= 0});
      }
      found.sort((x, y) => x.stack - y.stack);
      let tpls = found.slice(0, 3).map((f) => ({tpl: f.tpl, at: f.at}));
      if (!tpls.length) {
        const fallback = rules.find((i) => gnames.every((n) => lines[i].indexOf("%" + n + "%") >= 0));
        tpls = [fallback !== undefined ? {tpl: template(gnames, lines[fallback]), at: fallback}
                                       : {tpl: "%" + gnames[0] + "%  %NAME%  " + gnames.slice(1).map((n) => "%" + n + "%").join(""),
                                          at: null}];
      }
      const g = GROUPS.find((gr) => gr[3](a.name));
      cards.push({key, title: a.title, group: g ? g[0] : "pd2", aliases: group, tpls});
    }
    return cards;
  }

  /* Every distinct drop sound and icon combination of the rules: {sounds: {id: [line]}, icons: {combo: [line]}}. */
  function notifications(lines) {
    const out = {sounds: {}, icons: {}};
    for (let i = 0; i < lines.length; i++) {
      if (!lines[i].startsWith("ItemDisplay[")) continue;
      const r = rule(lines[i]);
      if (!r) continue;
      for (const s of sounds(r.out)) (out.sounds[s] || (out.sounds[s] = [])).push(i);
      const ic = icons(r.out);
      if (ic) (out.icons[ic] || (out.icons[ic] = [])).push(i);
    }
    return out;
  }

  return {sections, sectionOf, rule, notifies, continues, icons, sounds, aliases, levels, options, lookCards,
          lookAliases, notifications, GROUPS: GROUPS.map((g) => ({id: g[0], title: g[1], note: g[2]})), keyOf,
          ICON_RE, SOUND_RE, TIER_RE, NOTIFY_RE, ALIAS_RE, OPTIONS_SECTION};
})();

/* ---- tools/editor/edits.js ---- */
/* The Filter Editor's edits: a profile's edit set applied to a version's lines (alias form), in a fixed order, each
   step a plain text change BH reads as the player meant. Every step finds its lines by what they say (section names,
   option labels, alias names, rule text), so the same edits apply to every new Erazure; a step that can't place an
   edit says so in the report instead of guessing.

   The order: Erazure's options (050) -> features -> looks -> color remap -> sounds -> icons -> alert switches ->
   filter level names and copies -> (later steps: categories, items, rules...) -> the Cube's Custom mark. The header
   (the edit set itself, so a saved file can be imported again) is added by headerLines, after the aliases are
   written out. tools/editor_selftest.py checks every step against a Python version of it. */
var EZ = typeof EZ !== "undefined" ? EZ : {};
EZ.edits = (function () {
  "use strict";
  const F = EZ.filter;

  const COLORS = ["WHITE", "RED", "GREEN", "BLUE", "GOLD", "GRAY", "BLACK", "TAN", "ORANGE", "YELLOW", "PURPLE",
                  "DARK_GREEN", "CORAL", "SAGE", "TEAL", "LIGHT_GRAY"];
  const COLOR_RE = new RegExp("%(" + COLORS.join("|") + ")%", "g");
  const ICON_ANY = /%(?:BORDER|MAP|DOT|PX)-[0-9a-f]{1,4}%/gi;
  const SOUND_ANY = /%SOUNDID-\d{1,4}%/gi;
  const TIER_ANY = /%TIER-\d%/gi;
  const FILTLVL_RE = /FILTLVL(=|<|>|~)(\d+)(?:-(\d+))?/g;
  const SITE = "https://filtersby-erazure.github.io/PD2-Loot-Filter/editor/";

  /* ---------------------------------------------------------------- helpers */

  /* Change every rule line's output (active and switched-off rules): fn(out, rule, i) -> new output. */
  function eachOutput(lines, fn) {
    for (let i = 0; i < lines.length; i++) {
      const r = F.rule(lines[i]);
      if (!r) continue;
      const out = fn(r.out, r, i);
      if (out !== r.out) lines[i] = r.head + out + r.comment;
    }
  }

  function setAlias(lines, name, value) {
    const re = new RegExp("^Alias\\[" + name + "\\]:");
    for (let i = 0; i < lines.length; i++) {
      if (re.test(lines[i])) {
        lines[i] = "Alias[" + name + "]:" + value;
        return true;
      }

    return false;

  function featureDefault(f) { return f.on === undefined ? true : f.on; }

  /* ---------------------------------------------------------------- the steps */

  function options(ctx) {
    const want = ctx.edits.options || {};
    const ids = Object.keys(want).filter((k) => want[k]);
    if (!ids.length) return;
    const groups = F.options(ctx.src, ctx.lines);
    const byId = new Map();
    for (const g of groups) for (const o of g.options) byId.set(o.id, o);
    for (const id of ids) {
      const o = byId.get(id);
      if (!o) { ctx.unplaced("options", id, "Erazure no longer has this option"); continue; }
      for (const i of o.lines) ctx.lines[i] = ctx.lines[i].replace(/^\s*\/\/+\s*/, "");
    }
  }

  function features(ctx) {
    const want = ctx.edits.features || {};
    for (const f of EZ.features) {
      if (!(f.id in want) || !!want[f.id] === featureDefault(f)) continue;
      const on = !!want[f.id];
      if (f.sections && !on) {
        const secs = F.sections(ctx.src, ctx.lines);
        for (const name of f.sections) {
          const range = secs[name];
          if (!range) { ctx.unplaced("options", f.title, `Erazure no longer has ${name}`); continue; }
          for (let i = range[0]; i < range[1]; i++) {
            const line = ctx.lines[i];
            if (!line.startsWith("ItemDisplay[")) continue;
            const r = F.rule(line);

          }

          : Object.keys(F.aliases(ctx.lines)).filter((n) => f.aliases.test(n));
        if (!names.length) ctx.unplaced("options", f.title, "Erazure no longer has these aliases");
        for (const n of names) if (!setAlias(ctx.lines, n, "FALSE")) ctx.unplaced("options", f.title, `no Alias[${n}]`);
      } else if (f.switchOn && on) {
        const range = F.sections(ctx.src, ctx.lines)[f.switchOn.section];
        if (!range) { ctx.unplaced("options", f.title, `Erazure no longer has ${f.switchOn.section}`); continue; }
        let n = 0;
        for (let i = range[0]; i < range[1]; i++) {

    if (!keys.length) return;

      const m = F.ALIAS_RE.exec(ctx.lines[i]);

  function sounds(ctx) {

    if (!all && !Object.keys(map).length) return;

      if (all) return "";

  const keywords = (combo) => combo ? combo.split(" ").map((k) => "%" + k + "%").join("") : "";
  const SIZES = ["BORDER", "MAP", "DOT", "PX"];

    const parts = combo.split(" ").filter(Boolean).map((k) => k.split("-"));
    if (how === "smaller") {
      return parts.map(([l, c]) => [SIZES[SIZES.indexOf(l.toUpperCase()) + 1], c]).filter(([l]) => l)

  }

  function icons(ctx) {
    const map = ctx.edits.icons || {}, a = ctx.edits.alerts || {};
    const size = a.iconSize === "smaller" || a.iconSize === "bigger" ? a.iconSize : null;
    if (!a.noIcons && !size && !Object.keys(map).length) return;
    eachOutput(ctx.lines, (out) => {
      const combo = F.icons(out);
      if (!combo) return out;

    if (op === "<") return L < a;

    for (const k of Object.keys(names)) {
      const n = +k, at = found[n - 1];

      const line = ctx.lines[at.i];

      if (m && m[2].indexOf("FILTLVL") >= 0) { out.push("Alias[" + m[1] + "]:" + copyLevels(m[2], copies)); continue; }
      const r = F.rule(line);
      if (!r || r.cond.indexOf("FILTLVL") < 0 && !F.TIER_RE.test(r.out)) { out.push(line); continue; }
      const cond = copyLevels(r.cond, copies);
      const tier = F.TIER_RE.exec(r.out);
      const rebuilt = (c, o) => r.off + "ItemDisplay[" + c + "]:" + o + r.comment;
      if (!tier) { out.push(rebuilt(cond, r.out)); continue; }

      const n = +tier[1], on = [], off = [];

        else if (!atM && atN) off.push(N);

      if (off.length) {

    options: (e) => Object.keys(e.options || {}).filter((k) => e.options[k]).length +
      EZ.features.filter((f) => e.features && f.id in e.features && !!e.features[f.id] !== featureDefault(f)).length +
      Object.keys((e.levels || {}).names || {}).length + Object.keys((e.levels || {}).copies || {}).length,
    looks: (e) => Object.keys(e.looks || {}).length + Object.keys(e.remap || {}).length + Object.keys(e.icons || {}).length,
    alerts: (e) => Object.keys(e.sounds || {}).length +

  function apply(src, profile, lines) {

    ctx.unplaced = (area, what, why) => ctx.report.unplaced.push({area, what, why});
    options(ctx);
    features(ctx);
    looks(ctx);
    remap(ctx);
    sounds(ctx);
    icons(ctx);
    alerts(ctx);

  function b64url(bytes) {
    let s = "";
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function unb64url(text) {
    const s = atob(text.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((text.length + 3) % 4));
    const out = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }

  async function squeeze(bytes) {
    if (typeof CompressionStream === "undefined") return null;
    const cs = new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw")));
    return new Uint8Array(await cs.arrayBuffer());
  }

  async function unsqueeze(bytes, limit) {
    const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    const reader = ds.getReader(), parts = [];
    let n = 0;
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      n += value.length;
      if (n > limit) throw new Error("too big");
      parts.push(value);
    }
    const out = new Uint8Array(n);
    let at = 0;
    for (const p of parts) { out.set(p, at); at += p.length; }
    return out;
  }

  /* The edit set as text: "z" + base64url(deflate-raw(JSON)) or "j" + base64url(JSON). */
  async function pack(payload) {
    const raw = new TextEncoder().encode(JSON.stringify(payload));
    const z = await squeeze(raw);
    return z && z.length < raw.length ? "z" + b64url(z) : "j" + b64url(raw);
  }

  async function unpack(text, limit) {
    limit = limit || 4 << 20;
    const kind = text[0], body = unb64url(text.slice(1));
    const raw = kind === "z" ? await unsqueeze(body, limit) : body;
    if (raw.length > limit) throw new Error("too big");
    return JSON.parse(new TextDecoder().decode(raw));
  }

  /* The comment lines that open a saved file: what it is, and the edit set (EDITS k/n), so importing it restores
     the edits. */
  async function headerLines(src, profile, variant, count) {
    const data = await pack({app: "erazure-filter-editor", v: EZ.store.SCHEMA, name: profile.name, file: profile.file,
                             edits: profile.edits});
    const chunks = [];
    for (let i = 0; i < data.length; i += 1000) chunks.push(data.slice(i, i + 1000));
    return [
      "// Made with the Erazure Filter Editor: " + SITE,
      `// ${variant.launcher} with ${count} change${count === 1 ? "" : "s"}, on Erazure ${src.version}. To change it or to`,
      "// bring it up to date, open the editor and import this file: your changes are in the EDITS lines below.",
      ...chunks.map((c, k) => `// EDITS ${k + 1}/${chunks.length} ${c}`),
      "",
    ];
  }

  /* The edit set of a saved file's text (its EDITS lines), or null. */
  async function fromFile(text) {
    const parts = [];
    const re = /^\/\/ EDITS (\d+)\/(\d+) (\S+)\s*$/gm;
    let m, total = 0;
    while ((m = re.exec(text))) { parts[+m[1] - 1] = m[3]; total = +m[2]; }
    if (!total || parts.length !== total || parts.some((p) => !p)) return null;
    const data = await unpack(parts.join(""));
    return data && data.app === "erazure-filter-editor" ? data : null;
  }

  return {apply, step, count, countArea, counter, headerLines, fromFile, pack, unpack, copyLevels, COLORS,
          featureDefault, resized, SITE};
})();

/* ---- tools/editor/render.js ---- */
/* The Filter Editor's drawing of what the game draws. Text is in BH's color codes (ÿc + a character, looked up in
   D2GL's g_text_colors: the PD2 fork's d2gl/src/modules/hd_text/variables.h), its lines in the game's order (the
   string's first line drawn at the bottom, each line centred, a color carrying on to the line above).

   This module draws labels as styled HTML in D2GL's colors on the game's 60% black box with faded ends; the game-font
   canvas renderer (fonts from d2gl.mpq, the MSDF math of D2GL's shader) replaces the text drawing behind the same calls
   once the assets are there (EZ.glyphs). */
var EZ = typeof EZ !== "undefined" ? EZ : {};
EZ.render = (function () {
  "use strict";
  const {h} = EZ.ui;

  /* D2GL's g_text_colors: code character -> RRGGBBAA. */
  const CODES = {
    "\x01": "DFB679FF", "\x02": "000000FF", "\x03": "DFB67966", "\x04": "C22121FF", "\x05": "959595FF",
    "\x06": "E09595FF", "\x07": "B6E12EFF", "\x08": "9EA0A0FF", "\x09": "5CA6A4FF", "\x0A": "A2AAA5FF",
    "\x0B": "A6E0A7FF", "\x0C": "A9A9B0FF", "\x0D": "A9B1B1FF", "\x0E": "E2ABE2FF", "\x0F": "EB2EAEFF",
    "\x10": "B0B2E2FF", "\x11": "EBEBE1FF", "\x12": "E22EB8FF", "\x13": "EBEBEBFF", "\x14": "21C7CAFF",
    "\x15": "CB21CDFF", "\x16": "CED126FF", "\x17": "D2D328FF", "\x18": "D5D6D8FF", "\x19": "D9D965FF",
    "\x1A": "DA29DAFF", "\x1B": "DC68DBFF", "\x1C": "DCAD2BFF", "\x1D": "2BDFDFFF", "\x1E": "DFADDFFF",
    "\x1F": "2CE02CFF", "!": "E0B3B3FF", "\"": "2C2CE1FF", "#": "E1E1E2FF", "$": "E2EBEBFF", "%": "EBEB77FF",
    "&": "898D8BFF", "'": "8D8D8BFF", "(": "8EA1A0FF", ")": "0DCCE9FF", "*": "2325CEFF", "+": "8DEAD3FF",
    ",": "D5D3EAFF", "-": "EAD8D9FF", ".": "29DCDCFF", "/": "DFDFEBFF", "0": "FEFEFEFF", "1": "FE6950FF",
    "2": "25FE00FF", "3": "7B7BFEFF", "4": "DFB679FF", "5": "7B7B7BFF", "6": "00000000", "7": "D9CD8EFF",
    "8": "FFB200FF", "9": "EBEB75FF", ":": "008C00FF", ";": "B700FFFF", "<": "00D200FF", "=": "EBEBEBFF",
  };
  /* PD2's own: the rest of the text at this alpha (BH's FULL / THREE_FOURTHS / HALF / QUARTER_TRANS). */
  const ALPHA = {"@": 1, "A": 0x99 / 255, "B": 0x66 / 255, "C": 0x33 / 255};

  /* BH's color words as it writes them under Glide (BH ItemDisplay.cpp's ReplacementMap). */
  const WORDS = {WHITE: "0", RED: "1", GREEN: "2", BLUE: "3", GOLD: "4", GRAY: "5", BLACK: "\x02", TAN: "7",
                 ORANGE: "8", YELLOW: "9", PURPLE: ";", DARK_GREEN: ":", CORAL: "\x06", SAGE: "\x07", TEAL: "\x09",
                 LIGHT_GRAY: "\x0C", FULL_TRANS: "@", THREE_FOURTHS_TRANS: "A", HALF_TRANS: "B", QUARTER_TRANS: "C"};
  const WORD_RE = new RegExp("%(" + Object.keys(WORDS).join("|") + ")%", "g");
  /* The color a dropped item's name starts in (the game puts it in front), by quality. */
  const QUALITY = {NMAG: "0", MAG: "3", SET: "2", RARE: "9", UNI: "4", CRAFT: "8", SOCKETED: "5", ETH: "5"};

  function codes(text) { return text.replace(WORD_RE, (m, w) => "ÿc" + WORDS[w]); }

  function rgb(code) {
    const c = CODES[code];
    return c ? "#" + c.slice(0, 6) : null;
  }

  /* The text's lines in the game's drawing order, top first: [[{color, alpha, text}]]. The string's lines are split
     at \n (BH's %NL%); its first line is drawn at the bottom, and the colors carry on in string order. */
  function lines(text, start) {
    const parts = text.split("\n");
    let color = start || "0", alpha = 1;
    const out = parts.map((part) => {
      const segs = [];
      let buf = "";
      for (let i = 0; i < part.length; i++) {
        if (part[i] === "ÿ" && part[i + 1] === "c" && i + 2 < part.length) {
          const k = part[i + 2];
          if (k in CODES || k in ALPHA) {
            if (buf) segs.push({color, alpha, text: buf});
            buf = "";
            if (k in ALPHA) alpha = ALPHA[k]; else color = k;
            i += 2;
            continue;
          }
        }
        buf += part[i];
      }
      if (buf) segs.push({color, alpha, text: buf});
      return segs;
    });
    return out.reverse();
  }

  /* A label as the game draws a dropped item's name: the box (rgba 0,0,0,.6, both ends fading), the lines centred.
     opts: {start: the quality's color code, state: "ground" | "alt" (hovered with Alt: blue) | "hover" (no Alt:
     solid black, no fade), cut: [visible characters cut off] (drawn ghosted), zoom}. */
  function label(text, opts) {
    opts = opts || {};
    const box = h("span.fe-label" + (opts.state ? ".is-" + opts.state : ""));
    if (opts.zoom) box.style.fontSize = (13.5 * opts.zoom) + "px";
    for (const segs of lines(text, opts.start)) {
      const row = h("span.fe-label-line");
      if (!segs.length) row.appendChild(document.createTextNode(" "));
      for (const s of segs) {
        const c = rgb(s.color);
        const span = h("span", s.text);
        if (c) span.style.color = c;
        if (CODES[s.color] && CODES[s.color].slice(6) === "00") span.style.color = "transparent";
        if (s.alpha < 1) span.style.opacity = String(s.alpha);
        row.appendChild(span);
      }
      box.appendChild(row);
    }
    box.setAttribute("aria-label", plain(text));
    return box;
  }

  /* The text without its color codes, lines top first joined by " / " (for screen readers and copying). */
  function plain(text) {
    return lines(text).map((segs) => segs.map((s) => s.text).join("")).join(" / ");
  }

  /* A filter level name as the launcher and BH's menu show it (its own codes in its own colors, on no box). */
  function levelName(text) {
    const out = h("span.fe-levelname");
    for (const segs of lines(text, "0")) {
      for (const s of segs) {
        const span = h("span", s.text);
        const c = rgb(s.color);
        if (c) span.style.color = c;
        out.appendChild(span);
      }
    }
    return out;
  }

  return {CODES, WORDS, QUALITY, codes, rgb, lines, label, plain, levelName};
})();

/* ---- tools/editor/share.js ---- */
/* Taking edits in and out of the editor: export a profile's changes as a file, a share link, or the EDITS lines of a
   saved filter; import any of them (as a new profile or over the current one). Everything read is untrusted: parsed
   as data, size-capped, normalized, never put into the page as HTML. */
var EZ = typeof EZ !== "undefined" ? EZ : {};
EZ.share = (function () {
  "use strict";
  const {h, toast, dialog} = EZ.ui;
  const LINK_KEY = "e=";
  const DISCORD = 2000;

  function payload(p) {
    return {app: "erazure-filter-editor", v: EZ.store.SCHEMA, name: p.name, file: p.file, edits: p.edits};
  }

  function exportFile(app) {
    const p = EZ.store.current();
    const text = JSON.stringify(payload(p), null, 1);
    const url = URL.createObjectURL(new Blob([text], {type: "application/json"}));
    const a = h("a", {href: url, download: app.fileName(p).replace(/\.filter$/, "") + "-changes.json"});
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    toast("Saved your changes as a file. Import it on this page (any browser) to get them back.", "good");
  }

  async function link() {
    const data = await EZ.edits.pack(payload(EZ.store.current()));
    return location.href.replace(/#.*$/, "") + "#" + LINK_KEY + data;
  }

  async function copyLink() {
    const url = await link();
    let copied = false;
    try { await navigator.clipboard.writeText(url); copied = true; } catch (e) { /* show it instead */ }
    const long = url.length > DISCORD;
    dialog({title: "Share your changes", body: [
      h("p", copied ? "The link is copied. Anyone who opens it can load your changes into their editor."
                    : "Copy this link. Anyone who opens it can load your changes into their editor."),
      h("textarea", {readonly: true, rows: 4, onfocus: (e) => e.target.select()}, url),
      long ? h("p.fe-note.warn", `The link is ${url.length.toLocaleString()} characters: too long for one Discord ` +
        "message (2,000). Share your changes as a file instead (Save changes to a file).") : null,
    ]});
  }

  /* Read an import: a saved filter (its EDITS lines), a changes file or a link. Resolves {name, file, edits} or
     throws with a message for the player. */
  async function read(text) {
    text = String(text || "").trim();
    if (!text) throw new Error("There's nothing to import.");
    if (text.length > 8 << 20) throw new Error("That's too big to be a filter or a changes file.");
    let data = null;
    const at = text.indexOf("#" + LINK_KEY);
    if (at >= 0 || /^[jz][A-Za-z0-9_-]+$/.test(text)) {
      data = await EZ.edits.unpack(at >= 0 ? text.slice(at + 1 + LINK_KEY.length) : text);
    } else if (text[0] === "{") {
      data = JSON.parse(text);
    } else {
      data = await EZ.edits.fromFile(text);
      if (!data) {
        throw new Error("This filter has no editor changes in it: it wasn't saved by the Filter Editor (or was " +
                        "edited by hand afterwards and lost its EDITS lines).");
      }
    }
    if (!data || typeof data !== "object" || data.app !== "erazure-filter-editor" || !data.edits) {
      throw new Error("That isn't a set of Filter Editor changes.");
    }
    if ((data.v || 0) > EZ.store.SCHEMA) {
      throw new Error("These changes come from a newer editor: reload the page and try again.");
    }
    const p = EZ.store.normalize({name: data.name, file: data.file, edits: data.edits});
    return {name: p.name, file: p.file, edits: p.edits};
  }

  /* Ask where the imported edits go, then put them there. */
  function offer(imported, source) {
    const n = EZ.edits.count(imported.edits);
    dialog({title: "Import changes", body: [
      h("p", h("b", imported.name), ` (${n} change${n === 1 ? "" : "s"}) ` + (source || "") + "."),
      h("p.fe-sub", "As a new profile keeps your own changes as they are; over yours replaces your current profile's " +
        "changes (Undo brings them back)."),
    ], buttons: [
      {text: "Cancel"},
      {text: "Over my current profile", onclick: () => {
        EZ.store.change((e) => {
          for (const k of Object.keys(e)) delete e[k];
          Object.assign(e, JSON.parse(JSON.stringify(imported.edits)));
        }, {label: "import"});
        toast("Imported over your current profile.", "good");
      }},
      {text: "As a new profile", primary: true, onclick: () => {
        const p = EZ.store.addProfile(imported.name, imported.edits);
        EZ.store.changeProfile((pp) => { pp.file = imported.file || pp.file; });
        toast(`Imported as the profile ${p.name}.`, "good");
      }},
    ]});
  }

  async function importText(text, source) {
    try {
      offer(await read(text), source);
    } catch (e) {
      toast(e.message || String(e), "bad", {sticky: true});
    }
  }

  function importFile() {
    const input = h("input", {type: "file", accept: ".filter,.json,.txt", style: {display: "none"}});
    input.addEventListener("change", async () => {
      const f = input.files && input.files[0];
      input.remove();
      if (!f) return;
      if (f.size > 8 << 20) { toast("That file is too big to be a filter or a changes file.", "bad"); return; }
      importText(await f.text(), "from " + f.name);
    });
    document.body.appendChild(input);
    input.click();
  }

  function importPaste() {
    const area = h("textarea", {rows: 6, placeholder: "Paste a share link, or a changes file's text"});
    dialog({title: "Import changes", body: [h("p.fe-sub", "Paste a share link or the text of a changes file."), area],
      buttons: [{text: "Cancel"}, {text: "Import", primary: true, onclick: () => { importText(area.value, "pasted"); }}]});
  }

  /* A share link opened: offer its changes (once), then take it out of the address. */
  async function fromLocation() {
    const m = /#e=([jz][A-Za-z0-9_-]+)/.exec(location.hash || "");
    if (!m) return false;
    try { history.replaceState(null, "", location.href.replace(/#.*$/, "") + "#start"); } catch (e) { /* file: */ }
    await importText(m[1], "from a share link");
    return true;
  }

  return {exportFile, copyLink, read, offer, importText, importFile, importPaste, fromLocation, link};
})();

/* ---- tools/editor/app.js ---- */
/* The Filter Editor's frame: loads the filter's source, keeps the player's profile, draws the bar, the sidebar of
   areas (each area is a module that registers itself in EZ.areas), the chosen area and the preview column, and builds,
   saves and downloads the player's filter. */
var EZ = typeof EZ !== "undefined" ? EZ : {};
EZ.areas = EZ.areas || [];
EZ.app = (function () {
  "use strict";
  const {h, fill, toast, dialog, menu} = EZ.ui;
  const SOURCE_FILE = "Erazure-Filter-Editor-Source.js";
  const STYLES = {erazure: null, minimal: "minimal.filter", corrlorized: "corrlorized.edits"};
  const STYLE_NAMES = {erazure: "Erazure", minimal: "Minimal", corrlorized: "Corrlorized"};

  const app = {src: null, data: null, root: null, area: "start", sub: "", els: {}, building: null};

  /* ---------------------------------------------------------------- the source */

  function sourceUrl(scriptSrc, v) {
    const q = v && !v.startsWith("__") ? "?v=" + v : "";
    if (scriptSrc) {
      try { return new URL("../../" + SOURCE_FILE + q, scriptSrc).href; } catch (e) { /* the file's own name */ }
    }
    return SOURCE_FILE + q;
  }

  function loadSource(url) {
    return new Promise((resolve, reject) => {
      if (window.ERAZURE_EDITOR_SOURCE) { resolve(window.ERAZURE_EDITOR_SOURCE); return; }
      const s = document.createElement("script");
      s.src = url;
      s.onload = () => window.ERAZURE_EDITOR_SOURCE ? resolve(window.ERAZURE_EDITOR_SOURCE)
                                                     : reject(new Error("the filter's data file is empty"));
      s.onerror = () => reject(new Error("the filter's data file didn't load"));
      document.head.appendChild(s);
    });
  }

  /* ---------------------------------------------------------------- versions */

  function toggleName(base) {
    const parts = [];
    if (base.revealed) parts.push("Revealed");
    if (base.bigGG) parts.push("BIG GG");
    if (base.poe || base.style === "corrlorized") parts.push("PoE");
    if (!base.revealed && !base.bigGG) parts.unshift("Main");
    return "Erazure - " + parts.join(" - ");
  }

  /* The launcher version the player's base is: one of the source's variants. */
  function variantFor(base) {
    const toggle = toggleName(base), style = STYLES[base.style];
    return app.src.variants.find((v) => v.toggle === toggle && (v.style || null) === style) || null;
  }

  function variant() { return variantFor(EZ.store.current().edits.base); }

  /* A version's lines in alias form, before any edit (cached: the areas read them to list what can change). */
  const lineCache = new Map();
  function versionLines(v) {
    v = v || variant();
    if (!lineCache.has(v.name)) lineCache.set(v.name, EZ.core.variantLines(app.src, v));
    return lineCache.get(v.name);
  }

  /* What the player's edits change beyond their version: {count, warn, byArea} (each edit module counts its own). */
  function changes() {
    const out = {count: 0, warn: 0, byArea: {}};
    const e = EZ.store.current().edits;
    for (const a of EZ.areas) {
      const n = a.count ? a.count(e, app) : 0, w = a.warn ? a.warn(e, app) : 0;
      out.byArea[a.id] = {n, w};
      out.count += n;
      out.warn += w;
    }
    return out;
  }

  /* ---------------------------------------------------------------- building and saving */

  /* The player's filter: {bytes, lines, name, variant, crc, report}. EZ.edits applies the edits when that module is
     there; with none the file is the launcher's. */
  async function build() {
    const p = EZ.store.current(), v = variant();
    let lines = EZ.core.variantLines(app.src, v), report = null;
    if (EZ.edits && EZ.edits.apply) {
      const r = EZ.edits.apply(app.src, p, lines, app);
      lines = r.lines;
      report = r.report;
    }
    lines = EZ.core.written(app.src, lines);
    if (report && report.count) lines = (await EZ.edits.headerLines(app.src, p, v, report.count)).concat(lines);
    const bytes = EZ.core.encode(lines);
    return {bytes, lines, name: fileName(p), variant: v, crc: EZ.core.crc32(bytes), report};
  }

  function fileName(p) {
    const base = (p.file || "Erazure-Custom").replace(/\.filter$/i, "").replace(/[\\/:*?"<>|]+/g, "-").trim();
    return (base || "Erazure-Custom") + ".filter";
  }

  /* Build in the next frame (the page shows that it's working), then hand the file to fn. */
  function withBuild(what, fn) {
    if (app.building) return;
    const done = toast(h("span", h("span.fe-spin"), " " + what + "…"), null, {sticky: true});
    app.building = true;
    setTimeout(async () => {
      try {
        await fn(await build());
      } catch (e) {
        if (e && e.name === "AbortError") return;
        toast("Couldn't build your filter: " + (e && e.message || e), "bad", {sticky: true});
        if (window.console) console.error(e);
      } finally {
        app.building = false;
        done();
      }
    }, 30);
  }

  function download(built) {
    const url = URL.createObjectURL(new Blob([built.bytes], {type: "application/octet-stream"}));
    const a = h("a", {href: url, download: built.name});
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    saved(built, "download");
  }

  function saved(built, how, folder) {
    EZ.store.changeProfile((p) => {
      p.saved = {version: app.src.version, build: app.src.build, at: Date.now(), crc: built.crc, how, folder: folder || "",
                 file: built.name};
    });
    EZ.store.remember(EZ.store.current(), how === "download" ? "downloaded" : "saved to the game");
    if (how === "download") {
      toast(h("span", "Downloaded ", h("b", built.name), ". Put it in Diablo II\\ProjectD2\\filters\\local and pick it " +
              "in the launcher (Local Filter, then Save Filter)."), "good", {ms: 9000});
    } else {
      toast(h("span", "Saved ", h("b", built.name), " in ", h("b", folder), ". In game, press Numpad 0 to reload it."),
            "good", {ms: 7000});
    }
    redraw();
  }

  const canSaveInPlace = () => window.isSecureContext && "showDirectoryPicker" in window;

  async function folderHandle(ask) {
    let dir = await EZ.store.kvGet("dir");
    if (dir && dir.queryPermission) {
      let state = await dir.queryPermission({mode: "readwrite"});
      if (state === "prompt") state = await dir.requestPermission({mode: "readwrite"});
      if (state === "granted") return dir;
    }
    if (!ask) return null;
    dir = await window.showDirectoryPicker({id: "pd2-filters-local", mode: "readwrite"});
    await EZ.store.kvSet("dir", dir);
    return dir;
  }

  async function writeInPlace(built, dir) {
    let old = null;
    try {
      const f = await (await dir.getFileHandle(built.name)).getFile();
      old = await f.arrayBuffer();
    } catch (e) { /* no file yet */ }
    if (old && old.byteLength) {
      const bak = await dir.getFileHandle(built.name + ".bak", {create: true});
      const w = await bak.createWritable();

      const up = () => {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);

      };
      window.addEventListener("pointermove", move);

    });

  }

  async function start(root, data, scriptSrc, sourceV) {
    app.data = data || {};

      else { drawBar(); drawSide(); if (!ev.quiet) drawArea(); }
      if (EZ.preview && EZ.preview.changed) EZ.preview.changed(ev, app);
    });
  }

  Object.assign(app, {start, go, redraw, drawBar, drawSide, drawArea, drawPreview, variant, variantFor, toggleName,
                      versionLines,
                      changes, build, withBuild, download, saveToGame, canSaveInPlace, forgetFolder, fileName,
                      STYLE_NAMES, saveMenu: []});
  return app;
})();

var EZ = typeof EZ !== "undefined" ? EZ : {};

    const sub = app.sub;

    const setOption = (o, on) => EZ.store.change((ed) => {
      ed.options = ed.options || {};
      for (const id of o.choice) delete ed.options[id];
      if (on) ed.options[o.id] = true;
    }, {label: o.label});
    const optionCards = groups.map((g) => {
      const seen = new Set(), rows = [];
      for (const o of g.options) {
        if (seen.has(o.id)) continue;
        if (o.choice.length > 1) {
          const set = g.options.filter((x) => o.choice.indexOf(x.id) >= 0);
          set.forEach((x) => seen.add(x.id));
          const name = "fe-opt-" + g.title.replace(/\W+/g, "") + rows.length;

            h("input", {type: "radio", name, checked, onchange: onpick}), h("span", label), extra || null);

            set.map((x) => radio(x.label, chosen === x, () => setOption(x, true)))));
        } else {
          seen.add(o.id);

        }

        h("pre.fe-code", g.options.map((o) => o.lines.map((i) => lines[i].replace(/^\/\/+/, "")).join("\n")).join("\n")));

/* Looks: the symbols and colors around item names (Erazure's look aliases, one card per look, its labels drawn), style
   presets, a global color swap, and the minimap icons Erazure uses. */
var EZ = typeof EZ !== "undefined" ? EZ : {};
EZ.areas = EZ.areas || [];
EZ.looks = (function () {
  "use strict";
  const {h} = EZ.ui;
  const F = EZ.filter, R = EZ.render;

  /* {name: value} of a version's aliases. */
  function values(lines) {
    const out = {}, a = F.aliases(lines);
    for (const k of Object.keys(a)) out[k] = a[k].value;
    return out;
  }

  /* An output template drawn: every %ALIAS% filled (a few rounds: looks may hold other looks), %NAME% the sample. */
  function fill(tpl, vals, sample) {
    let text = tpl;
    for (let n = 0; n < 4 && /%[A-Z0-9_]+%/.test(text); n++) {
      text = text.replace(/%([A-Z0-9_]+)%/g, (m, k) => k === "NAME" || !(k in vals) ? m : vals[k]);
    }
    return R.codes(text.replace(/%NAME%/g, sample).replace(/%PERCENT%/g, "%")).replace(/%NL%/g, "\n")
      .replace(/%(?:CL|CS)%/g, " ");
  }

  function sampleFor(key, data) {
    const nc = (data.looks && data.looks.nameColor || []).find(([p]) => key.startsWith(p));
    const name = (data.looks && data.looks.sample && data.looks.sample[key]) || "Item";
    return (nc ? "%" + nc[1] + "%" : "%WHITE%") + name;
  }

  /* The looks of the style versions (Minimal's alias lines, Corrlorized's alias values from its own lines). */
  function styleValues(app, style) {
    if (style === "minimal") {
      const out = {}, lines = app.src.styles["minimal.filter"].lines;
      for (const k of Object.keys(lines)) {
        const m = F.ALIAS_RE.exec(lines[k]);
        if (m) out[k] = EZ.core.bhTrim(m[2]);
      }
      return out;
    }
    if (style === "corrlorized") {
      const v = app.src.variants.find((x) => x.style === "corrlorized.edits");
      return v ? values(app.versionLines(v)) : {};
    }
    return values(app.src.lines);
  }

  /* An icon drawn as BH draws it, scaled: the layers' boxes (8/6/4/2 game pixels) in rule order, 00 last. */
  function icon(combo, palette, scale) {
    scale = scale || 3;
    const size = 8 * scale + 4;
    const c = h("canvas", {width: size, height: size, class: "fe-icon", role: "img",
      "aria-label": combo ? "minimap icon " + combo : "no minimap icon"});
    const g = c.getContext("2d");
    g.fillStyle = "#0b0b0b";
    g.fillRect(0, 0, size, size);
    const dims = {BORDER: 8, MAP: 6, DOT: 4, PX: 2};
    const layers = combo ? combo.split(" ").map((k) => k.split("-")) : [];
    const draw = (l, col) => {
      const d = dims[l.toUpperCase()] * scale, o = (size - d) / 2;
      g.fillStyle = palette[parseInt(col, 16) & 255] || "#000";
      g.fillRect(o, o, d, d);
    };
    for (const [l, col] of layers) if (parseInt(col, 16) !== 0) draw(l, col);
    for (const [l, col] of layers) if (parseInt(col, 16) === 0) draw(l, col);
    return c;
  }

  /* A palette picker under an anchor: onpick("0A") or onpick(null) for none. */
  function palettePicker(anchor, palette, current, onpick, allowNone) {
    const grid = h("div.fe-palette", {role: "listbox", "aria-label": "Minimap colors"});
    const close = () => { wrap.remove(); document.removeEventListener("mousedown", away, true); };
    const away = (ev) => { if (!wrap.contains(ev.target)) close(); };
    for (let i = 0; i < 256; i++) {
      const hex = i.toString(16).toUpperCase().padStart(2, "0");
      grid.appendChild(h("button.fe-swatch" + (hex === current ? ".on" : ""), {type: "button", title: hex,
        "aria-label": "color " + hex, style: {background: palette[i]}, onclick: () => { close(); onpick(hex); }}));
    }
    const wrap = h("div.fe-menu.fe-palette-menu",
      allowNone ? h("button.fe-btn.small", {type: "button", onclick: () => { close(); onpick(null); }}, "None") : null,
      grid);
    const root = anchor.closest(".edit-map") || document.body;
    root.appendChild(wrap);
    const r = anchor.getBoundingClientRect(), rr = root.getBoundingClientRect();
    wrap.style.left = Math.max(4, Math.min(r.left - rr.left, rr.width - wrap.offsetWidth - 4)) + "px";
    wrap.style.top = (r.bottom - rr.top + 4) + "px";
    setTimeout(() => document.addEventListener("mousedown", away, true));
  }

  return {values, fill, sampleFor, styleValues, icon, palettePicker};
})();

/* Alerts: what a drop does besides its label (the chat line, the drop sound and the minimap icon). Global switches,
   and every drop sound Erazure plays with what plays it, each one swappable or silenced. */
var EZ = typeof EZ !== "undefined" ? EZ : {};

EZ.sounds = (function () {
  "use strict";
  const {h, dialog} = EZ.ui;

  function name(data, id) {

    return n ? n : "sound " + id;
  }

  /* A play button when the editor has the sound's clip (the assets), else the game's own test command. */
  function play(data, id) {
    const clips = data.assets && data.assets.sounds || {};
    if (clips[id] && EZ.assets && EZ.assets.url) {
      return h("button.fe-btn.ghost.small", {type: "button", title: "Play", "aria-label": "Play " + name(data, id),
        onclick: () => {
          const a = new Audio(EZ.assets.url(clips[id]));
          a.play().catch(() => EZ.ui.toast("The browser didn't play the sound."));
        }}, "▶");
    }
    return h("span.fe-sub", {title: "Type this in the game's chat to hear it"}, `.playsound ${id}`);
  }

  /* A dialog to pick a sound: Erazure's own, PD2's PoE ones, or any by name or number. onpick(id) (0: no sound). */
  function pick(app, used, current, onpick) {
    const data = app.data;
    const search = h("input", {type: "search", placeholder: "Search sounds by name or number", "aria-label": "Search",
      style: {width: "100%"}});
    const list = h("div.fe-soundlist", {role: "listbox"});
    const all = Object.keys(data.sounds || {}).map((k) => +k);
    const row = (id, close) => h("div.fe-soundrow" + (id === current ? ".on" : ""),
      h("button.fe-btn.small", {type: "button", onclick: () => { close(); onpick(id); }}, "Pick"),
      h("span", h("b", name(data, id)), h("span.fe-sub", " #" + id)), play(data, id));
    let closeIt = null;
    const draw = () => {
      const q = search.value.trim().toLowerCase();
      EZ.ui.clear(list);
      const groups = q ? [["Matches", all.filter((id) => String(id) === q || name(data, id).toLowerCase().indexOf(q) >= 0)
        .slice(0, 300)]] : [["Erazure's drop sounds", used], ["PD2's Path of Exile drop sounds", data.poeSounds || []]];
      for (const [title, ids] of groups) {
        if (!ids.length) continue;
        list.appendChild(h("h4", title));
        for (const id of ids) list.appendChild(row(id, closeIt));
      }
      if (q && !list.children.length) list.appendChild(h("p.fe-sub", "No sound matches."));
    };
    search.addEventListener("input", draw);
    closeIt = dialog({title: "Pick a drop sound", body: [
      h("p.fe-sub", "Some of the game's sounds never play as drop sounds (looping ones and music)."),
      search, list],
      buttons: [{text: "No sound", onclick: () => onpick(0)}, {text: "Cancel"}]});
    draw();
  }

  return {name, play, pick};
})();

    const {h, toggle, seg} = EZ.ui;
    const F = EZ.filter, S = EZ.sounds;
    const e = EZ.store.current().edits;
    const a = e.alerts || {};
    const lines = app.versionLines();
    const notes = F.notifications(lines);
    const set = (k, v) => EZ.store.change((ed) => {
      ed.alerts = ed.alerts || {};
      if (v) ed.alerts[k] = v; else delete ed.alerts[k];
    }, {label: k});

    const globals = h("section.fe-card",
      h("h3", "Everywhere at once"),
      h("div.fe-stack",
        toggle("No drop sounds", !!a.noSounds, (v) => set("noSounds", v),
          {sub: "Every drop is silent; chat lines and icons stay."}),
        toggle("Icons only: no chat lines or sounds", !!a.iconsOnly, (v) => set("iconsOnly", v),
          {sub: "In BH the chat line and the sound come together: this keeps only the minimap icons."}),
        toggle("No minimap icons", !!a.noIcons, (v) => set("noIcons", v),
          {sub: "An item that only had an icon also loses its chat line (BH needs an icon or a sound to notify)."}),
        h("div.fe-row", h("span", "Icon size"), seg([{value: "", text: "Erazure's"}, {value: "smaller", text: "Smaller"},
          {value: "bigger", text: "Bigger"}], a.iconSize || "", (v) => set("iconSize", v), {label: "Icon size"}))));

    const swaps = e.sounds || {};
    const used = Object.keys(notes.sounds).map((k) => +k).sort((x, y) => notes.sounds[y].length - notes.sounds[x].length);
    const soundRow = (id) => {
      const ruleIdx = notes.sounds[id];
      const poe = ruleIdx.filter((i) => /(^|[\s(])POE_SOUNDS\b/.test(F.rule(lines[i]).cond)).length;
      const where = ruleIdx.slice(0, 3).map((i) => {
        const r = F.rule(lines[i]);
        return r.comment.replace(/^\/\/\s*/, "").trim() || r.cond.replace(/!?POE_SOUNDS\s*/, "").slice(0, 50);
      }).filter(Boolean);
      const to = id in swaps ? +swaps[id] : id;
      const btn = h("button.fe-btn.small", {type: "button", onclick: () => S.pick(app, used, to, (picked) =>
        EZ.store.change((ed) => {
          ed.sounds = ed.sounds || {};
          if (picked === id) delete ed.sounds[id]; else ed.sounds[id] = picked;
        }, {label: "sound"}))}, "Change");
      return h("div.fe-soundrow" + (id in swaps ? ".is-changed" : ""),
        h("div.fe-soundmain",
          h("div", h("b", S.name(app.data, id)), h("span.fe-sub", " #" + id), " ", S.play(app.data, id)),
          h("div.fe-sub", `${ruleIdx.length} rule${ruleIdx.length === 1 ? "" : "s"}` +
            (poe === ruleIdx.length ? " · PoE versions" : poe ? "" : " · non-PoE versions") +
            (where.length ? " · " + where.join(" · ") : ""))),
        id in swaps ? h("div.fe-soundto", "→ ", to ? h("b", S.name(app.data, to)) : h("b", "no sound"),
          to ? S.play(app.data, to) : null) : null,
        h("div.fe-row.fe-small", btn,
          id in swaps ? h("button.fe-btn.ghost.small", {type: "button", onclick: () => EZ.store.change((ed) => {
            delete ed.sounds[id];
          })}, "↺ Erazure's") : h("button.fe-btn.ghost.small", {type: "button", onclick: () =>
            EZ.store.change((ed) => { ed.sounds = ed.sounds || {}; ed.sounds[id] = 0; })}, "Silence")));
    };
    const soundsCard = h("section.fe-card", {id: "fe-sounds"},
      h("h3", "Drop sounds"),
      h("p.fe-sub", "Every sound Erazure plays, most used first. The PoE versions play their own picks: switch your " +
        "version's Path of Exile sounds on Start to hear those."),
      h("div.fe-soundlist", used.map(soundRow)));

    box.append(
      h("div.fe-area-head", h("div", h("h2", "Alerts"),
        h("p.fe-sub", "What a drop does besides its label: its chat line, its sound and its minimap icon."))),
      globals, soundsCard,
      h("p.fe-note", "Minimap icons: change them on ", h("a", {href: "#looks/icons", onclick: (ev) => {
        ev.preventDefault(); app.go("looks", "icons");
      }}, "Looks"), ". How loud each kind of drop is (by tier) comes with the item categories."));
  },
});

/* The areas still being built on the filter-editor branch: each draws a note until its module registers it.
   Removed piece by piece as the areas arrive; the branch is merged only when this file is gone. */
var EZ = typeof EZ !== "undefined" ? EZ : {};
EZ.areas = EZ.areas || [];
(function () {
  "use strict";
  const TODO = [
    ["items", "Items", "◈", 30, "b", "Show, hide, mute or restyle single items; your hunt list; unique and set tiers."],
    ["wishlists", "Wishlists", "★", 60, "b", "Rares, shop items, runeword and crafting bases, charms and jewels you want."],
    ["maps", "Maps", "⌖", 70, "b", "Map lines, mod warnings and hides, minimum experience."],
    ["rules", "My rules", "⊕", 80, "c", "Your own rules: the rule builder and the code editor."],
    ["erazure", "Erazure's rules", "≡", 90, "c", "Every rule of Erazure: browse, switch off or change them."],
    ["changes", "Changes", "⇄", 100, "d", "What your changes do, item by item; every item; compare; troubleshooting."],
    ["help", "Help", "?", 110, "d", "How the editor works, updates, and answers to common questions."],
  ];
  for (const [id, title, icon, order, group, what] of TODO) {
    if (EZ.areas.some((a) => a.id === id)) continue;
    EZ.areas.push({id, title, icon, order, group, render(box) {
      const {h} = EZ.ui;
      box.append(h("div.fe-area-head", h("h2", title)), h("div.fe-empty", h("p", what),
        h("p.fe-sub", "This part of the editor is still being built.")));
    }});
  }
})();

  EZ.app.start(document.querySelector("[data-fe-root]"), DATA, SCRIPT_SRC, SOURCE_V);
})();
</script>
