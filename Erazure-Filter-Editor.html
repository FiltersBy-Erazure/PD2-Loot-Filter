  const notifies = (out) => NOTIFY_RE.test(out);
  const continues = (out) => out.indexOf("%CONTINUE%") >= 0;

  /* The icon keywords of an output, in order ("BORDER-91 MAP-9B DOT-62 PX-68"), "" for none. */
  function icons(out) {
    const found = [];
    ICON_RE.lastIndex = 0;
    let m;
    while ((m = ICON_RE.exec(out))) found.push(m[1].toUpperCase() + "-" + m[2].toUpperCase());
    return found.join(" ");
  }

  function sounds(out) {
    const found = [];
    SOUND_RE.lastIndex = 0;
    let m;
    while ((m = SOUND_RE.exec(out))) found.push(+m[1]);
    return found;
  }

  /* {name: {i, value}} of the alias definitions (the first of a name, as BH reads them all). */
  function aliases(lines) {
    const out = {};
    for (let i = 0; i < lines.length; i++) {
      const m = ALIAS_RE.exec(lines[i]);
      if (m && !out[m[1]]) out[m[1]] = {i, value: EZ.core.bhTrim(m[2].split("//")[0])};
    }
    return out;
  }

  /* The filter level names: [{i, text}] (BH reads 12 at most; level 0 is BH's own "Show All Items"). */
  function levels(lines) {
    const out = [];
    for (let i = 0; i < lines.length && out.length < 12; i++) {
      if (LEVEL_RE.test(lines[i])) {
        const v = lines[i].slice(lines[i].indexOf(":") + 1);
        const c = v.indexOf("//");
        out.push({i, text: c < 0 ? v : v.slice(0, c)});
      }
    }
    return out;
  }

  /* Erazure's own player options (050): [{title, options: [{id, label, lines: [line index], conds}]}], each
     option's rules switched off in the filter until the player switches it on. Options of one group whose rules
     test the same items (the same conditions) are one choice: choice = the option ids that compete. */
  function options(src, lines) {
    const secs = sections(src, lines);
    const range = secs[OPTIONS_SECTION];
    if (!range) return [];
    const groups = [];
    let group = null, opt = null;
    for (let i = range[0]; i < range[1]; i++) {
      const line = lines[i];
      const g = /^\/\/\s+=+\s+(.+?)\s+=+\s*$/.exec(line);
      if (g) {
        group = {title: g[1], options: []};
        groups.push(group);
        opt = null;
        continue;
      }
      if (!group) continue;
      if (!line.trim()) { opt = null; continue; }
      const r = rule(line);
      if (r && r.off) {
        if (opt) {
          opt.lines.push(i);
          opt.conds.push(r.cond.replace(/\s+/g, " ").trim());
        }
        continue;
      }
      const l = /^\/\/\s{2,}(\S.*?)\s*$/.exec(line);
      if (l && !l[1].startsWith("=")) {
        opt = {id: group.title + " / " + l[1], label: l[1], group: group.title, lines: [], conds: []};
        group.options.push(opt);
      }
    }
    for (const gr of groups) {
      gr.options = gr.options.filter((o) => o.lines.length);
      const byConds = new Map();
      for (const o of gr.options) {
        const key = o.conds.slice().sort().join("\n");
        if (!byConds.has(key)) byConds.set(key, []);
        byConds.get(key).push(o);
      }
      for (const set of byConds.values()) for (const o of set) o.choice = set.map((x) => x.id);
    }
    return groups.filter((gr) => gr.options.length);
  }

  /* ---------------------------------------------------------------- look cards (tools/alias_editor.py's) */

  const GROUPS = [  // (id, title, note, which cards: by their first alias's name), in the page's order
    ["uniques", "Unique items", "Unidentified uniques, by tier.", (n) => n.startsWith("UNI_") || n.startsWith("FACET")],
    ["sets", "Set items", "Unidentified set items, by tier.", (n) => n.startsWith("SET")],
    ["rares", "Rare and magic items", "Unidentified rares, jewels, rings, charms and magic crafting bases.",
     (n) => n.startsWith("RARE_") || n.startsWith("MAGIC_")],
    ["runes", "Runes", "Single runes and stacks.", (n) => n.indexOf("RUNE") >= 0 || n.endsWith("BIG_GG")],
    ["pd2", "PD2 items and keys", "Shards, Puzzle items, the Cube, Vial and Mirror, keys, tokens, uber items and " +
     "Craft Infusions.", (n) => !n.endsWith("VERSION_NAME") && !/^(HIGHLIGHT|AMPLIFY|LOWER_RES)/.test(n)],
    ["highlights", "Description highlights", "Lines in item descriptions.",
     (n) => /^(HIGHLIGHT|AMPLIFY|LOWER_RES)/.test(n)],
    ["cube", "Horadric Cube", "Each version's name in the Horadric Cube's description.",
     (n) => n.endsWith("VERSION_NAME")],
  ];
  const keyOf = (name) => name.replace(/_(LEFT|RIGHT)$/, "");
  const OFF_TOGGLES = ["BIG_GG", "POE_SOUNDS", "REVEALED"];

  function lookAliases(src, lines) {
    const secs = sections(src, lines), out = [];
    const [a0, a1] = secs[SYMBOLS_SECTION] || [0, 0];
    let title = "", inComment = false;
    for (let i = a0; i < a1; i++) {
      const line = lines[i];
      if (line.startsWith("// ") && !inComment) title = line.slice(3).split(":")[0].trim();
      inComment = line.startsWith("//");
      const m = ALIAS_RE.exec(line);
      if (m && m[2].indexOf("%") >= 0 && !m[2].startsWith("(")) out.push({name: m[1], i, value: m[2], title});
    }
    const [c0, c1] = secs[CUBE_SECTION] || [0, 0];
    for (let i = c0; i < c1; i++) {
      const m = ALIAS_RE.exec(lines[i]);
      if (m && m[1].endsWith("VERSION_NAME")) out.push({name: m[1], i, value: m[2], title: m[2]});
    }
    return out;
  }

  /* A rule's output as the label it draws with this card's aliases: aliases and %NAME% left in, the description
     where the alias sits in it (alias_editor.template). */
  function template(names, line) {
    const r = rule(line);
    let out = r.out;
    const body = /\{(.*)\}/.exec(out);
    if (body && body[1].indexOf("%" + names[0] + "%") >= 0) {
      out = body[1].split(/%CL%|%NL%/).find((p) => p.indexOf("%" + names[0] + "%") >= 0);
    } else {
      out = out.replace(/\{.*\}/, "");
    }
    out = out.replace(/%(CONTINUE|(BORDER|MAP|DOT|PX)-[0-9A-Fa-f]+|SOUNDID-\d+|TIER-\d)%/g, "");
    const band = /\bED(?:>(\d+)|~(\d+)-)/.exec(r.cond);
    const ed = String((band ? (band[1] ? +band[1] + 1 : +band[2]) : 500) + 12);
    return out.replace(/%QTY%/g, "12").replace(/%ILVL%/g, "92").replace(/%ED%/g, ed).replace(/%EDAM%/g, ed)
      .replace(/\s+$/, "");
  }

  /* The look cards: [{key, title, group, aliases: [{name, i, value}], tpls: [{tpl, at}]}] (alias_editor.page_data,
     its looks(): the different labels the card's aliases decide, at most 3, one item before a stack). */
  function lookCards(src, lines) {
    const list = lookAliases(src, lines);
    const names = new Set(list.map((a) => a.name));
    const order = new Map(list.map((a, k) => [a.name, k]));
    const rules = [];
    for (let i = 0; i < lines.length; i++) if (lines[i].startsWith("ItemDisplay[")) rules.push(i);
    const cards = [], seen = new Set();
    for (const a of list) {
      if (seen.has(a.name)) continue;
      const key = keyOf(a.name);
      const group = list.filter((b) => keyOf(b.name) === key);
      for (const b of group) seen.add(b.name);
      const gnames = group.map((b) => b.name);
      const found = [];
      for (const i of rules) {
        const line = lines[i];
        const r = rule(line);
        if (!r) continue;
        const words = r.cond.replace(/[()]/g, " ").split(/\s+/);
        if (OFF_TOGGLES.some((t) => words.indexOf(t) >= 0)) continue;
        const used = [...names].filter((n) => line.indexOf("%" + n + "%") >= 0);
        if (!used.length) continue;
        const last = used.reduce((x, y) => (order.get(x) > order.get(y) ? x : y));
        if (gnames.indexOf(last) < 0) continue;
        const tpl = template(gnames, line);
        const same = (t) => t.replace(/(%[A-Z_]+%)+(?=%NAME%)/g, "");
        if (!found.some((f) => same(f.tpl) === same(tpl))) found.push({tpl, at: i, stack: r.cond.indexOf("QTY>") >= 0});
      }
      found.sort((x, y) => x.stack - y.stack);
      let tpls = found.slice(0, 3).map((f) => ({tpl: f.tpl, at: f.at}));
      if (!tpls.length) {
        const fallback = rules.find((i) => gnames.every((n) => lines[i].indexOf("%" + n + "%") >= 0));
        tpls = [fallback !== undefined ? {tpl: template(gnames, lines[fallback]), at: fallback}
                                       : {tpl: "%" + gnames[0] + "%  %NAME%  " + gnames.slice(1).map((n) => "%" + n + "%").join(""),
                                          at: null}];
      }
      const g = GROUPS.find((gr) => gr[3](a.name));
      cards.push({key, title: a.title, group: g ? g[0] : "pd2", aliases: group, tpls});
    }
    return cards;
  }

  /* Every distinct drop sound and icon combination of the rules: {sounds: {id: [line]}, icons: {combo: [line]}}. */
  function notifications(lines) {
    const out = {sounds: {}, icons: {}};
    for (let i = 0; i < lines.length; i++) {
      if (!lines[i].startsWith("ItemDisplay[")) continue;
      const r = rule(lines[i]);
      if (!r) continue;
      for (const s of sounds(r.out)) (out.sounds[s] || (out.sounds[s] = [])).push(i);
      const ic = icons(r.out);
      if (ic) (out.icons[ic] || (out.icons[ic] = [])).push(i);
    }
    return out;
  }

  return {sections, sectionOf, rule, notifies, continues, icons, sounds, aliases, levels, options, lookCards,
          lookAliases, notifications, GROUPS: GROUPS.map((g) => ({id: g[0], title: g[1], note: g[2]})), keyOf,
          ICON_RE, SOUND_RE, TIER_RE, NOTIFY_RE, ALIAS_RE, OPTIONS_SECTION};
})();

/* ---- tools/editor/edits.js ---- */
/* The Filter Editor's edits: a profile's edit set applied to a version's lines (alias form), in a fixed order, each
   step a plain text change BH reads as the player meant. Every step finds its lines by what they say (section names,
   option labels, alias names, rule text), so the same edits apply to every new Erazure; a step that can't place an
   edit says so in the report instead of guessing.

   The order: changes to Erazure's own rules (EZ.ops) -> Erazure's options (050) -> features -> looks -> color remap
   -> sounds -> icons -> alert switches -> filter level names and copies -> (later steps: categories, items, the
   player's own rules...) -> the Cube's Custom mark. The header
   (the edit set itself, so a saved file can be imported again) is added by headerLines, after the aliases are
   written out. tools/editor_selftest.py checks every step against a Python version of it. */
var EZ = typeof EZ !== "undefined" ? EZ : {};
EZ.edits = (function () {
  "use strict";
  const F = EZ.filter;

  const COLORS = ["WHITE", "RED", "GREEN", "BLUE", "GOLD", "GRAY", "BLACK", "TAN", "ORANGE", "YELLOW", "PURPLE",
                  "DARK_GREEN", "CORAL", "SAGE", "TEAL", "LIGHT_GRAY"];
  const COLOR_RE = new RegExp("%(" + COLORS.join("|") + ")%", "g");
  const ICON_ANY = /%(?:BORDER|MAP|DOT|PX)-[0-9a-f]{1,4}%/gi;
  const SOUND_ANY = /%SOUNDID-\d{1,4}%/gi;
  const TIER_ANY = /%TIER-\d%/gi;
  const FILTLVL_RE = /FILTLVL(=|<|>|~)(\d+)(?:-(\d+))?/g;
  const SITE = "https://filtersby-erazure.github.io/PD2-Loot-Filter/editor/";

  /* ---------------------------------------------------------------- helpers */

  /* Change every rule line's output (active and switched-off rules): fn(out, rule, i) -> new output. */
  function eachOutput(lines, fn) {
    for (let i = 0; i < lines.length; i++) {
      const r = F.rule(lines[i]);
      if (!r) continue;
      const out = fn(r.out, r, i);
      if (out !== r.out) lines[i] = r.head + out + r.comment;
    }
  }

  function setAlias(lines, name, value) {
    const re = new RegExp("^Alias\\[" + name + "\\]:");
    for (let i = 0; i < lines.length; i++) {
      if (re.test(lines[i])) {
        lines[i] = "Alias[" + name + "]:" + value;
        return true;
      }
    }
    return false;
  }

  function featureDefault(f) { return f.on === undefined ? true : f.on; }

  /* ---------------------------------------------------------------- the steps */

  function options(ctx) {
    const want = ctx.edits.options || {};
    const ids = Object.keys(want).filter((k) => want[k]);
    if (!ids.length) return;
    const groups = F.options(ctx.src, ctx.lines);
    const byId = new Map();
    for (const g of groups) for (const o of g.options) byId.set(o.id, o);
    for (const id of ids) {
      const o = byId.get(id);
      if (!o) { ctx.unplaced("options", id, "Erazure no longer has this option"); continue; }
      for (const i of o.lines) ctx.lines[i] = ctx.lines[i].replace(/^\s*\/\/+\s*/, "");
    }
  }

  function features(ctx) {
    const want = ctx.edits.features || {};
    for (const f of EZ.features) {
      if (!(f.id in want) || !!want[f.id] === featureDefault(f)) continue;
      const on = !!want[f.id];
      if (f.sections && !on) {
        const secs = F.sections(ctx.src, ctx.lines);
        for (const name of f.sections) {
          const range = secs[name];
          if (!range) { ctx.unplaced("options", f.title, `Erazure no longer has ${name}`); continue; }
          for (let i = range[0]; i < range[1]; i++) {
            const line = ctx.lines[i];
            if (!line.startsWith("ItemDisplay[")) continue;
            const r = F.rule(line);
            if (r && F.continues(r.out) && !F.notifies(r.out)) ctx.lines[i] = "//" + line;
          }
        }
      } else if (f.aliases && !on) {
        const names = Array.isArray(f.aliases) ? f.aliases
          : Object.keys(F.aliases(ctx.lines)).filter((n) => f.aliases.test(n));
        if (!names.length) ctx.unplaced("options", f.title, "Erazure no longer has these aliases");
        for (const n of names) if (!setAlias(ctx.lines, n, "FALSE")) ctx.unplaced("options", f.title, `no Alias[${n}]`);
      } else if (f.switchOn && on) {
        const range = F.sections(ctx.src, ctx.lines)[f.switchOn.section];
        if (!range) { ctx.unplaced("options", f.title, `Erazure no longer has ${f.switchOn.section}`); continue; }
        let n = 0;
        for (let i = range[0]; i < range[1]; i++) {
          const r = F.rule(ctx.lines[i]);
          if (r && r.off && ctx.lines[i].indexOf(f.switchOn.match) >= 0) {
            ctx.lines[i] = ctx.lines[i].replace(/^\s*\/\/+\s*/, "");
            n++;
          }
        }
        if (!n) ctx.unplaced("options", f.title, "Erazure no longer has these lines");
      }
    }
  }

  function looks(ctx) {
    const want = ctx.edits.looks || {};
    for (const name of Object.keys(want)) {
      if (typeof want[name] !== "string") continue;
      if (!setAlias(ctx.lines, name, want[name])) ctx.unplaced("looks", name, "Erazure no longer has this look");
    }
  }

  function remap(ctx) {
    const map = ctx.edits.remap || {};
    const keys = Object.keys(map).filter((k) => COLORS.indexOf(k) >= 0 && COLORS.indexOf(map[k]) >= 0 && map[k] !== k);
    if (!keys.length) return;
    const swap = (s) => s.replace(COLOR_RE, (m, c) => keys.indexOf(c) >= 0 ? "%" + map[c] + "%" : m);
    eachOutput(ctx.lines, (out) => swap(out));
    for (let i = 0; i < ctx.lines.length; i++) {
      const m = F.ALIAS_RE.exec(ctx.lines[i]);
      if (m && m[2].indexOf("%") >= 0 && !m[2].trimStart().startsWith("(")) {
        ctx.lines[i] = "Alias[" + m[1] + "]:" + swap(m[2]);
      }
    }
  }

  function sounds(ctx) {
    const map = ctx.edits.sounds || {}, all = ctx.edits.alerts && ctx.edits.alerts.noSounds;
    if (!all && !Object.keys(map).length) return;
    eachOutput(ctx.lines, (out) => out.replace(SOUND_ANY, (m) => {
      if (all) return "";
      const id = String(+m.slice(9, -1));
      if (!(id in map)) return m;
      const to = +map[id];
      return to > 0 ? "%SOUNDID-" + to + "%" : "";
    }));
  }

  /* An icon combination's keywords ("BORDER-91 MAP-9B" -> "%BORDER-91%%MAP-9B%"). */
  const keywords = (combo) => combo ? combo.split(" ").map((k) => "%" + k + "%").join("") : "";
  const SIZES = ["BORDER", "MAP", "DOT", "PX"];

  function resized(combo, how) {
    const parts = combo.split(" ").filter(Boolean).map((k) => k.split("-"));
    if (how === "smaller") {
      return parts.map(([l, c]) => [SIZES[SIZES.indexOf(l.toUpperCase()) + 1], c]).filter(([l]) => l)
        .map(([l, c]) => l + "-" + c).join(" ");
    }
    if (how === "bigger" && parts.length && !parts.some(([l]) => l.toUpperCase() === "BORDER")) {
      const outer = parts.find(([l]) => l.toUpperCase() === "MAP") || parts[0];
      return ["BORDER-" + outer[1], ...parts.map(([l, c]) => l + "-" + c)].join(" ");
    }
    return combo;
  }

  function icons(ctx) {
    const map = ctx.edits.icons || {}, a = ctx.edits.alerts || {};
    const size = a.iconSize === "smaller" || a.iconSize === "bigger" ? a.iconSize : null;
    if (!a.noIcons && !size && !Object.keys(map).length) return;

      const line = ctx.lines[i];

      Object.keys((e.levels || {}).names || {}).length + Object.keys((e.levels || {}).copies || {}).length,
    looks: (e) => Object.keys(e.looks || {}).length + Object.keys(e.remap || {}).length + Object.keys(e.icons || {}).length,

  function b64url(bytes) {

  async function pack(payload) {

  async function unpack(text, limit) {

  /* The comment lines that open a saved file: what it is, and the edit set (EDITS k/n), so importing it restores
     the edits. */
  async function headerLines(src, profile, variant, count) {
    const data = await pack({app: "erazure-filter-editor", v: EZ.store.SCHEMA, name: profile.name, file: profile.file,
                             edits: profile.edits});
    const chunks = [];
    for (let i = 0; i < data.length; i += 1000) chunks.push(data.slice(i, i + 1000));
    return [
      "// Made with the Erazure Filter Editor: " + SITE,
      `// ${variant.launcher} with ${count} change${count === 1 ? "" : "s"}, on Erazure ${src.version}. To change it or to`,
      "// bring it up to date, open the editor and import this file: your changes are in the EDITS lines below.",
      ...chunks.map((c, k) => `// EDITS ${k + 1}/${chunks.length} ${c}`),
      "",

  }

  /* The edit set of a saved file's text (its EDITS lines), or null. */
  async function fromFile(text) {
    const parts = [];
    const re = /^\/\/ EDITS (\d+)\/(\d+) (\S+)\s*$/gm;
    let m, total = 0;
    while ((m = re.exec(text))) { parts[+m[1] - 1] = m[3]; total = +m[2]; }
    if (!total || parts.length !== total || parts.some((p) => !p)) return null;
    const data = await unpack(parts.join(""));

  }

  return {apply, step, count, countArea, counter, headerLines, fromFile, pack, unpack, copyLevels, COLORS,

/* The player's own rules (My rules): two blocks of filter lines the player writes or builds, one above Erazure's rules
   (right before 050's options, after 045 / 047's name rebuilds, so their %NAME% has Erazure's base names) and one
   below them (right before 370's catch-all), each between two marker comments. Lines are put in as they are typed;
   BH reads them with every alias (Erazure's too), and the aliases are written out with the rest of the file.

   Also the rule builder's text: EZ.rules.build(spec) -> one rule line from the builder's fields (the area draws the
   form; tools/editor_selftest.py checks the lines it makes). */

EZ.rules = (function () {
  "use strict";

  const MARKS = {
    top: ["// ===============  Your own rules (Erazure Filter Editor), above Erazure's rules  ===============",
          "// ===============  End of your own rules above Erazure's  ==============="],
    bottom: ["// ===============  Your own rules (Erazure Filter Editor), below Erazure's rules  ===============",
             "// ===============  End of your own rules below Erazure's  ==============="],
  };

  /* A block's text as lines (any line breaks; no line break characters left in a line). */
  function lines(text) {
    if (typeof text !== "string" || !text) return [];

    while (out.length && !out[out.length - 1].trim()) out.pop();

  function active(list) { return list.filter((l) => l.trim() && !isComment(l)); }

  function blockText(e, which) { return e && e.rules && typeof e.rules[which] === "string" ? e.rules[which] : ""; }

  function count(e) {
    let n = 0;

    return n;

  /* The edit step: each block that has a line BH reads goes in with its markers. */
  function apply(ctx) {

      if (!active(list).length) continue;
      const secs = EZ.filter.sections(ctx.src, ctx.lines);
      const range = secs[PLACE[which]];

    if (key.startsWith("Formula[")) return {kind: "formula", name: key.slice(8, -1)};
    if (key.startsWith("ItemDisplayFilterName[")) return {kind: "level"};
    if (!key.startsWith("ItemDisplay[") || j < 0) return {kind: "other"};
    const out = EZ.core.bhTrim(code.slice(j + 1));

    const notifies = EZ.filter.notifies(out);

    return {kind: "rule", cond: key.slice(12, -1), out, stops: !cont, hides: !cont && !text.length, notifies};

  /* One stat row of the builder: {word, op, a, b} for a named word, {stat: n}, {skill: id, total: {tab, cls}}. */
  function statWords(s) {

      if (id === null) return "";

   open), and only for them:

      ((s.clvl || []).some((x) => x !== "" && x !== null && x !== undefined) ? 5 : 0);

  /* ---------------------------------------------------------------- the rules, read as BH reads them */

  const memo = new Map();
  let memoKey = null;

  /* Every active rule of the lines: [{i, r (EZ.filter.rule), tree, act}], conditions and outputs with the aliases
     written in (kept by line text while the aliases stay the same). */
  function read(lines) {
    const entries = EZ.core.bhEntries(lines);
    const aliases = EZ.core.bhAliases(entries);
    const key = aliases.map((a) => a.name + "=" + a.value).join("\n");
    if (key !== memoKey || memo.size > 60000) { memo.clear(); memoKey = key; }
    const F = {formulas: Object.create(null), formulaText: Object.create(null), statMax: 1023, skillMax: 1023,
               soundCount: 10000};
    const cat = EZ.items.catalog && EZ.items.catalog();
    if (cat) { F.statMax = cat.statMax; F.skillMax = cat.skillMax; }
    for (const e of entries) {
      const m = /^Formula\[(.*)\]$/.exec(e.key);
      if (!m) continue;
      const node = EZ.engine.compileFormula(e.value);
      if (node) F.formulas["FORMULA" + m[1].replace(/[a-z]/g, (x) => x.toUpperCase())] = node;
    }
    const namer = EZ.engine.islandNamer();
    const out = [];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (!line.startsWith("ItemDisplay[")) continue;
      const r = EZ.filter.rule(line);
      if (!r) continue;
      let m = memo.get(line);
      if (!m) {
        const t = EZ.core.substitute([[r.cond], [EZ.core.bhTrim(r.out)]], aliases);
        const isl = EZ.engine.islandsOf(t[0][0], "", "", F, namer);
        m = {tree: EZ.engine.condition(isl, F), act: EZ.engine.action(EZ.engine.islandsOf(t[1][0], "%", "%", F, namer), F)};
        memo.set(line, m);
      }
      out.push({i, r, tree: m.tree, act: m.act});
    }
    return {rules: out, F};
  }

  /* ---------------------------------------------------------------- rewriting lines */

  function withCond(line, extra) {
    const r = EZ.filter.rule(line);
    return r.off + "ItemDisplay[" + (r.cond ? r.cond + " " : "") + extra + "]:" + r.out + r.comment;
  }
  function withOut(line, out) {
    const r = EZ.filter.rule(line);
    return r.off + "ItemDisplay[" + r.cond + "]:" + out + r.comment;
  }
  const notifyKeys = (out) => (out.match(NOTIFY_ALL) || []).join("");
  const descOf = (out) => { const m = /\{[^}]*\}?/.exec(out.replace(NOTIFY_ALL, "")); return m ? m[0] : ""; };
  const icons = (combo) => combo ? combo.split(" ").filter(Boolean).map((k) => "%" + k + "%").join("") : "";

  /* The alert keywords the player picked: icon layers, a sound, the chat line. */
  function alertText(a) {
    a = a || {};
    let out = "";
    for (const l of EZ.rules.LAYERS) {
      const c = String((a.icon || {})[l] || "");
      if (/^[0-9A-Fa-f]{1,2}$/.test(c)) out += "%" + l + "-" + c.toUpperCase().padStart(2, "0") + "%";
    }
    const s = int(a.sound);
    if (s && s > 0) out += "%SOUNDID-" + s + "%";
    if (out && a.chat === "none") out += "%TIER-0%";
    else if (out && a.chat === "tier" && int(a.tier) !== null) out += "%TIER-" + Math.max(0, Math.min(9, int(a.tier))) + "%";
    return out;
  }

  /* The player's text for a look (no // and no line breaks; braces only as they wrote them). */
  const clean = (t) => String(t || "").replace(/[\r\n]+/g, " ").replace(/\/\/+/g, "/");

  /* One override applied to the lines: {lines, top: [lines before Erazure's], bottom: [lines before the end]}. */
  function one(lines, o) {
    const X = cond(o.scope);
    if (!X) return {lines, top: [], bottom: []};
    const {rules, F} = read(lines);
    const items = partials(o.scope), ctxs = contexts(o.scope);
    const can = (x) => x.tree && items.some((it) => ctxs.some((c) => EZ.engine.evalCondition(x.tree, it, c, F) !== 0));
    const add = new Map(), split = new Map();  // line -> extra condition; line -> twin output
    const top = [], bottom = [];
    const g = "(" + X + ")";
    if (o.action === "show") {
      for (const x of rules) {
        if (x.act.text.length || !can(x)) continue;
        if (x.act.notifies && !x.act.cont) split.set(x.i, "%NAME%{%NAME%}" + notifyKeys(x.r.out) + "%CONTINUE%");
        else add.set(x.i, "!" + g);
      }
    } else if (o.action === "hide") {
      const hidden = "(" + g + " GROUND !TOWN FILTLVL>0)";
      top.push("ItemDisplay[" + g + " GROUND !TOWN FILTLVL>0]:");
      for (const x of rules) if (x.act.notifies && can(x)) add.set(x.i, "!" + hidden);
    } else if (["mute", "sound", "icon", "iconOnly"].indexOf(o.action) >= 0) {
      for (const x of rules) {
        if (!x.act.notifies || !can(x)) continue;
        let out = x.r.out;
        if (o.action === "mute") out = out.replace(SOUNDS, "");
        else if (o.action === "sound") {
          const s = int(o.sound);
          const kw = s && s > 0 ? "%SOUNDID-" + s + "%" : "";
          out = out.search(SOUNDS) >= 0 ? out.replace(SOUNDS, () => kw) : out + kw;
        } else if (o.action === "icon") {
          const kw = icons(typeof o.icon === "string" ? o.icon : "");
          const at = out.search(ICONS);
          out = at >= 0 ? out.replace(ICONS, "").slice(0, at) + kw + out.replace(ICONS, "").slice(at) : out + kw;
        } else {
          out = out.search(TIERS) >= 0 ? out.replace(TIERS, "%TIER-0%") : out + "%TIER-0%";
        }
        if (out !== x.r.out) split.set(x.i, out);
      }
    } else if (o.action === "notify") {
      const kw = alertText(o.alert);
      if (!kw) return {lines, top, bottom};
      const rule = "ItemDisplay[" + X + "]:%NAME%{%NAME%}" + kw + "%CONTINUE%";
      if (o.mode === "instead") {
        top.push(rule);
        for (const x of rules) {
          if (!x.act.notifies || !can(x)) continue;
          split.set(x.i, x.r.out.replace(NOTIFY_ALL, ""));
        }
      } else bottom.push(rule);
    } else if (o.action === "look") {
      const text = clean(o.text);
      for (const x of rules) {
        if (x.act.cont || !x.act.text.length || !can(x)) continue;
        split.set(x.i, text.replace(/[{}]/g, "") + descOf(x.r.out) + notifyKeys(x.r.out));
      }
    } else if (o.action === "replace") {
      top.push("ItemDisplay[" + X + "]:" + clean(o.text));
    }
    if (!add.size && !split.size) return {lines, top, bottom};
    const out = [];
    for (let i = 0; i < lines.length; i++) {
      if (add.has(i)) out.push(withCond(lines[i], add.get(i)));
      else if (split.has(i)) {
        out.push(withCond(lines[i], "!" + g));
        out.push(withOut(withCond(lines[i], g), split.get(i)));
      } else out.push(lines[i]);
    }
    return {lines: out, top, bottom};
  }

  /* The edit step (after the level copies, before the player's own rules). */
  function apply(ctx) {
    const list = (ctx.edits.items || []).filter(valid);
    if (!list.length) return;
    const sorted = list.map((o, k) => ({o, k, n: narrowness(o)})).sort((a, b) => a.n - b.n || a.k - b.k);
    const tops = [], bottoms = [];
    let lines = ctx.lines;
    for (const {o, n} of sorted) {
      const r = one(lines, o);
      lines = r.lines;
      if (r.top.length) tops.push({n, lines: r.top});
      if (r.bottom.length) bottoms.push({n, lines: r.bottom});
    }
    tops.sort((a, b) => b.n - a.n);  // the narrowest first: a stopping rule there wins
    ctx.lines = lines;
    const put = (which, groups, section) => {
      if (!groups.length) return;
      const secs = EZ.filter.sections(ctx.src, ctx.lines);
      const range = secs[section];
      if (!range) { ctx.unplaced("items", which, "Erazure no longer has " + section); return; }
      ctx.lines.splice(range[0], 0, MARKS[which][0], ...groups.flatMap((g) => g.lines), MARKS[which][1]);
    };
    put("top", tops, EZ.rules.PLACE.top);
    put("bottom", bottoms, EZ.rules.PLACE.bottom);
  }

  return {apply, one, cond, partials, contexts, read, alertText, valid, narrowness, ACTIONS, MARKS};
})();

if (EZ.edits) {
  EZ.edits.step(500, (ctx) => EZ.overrides.apply(ctx));
  EZ.edits.counter("items", (e) => (e.items || []).filter(EZ.overrides.valid).length);
}

/* The Filter Editor's drawing of what the game draws. Text is in BH's color codes (ÿc + a character, looked up in

   string's first line drawn at the bottom, each line centred, a color carrying on to the line above).

    "\x0B": "A6E0A7FF", "\x0C": "A9A9B0FF", "\x0D": "A9B1B1FF", "\x0E": "E2ABE2FF", "\x0F": "EB2EAEFF",
    "\x10": "B0B2E2FF", "\x11": "EBEBE1FF", "\x12": "E22EB8FF", "\x13": "EBEBEBFF", "\x14": "21C7CAFF",
    "\x15": "CB21CDFF", "\x16": "CED126FF", "\x17": "D2D328FF", "\x18": "D5D6D8FF", "\x19": "D9D965FF",
    "\x1A": "DA29DAFF", "\x1B": "DC68DBFF", "\x1C": "DCAD2BFF", "\x1D": "2BDFDFFF", "\x1E": "DFADDFFF",
    "\x1F": "2CE02CFF", "!": "E0B3B3FF", "\"": "2C2CE1FF", "#": "E1E1E2FF", "$": "E2EBEBFF", "%": "EBEB77FF",
    "&": "898D8BFF", "'": "8D8D8BFF", "(": "8EA1A0FF", ")": "0DCCE9FF", "*": "2325CEFF", "+": "8DEAD3FF",
    ",": "D5D3EAFF", "-": "EAD8D9FF", ".": "29DCDCFF", "/": "DFDFEBFF", "0": "FEFEFEFF", "1": "FE6950FF",
    "2": "25FE00FF", "3": "7B7BFEFF", "4": "DFB679FF", "5": "7B7B7BFF", "6": "00000000", "7": "D9CD8EFF",
    "8": "FFB200FF", "9": "EBEB75FF", ":": "008C00FF", ";": "B700FFFF", "<": "00D200FF", "=": "EBEBEBFF",
  };

  const WORDS = {WHITE: "0", RED: "1", GREEN: "2", BLUE: "3", GOLD: "4", GRAY: "5", BLACK: "\x02", TAN: "7",

                 LIGHT_GRAY: "\x0C", FULL_TRANS: "@", THREE_FOURTHS_TRANS: "A", HALF_TRANS: "B", QUARTER_TRANS: "C"};

  function lines(text, start) {

     solid black, no fade), cut: [visible characters cut off] (drawn ghosted), zoom}. */

    if (opts.zoom) box.style.fontSize = (13.5 * opts.zoom) + "px";

  }

  /* The text without its color codes, lines top first joined by " / " (for screen readers and copying). */
  function plain(text) {
    return lines(text).map((segs) => segs.map((s) => s.text).join("")).join(" / ");
  }

  /* A filter level name as the launcher and BH's menu show it (its own codes in its own colors, on no box). */
  function levelName(text) {
    const out = h("span.fe-levelname");
    for (const segs of lines(text, "0")) {
      for (const s of segs) {
        const span = h("span", s.text);
        const c = rgb(s.color);
        if (c) span.style.color = c;
        out.appendChild(span);

})();

/* The Filter Editor's game text: labels, chat lines and hover boxes drawn the way PD2's HD text (D2GL,

   then the glyph (the median of its three distances against the font's weight, sharpened by the font's size), on the
   label's 60% black box that fades out at both ends; lines centred, the string's first line at the bottom, a color
   carrying on to the line above (tools/example_shots.py draws the website's Examples the same way).

      if (sheets[name]) return Promise.resolve(true);
      if (!loading[name]) {
        const a = info.atlases[name];
        loading[name] = new Promise((resolve) => {
          const img = new Image();

            try {

    out[0] /= 255; out[1] /= 255; out[2] /= 255; out[3] /= 255;
  }

  /* One glyph at pen (x, baseline y) in buffer pixels, size: the font's size in buffer pixels. shadow: its strength
     (the font's, or a share of it), 0 for none. */
  const tap = [0, 0, 0, 0];
  function drawGlyph(buf, font, ch, x, y, size, seg, shadow) {
    const [s, g, symbol] = glyph(font, ch);
    const [, pl, , , pt, left, top, right, bottom] = g;
    if (right <= left) return;
    const scale = size / 32;
    const qx = x + pl * size, qy = y - pt * size + (symbol ? size * font.symbolOff : 0);
    const qw = (right - left) * scale, qh = (bottom - top) * scale;
    const weight = symbol ? 1 + (font.weight - 1) * 0.5 : font.weight;
    const [r, gg, b, ca] = seg.rgb;
    const alpha = seg.alpha * ca;
    const shade = r + gg + b < 0.1 * 255 * 3 ? 0.8 * 255 : 0;
    const smooth = Math.max(font.size, 1);
    const y0 = Math.round(qy), y1 = Math.round(qy + qh), x0 = Math.round(qx), x1 = Math.round(qx + qw);
    for (let py = y0; py < y1; py++) {
      const v = top + (py + 0.5 - qy) / scale;
      for (let px = x0; px < x1; px++) {
        sample(s, left + (px + 0.5 - qx) / scale, v, tap);
        if (shadow) {
          const sa = tap[3] < 0.26 ? 0 : smoothstep(0, 1, tap[3]) * shadow;
          buf.blend(px, py, shade, shade, shade, sa * alpha);
        }
        const msd = Math.max(Math.min(tap[0], tap[1]), Math.min(Math.max(tap[0], tap[1]), tap[2]));
        const op = Math.min(Math.max(smooth * (msd - (1 - 0.5 * weight)) + 0.5, 0), 1);
        buf.blend(px, py, r, gg, b, op * alpha);
      }
    }
  }

  function drawLine(buf, font, segs, x, y, size, k, shadow) {
    for (const seg of segs) {
      for (const ch of seg.text) {
        const g = glyph(font, ch)[1];
        if (ch !== " ") drawGlyph(buf, font, ch, x, y, size, seg, shadow);
        x += (g[0] * font.size + font.spacing * font.size) * k;
      }
    }
  }

  /* A dropped item's label (D2GL's drawRectangledText): a canvas, or null until the font is there.
     opts: {start: the game's color code, zoom: CSS pixels per game pixel, state: "ground" | "alt" (hovered with Alt:
     blue) | "hover" (hovered without Alt: solid black, no fade, no shadow)}. */
  const cache = new Map();
  function cached(key, make) {
    let c = cache.get(key);
    if (!c) {
      c = make();
      cache.set(key, c);
      if (cache.size > 400) cache.delete(cache.keys().next().value);
    }
    const copy = document.createElement("canvas");
    copy.width = c.width; copy.height = c.height;
    copy.style.width = c.style.width;
    copy.className = c.className;
    for (const a of ["role", "aria-label"]) copy.setAttribute(a, c.getAttribute(a));
    copy.getContext("2d").drawImage(c, 0, 0);
    return copy;
  }

  function label(text, opts) {
    opts = opts || {};
    if (!ready("label")) return null;
    return cached(["l", text, opts.start, opts.zoom, opts.state, window.devicePixelRatio].join("|"), () => drawLabel(text, opts));
  }

  function drawLabel(text, opts) {
    const font = info.fonts.label;
    const ls = lines(text, opts.start);
    const widths = ls.map((segs) => lineWidth(font, segs));
    const tw = Math.max(0, ...widths);
    const th = (ls.length - 1) * font.size * font.lineHeight + font.size;
    const padX = 3.4, padY = Math.max(1.4, (18 - font.size) / 2);
    const ext = Math.max(Math.min(tw * 0.1, 15), 10);
    const w = tw + 2 * (padX + ext), h = th + 2 * padY;
    const zoom = opts.zoom || 1.5;
    const k = zoom * (window.devicePixelRatio || 1);
    const buf = new Buffer(Math.ceil(w * k), Math.ceil(h * k));
    const state = opts.state || "ground";
    const fade = state === "hover" ? 0 : ext / (tw + 10);
    const [br, bg, bb, ba] = state === "alt" ? [33, 63, 152, 0.867] : state === "hover" ? [0, 0, 0, 0.8] : [0, 0, 0, 0.6];
    for (let py = 0; py < buf.h; py++) {
      for (let px = 0; px < buf.w; px++) {
        const u = (px + 0.5) / buf.w;
        const f = !fade ? 1 : u < 0.5 ? smoothstep(0, fade, u) : smoothstep(1, 1 - fade, u);
        buf.blend(px, py, br, bg, bb, ba * f);
      }
    }
    const shadow = state === "hover" ? 0 : font.shadow;
    const base = font.size + padY + font.size * font.offY;
    ls.forEach((segs, n) => {
      const x = (w - widths[n]) / 2;
      drawLine(buf, font, segs, x * k, (base + n * font.size * font.lineHeight) * k, font.size * k, k, shadow);
    });
    const c = buf.toCanvas(w * zoom, h * zoom);
    c.className = "fe-glabel";
    c.setAttribute("role", "img");
    c.setAttribute("aria-label", EZ.render.plain(text));
    return c;
  }

  /* A chat line (D2GL's chat: font 13, left aligned, each line on its own 60% black box, half the shadow). */
  function chat(text, opts) {
    opts = opts || {};
    if (!ready("chat")) return null;
    return cached(["c", text, opts.start, opts.zoom, window.devicePixelRatio].join("|"), () => drawChat(text, opts));
  }

  function drawChat(text, opts) {
    const font = info.fonts.chat;
    const segs = lines(text.replace(/\n/g, " "), opts.start)[0] || [];
    const tw = lineWidth(font, segs);
    const padX = 3, padY = 2;
    const w = tw + 2 * padX, h = font.size * 1.25 + 2 * padY;
    const zoom = opts.zoom || 1.5;
    const k = zoom * (window.devicePixelRatio || 1);
    const buf = new Buffer(Math.ceil(w * k), Math.ceil(h * k));
    for (let py = 0; py < buf.h; py++) for (let px = 0; px < buf.w; px++) buf.blend(px, py, 0, 0, 0, 0.6);
    drawLine(buf, font, segs, padX * k, (padY + font.size + font.size * font.offY) * k, font.size * k, k,
             font.shadow * 0.5);
    const c = buf.toCanvas(w * zoom, h * zoom);
    c.className = "fe-gchat";
    c.setAttribute("role", "img");
    c.setAttribute("aria-label", EZ.render.plain(text));
    return c;
  }

  /* The hover box (D2GL: font 14, no shadow, padding 10 x 5, the lines centred, a 0.8 fill tinted at the top by the
     item's quality, a fine inner edge). text: one string, bottom line first. */
  function hover(text, opts) {
    opts = opts || {};
    if (!ready("hover")) return null;
    return cached(["h", text, opts.start, opts.zoom, opts.tint, window.devicePixelRatio].join("|"), () => drawHover(text, opts));
  }

  function drawHover(text, opts) {
    const font = info.fonts.hover;
    const ls = lines(text, opts.start || "3");
    const widths = ls.map((segs) => lineWidth(font, segs));
    const padX = 10, padY = 5, pitch = font.size * font.lineHeight;
    const w = Math.max(...widths, 40) + 2 * padX, h = (ls.length - 1) * pitch + font.size + 2 * padY + 2;
    const zoom = opts.zoom || 1.3;
    const k = zoom * (window.devicePixelRatio || 1);
    const buf = new Buffer(Math.ceil(w * k), Math.ceil(h * k));
    const tint = opts.tint ? [parseInt(opts.tint.slice(0, 2), 16), parseInt(opts.tint.slice(2, 4), 16),
                              parseInt(opts.tint.slice(4, 6), 16)] : [34, 34, 34];
    for (let py = 0; py < buf.h; py++) {
      const f = Math.max(0, 1 - py / (buf.h * 0.6));
      for (let px = 0; px < buf.w; px++) {
        buf.blend(px, py, 0, 0, 0, 0.8);
        buf.blend(px, py, tint[0], tint[1], tint[2], 0.8 * f);
        const edge = px < k || py < k || px >= buf.w - k || py >= buf.h - k;
        if (edge) buf.blend(px, py, 90, 84, 74, 0.6);
      }
    }
    const base = padY + font.size + font.size * font.offY;
    ls.forEach((segs, n) => {
      const x = (w - widths[n]) / 2;
      drawLine(buf, font, segs, x * k, (base + n * pitch) * k, font.size * k, k, 0);
    });
    const c = buf.toCanvas(w * zoom, h * zoom);
    c.className = "fe-ghover";
    c.setAttribute("role", "img");
    c.setAttribute("aria-label", EZ.render.plain(text));
    return c;
  }

  return {init, available, load, ready, want, label, chat, hover, lines, info: () => info};
})();

/* ---- tools/editor/scene.js ---- */
/* The Filter Editor's drop scene: items on a floor of the game's own tiles with the labels the filter gives them, as
   the website's Examples are drawn (tools/example_shots.py): the area's floor tiles in the game's diamond grid, each
   picked by its rarity (the same tiles every time: a seeded pick), a dungeon's light falling off round the middle,
   each item's picture on the ground under its label, the labels in tidy columns (the game's own stacking isn't
   known, so this is a stand-in for a pile). Pictures and floors: Erazure-Filter-Editor-Assets (tools/editor_assets.py). */
var EZ = typeof EZ !== "undefined" ? EZ : {};
EZ.scene = (function () {
  "use strict";
  let info = null, baseUrl = "";
  const images = {};
  const ROW = 46, GAP = 44, MARGIN = [40, 34];  // game pixels (tools/example_shots.py)
  const smoothstep = (e0, e1, x) => { const t = Math.min(Math.max((x - e0) / (e1 - e0), 0), 1); return t * t * (3 - 2 * t); };

  function init(assets, base) {
    info = assets && assets.floors && assets.ground ? assets : null;
    baseUrl = base || "";
  }
  function available() { return !!info; }

  function image(file) {
    if (!images[file]) {
      images[file] = new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = baseUrl + file;
      });
    }
    return images[file];
  }

  /* Both pictures a scene needs: resolves {floor, ground} (null where one didn't load). */
  function load(floorName) {
    if (!info) return Promise.resolve(null);
    const f = info.floors[floorName] || Object.values(info.floors)[0];
    return Promise.all([image(f.file), image(info.ground.file)]).then(([floor, ground]) => ({floor, ground, def: f}));
  }

  function rng(seed) {  // mulberry32
    let a = 0;
    for (let i = 0; i < seed.length; i++) a = (a * 31 + seed.charCodeAt(i)) | 0;
    return () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* The ground picture of an item code: [x, y, w, h] on the sheet, or null. */
  function sprite(code) {
    const f = info && info.ground.items[code];
    return f ? info.ground.sprites[f] : null;
  }

  /* Lay the items out in columns: [{cx, top, box: [w, h], item}] and the scene's size, in game pixels. items: [{label
     (a canvas, its size in CSS pixels), zoom, code, hidden, invisible}]. */
  function layout(items, perColumn) {
    const cols = [];
    for (let i = 0; i < items.length; i += perColumn) cols.push(items.slice(i, i + perColumn));
    const boxOf = (it) => it.label ? [parseFloat(it.label.style.width) / it.zoom,
                                      it.label.height / it.label.width * parseFloat(it.label.style.width) / it.zoom] : [90, 18];
    const widths = cols.map((col) => Math.max(...col.map((it) => boxOf(it)[0])));
    const w = Math.ceil(widths.reduce((a, b) => a + b, 0) + GAP * Math.max(cols.length - 1, 0) + 2 * MARGIN[0]);
    const h = Math.ceil(Math.max(...cols.map((c) => c.length)) * ROW + 2 * MARGIN[1]);
    const placed = [];
    let x = MARGIN[0];
    cols.forEach((col, ci) => {
      const cx = x + widths[ci] / 2;
      col.forEach((it, n) => placed.push({cx, top: MARGIN[1] + n * ROW, box: boxOf(it), item: it}));
      x += widths[ci] + GAP;
    });
    return {w, h, placed};
  }

  /* Draw a scene into a new canvas. pics: load()'s; items as layout()'s; zoom: CSS pixels per game pixel. */
  function draw(pics, items, opts) {
    opts = opts || {};
    const zoom = opts.zoom || 1, k = zoom * (window.devicePixelRatio || 1);
    let per = opts.perColumn || 6;
    if (opts.fit) {  // as many columns as fit the width given (game pixels)
      const widest = Math.max(90, ...items.map((it) => it.label ? parseFloat(it.label.style.width) / it.zoom : 90));
      const cols = Math.max(1, Math.floor((opts.fit - 2 * MARGIN[0] + GAP) / (widest + GAP)));
      per = Math.ceil(items.length / cols);
    }
    const {w, h, placed} = layout(items, per);
    const c = document.createElement("canvas");
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.style.width = w * zoom + "px";
    c.className = "fe-scene-canvas";
    const g = c.getContext("2d");
    g.fillStyle = "#0b0a09";
    g.fillRect(0, 0, c.width, c.height);
    g.imageSmoothingEnabled = true;
    // the floor: the area's tiles in the diamond grid; cell (0, 0) in the middle
    if (pics && pics.floor) {
      const rarity = pics.def.rarity, n = rarity.length;
      const weights = rarity.some((x) => x > 0) ? rarity : rarity.map(() => 1);
      const total = weights.reduce((a, b) => a + b, 0);
      const pick = rng(opts.seed || "scene");
      const ox = w / 2 - 80, oy = h / 2 - 40, span = Math.ceil((w + h) / 40) + 4;
      for (let cy = -span; cy < span; cy++) {
        for (let cx = -span; cx < span; cx++) {
          const x0 = ox + (cx - cy) * 80, y0 = oy + (cx + cy) * 40;
          let r = pick() * total, t = 0;
          while (t < n - 1 && r >= weights[t]) { r -= weights[t]; t++; }
          if (x0 + 160 <= 0 || x0 >= w || y0 + 80 <= 0 || y0 >= h) continue;
          g.drawImage(pics.floor, t * 160, 0, 160, 80, x0 * k, y0 * k, 160 * k, 80 * k);
        }
      }
    }
    // the items' pictures under their labels
    const where = [];
    for (const p of placed) {
      const it = p.item;
      if (it.invisible) continue;
      const s = sprite(it.code);
      if (!s || !pics || !pics.ground) continue;
      const top = p.top + p.box[1] + 3;
      g.drawImage(pics.ground, s[0], s[1], s[2], s[3], Math.round(p.cx - s[2] / 2) * k, Math.round(top) * k, s[2] * k, s[3] * k);
    }
    // a dungeon's light, round on the floor
    if (pics && pics.def && pics.def.light) {
      const radius = pics.def.light, img = g.getImageData(0, 0, c.width, c.height), d = img.data;
      for (let y = 0; y < c.height; y++) {
        const dy = (y / k - h / 2) * 2;
        for (let x = 0; x < c.width; x++) {
          const dx = x / k - w / 2, dist = Math.sqrt(dx * dx + dy * dy) / radius;
          if (dist < 0.55) continue;
          const f = Math.max(0, 1 - smoothstep(0.55, 1.15, dist)) * 0.85 + 0.15, p = (y * c.width + x) * 4;
          d[p] *= f; d[p + 1] *= f; d[p + 2] *= f;
        }
      }
      g.putImageData(img, 0, 0);
    }
    // the labels
    for (const p of placed) {
      const it = p.item;
      const x = (p.cx - p.box[0] / 2) * k, y = p.top * k;
      if (it.label && !it.invisible) g.drawImage(it.label, x, y, p.box[0] * k, p.box[1] * k);
      else if (opts.showHidden) {
        g.save();
        g.strokeStyle = "rgba(200,190,170,.35)";
        g.setLineDash([4 * k / 2, 3 * k / 2]);
        g.strokeRect(x, y, p.box[0] * k, p.box[1] * k);
        g.restore();
      }
      where.push({x: x / k, y: p.top, w: p.box[0], h: p.box[1] + 30, item: it});
    }
    return {canvas: c, where, w, h};
  }

  return {init, available, load, draw, sprite};
})();

/* ---- tools/editor/sound.js ---- */
/* The Filter Editor's drop sounds: the game's own clips (Erazure-Filter-Editor-Assets/sounds, written by
   tools/editor_assets.py from the game's MPQs as 4-bit IMA ADPCM: its sample rate, length, first sample and step
   index, then two samples a byte, low nibble first), decoded here when played and played through Web Audio. */
var EZ = typeof EZ !== "undefined" ? EZ : {};
EZ.sound = (function () {
  "use strict";
  let info = null, baseUrl = "", ctx = null, playing = null;
  const clips = {};
  const STEPS = [7, 8, 9, 10, 11, 12, 13, 14, 16, 17, 19, 21, 23, 25, 28, 31, 34, 37, 41, 45, 50, 55, 60, 66, 73, 80,
    88, 97, 107, 118, 130, 143, 157, 173, 190, 209, 230, 253, 279, 307, 337, 371, 408, 449, 494, 544, 598, 658, 724, 796,
    876, 963, 1060, 1166, 1282, 1411, 1552, 1707, 1878, 2066, 2272, 2499, 2749, 3024, 3327, 3660, 4026, 4428, 4871, 5358,
    5894, 6484, 7132, 7845, 8630, 9493, 10442, 11487, 12635, 13899, 15289, 16818, 18500, 20350, 22385, 24623, 27086,
    29794, 32767];
  const INDEX = [-1, -1, -1, -1, 2, 4, 6, 8, -1, -1, -1, -1, 2, 4, 6, 8];

  function init(assets, base) {
    info = assets && assets.sounds ? assets : null;
    baseUrl = base || "";
  }
  function has(id) { return !!(info && info.sounds[String(id)]); }

  /* The clip's samples: {rate, samples (Float32Array)}. */
  function decode(buf) {
    const dv = new DataView(buf);
    const rate = dv.getUint32(0, true), n = dv.getUint32(4, true);
    let pred = dv.getInt16(8, true), index = Math.min(dv.getUint16(10, true), 88);
    const out = new Float32Array(n), bytes = new Uint8Array(buf, 12);
    out[0] = pred / 32768;
    for (let i = 1; i < n; i++) {
      const b = bytes[(i - 1) >> 1], code = (i - 1) & 1 ? b >> 4 : b & 15;
      const step = STEPS[index];
      let delta = step >> 3;
      if (code & 4) delta += step;
      if (code & 2) delta += step >> 1;
      if (code & 1) delta += step >> 2;
      pred = code & 8 ? Math.max(-32768, pred - delta) : Math.min(32767, pred + delta);
      index = Math.max(0, Math.min(88, index + INDEX[code]));
      out[i] = pred / 32768;
    }
    return {rate, samples: out};
  }

  function load(id) {
    const s = info.sounds[String(id)];
    if (!clips[id]) {
      clips[id] = fetch(baseUrl + s.file + (s.v ? "?v=" + s.v : "")).then((r) => {
        if (!r.ok) throw new Error("no clip");
        return r.arrayBuffer();
      }).then(decode);
    }
    return clips[id];
  }

  /* Play a drop sound; resolves false when there's no clip or the browser won't play. */
  function play(id) {
    if (!has(id)) return Promise.resolve(false);
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
      return Promise.resolve(false);
    }
    return load(id).then((pcm) => {
      if (ctx.state === "suspended") ctx.resume();
      if (playing) { try { playing.stop(); } catch (e) { /* done */ } }
      const buf = ctx.createBuffer(1, pcm.samples.length, pcm.rate);
      buf.getChannelData(0).set(pcm.samples);
      const src = ctx.createBufferSource(), gain = ctx.createGain();
      gain.gain.value = 0.8;
      src.buffer = buf;
      src.connect(gain).connect(ctx.destination);
      src.start();
      playing = src;
      return true;
    }).catch(() => false);
  }

  /* A ▶ button that plays the sound, or the game's own test command when the editor has no clip of it. */
  function button(id, name) {
    const {h} = EZ.ui;
    if (!has(id)) return h("span.fe-sub", {title: "Type this in the game's chat to hear it"}, `.playsound ${id}`);
    return h("button.fe-btn.ghost.small.fe-play", {type: "button", title: "Play " + (name || "the sound"),
      "aria-label": "Play " + (name || "the sound " + id), onclick: (e) => {
        e.stopPropagation();
        play(id).then((ok) => { if (!ok) EZ.ui.toast("The browser didn't play the sound."); });
      }}, "▶");
  }

  return {init, has, play, button, decode};
})();

/* ---- tools/editor/engine.js ---- */
/* The Filter Editor's engine: a filter's rules run for an item as PD2's BH runs them. A port of the PD2 BH source
   (github.com/Project-Diablo-2/BH: BH/Modules/Item/ItemDisplay.cpp, Item.cpp, MapNotify.cpp, BH/Formula.h, Common.cpp):

   - InitializeItemRules: every alias written into the rules (EZ.core.substitute), Formula[KEY] entries and $f(...)
     islands compiled (an island that doesn't compile stays text), each rule's condition cut into tokens at white space;
   - BuildConditions: a token's leading and trailing ! ( ) are operators; the rest is a key, a comparison (= < > ~) and a
     number (a token whose number doesn't read is dropped with its trailing operators); the key is a word of BH's
     table, else an item code (3+ characters, none of the first three upper case), else a sum (+), else SK / OS /
     CHSK / CLSK / TABSK / STAT / CHARSTAT / MULTI with a number, else a formula; anything else is dropped. An operand
     after an operand or ) gets an AND first, so does ! or ( (the implicit AND);
   - ProcessConditions and Convert: AND and OR of equal precedence, read left to right, ! binding tightest; a ) without
     its ( ends the condition there; a condition that doesn't make one tree never matches, one with no condition left
     (empty, or only words BH drops) always matches (Rule::Evaluate);
   - each condition word as BH reads it (ItemStatCondition's x256 for life and mana, the affix list for ED, MAXDUR,
     FOOLS and charges, the item + runeword + socket fillers list for enhanced damage, defense and damage);
   - formulas (Formula.h): its lexer and parser, constant folding, float arithmetic, BH's errors, shown with %.2f and
     ".00" or one trailing 0 dropped (f_err on an error, not finite or past 2^31);
   - BuildAction (BORDER MAP DOT PX LINE NOTIFY TIER, the first {...}, SOUNDID, %MAP%, %CONTINUE% taken out in that
     order; %words% with a lower case letter upper-cased first) and BuildReplacementActions (an unknown %WORD% stays
     text, a keyword with the wrong number of numbers stays text);
   - the name and the description: every matching rule up to the first that stops replaces them; %NL% / %CL% in a name
     only where BH allows a line break (identified magic or better, runewords, shop items; one in a non-magical class
     or superior item); TrimItemText (%CL% %CS%, the 56 visible characters, 512 in a shop, 511 in all, 126 on tomes);
     ItemNamePatch's copy of 127 characters (123 for quest items); level 0 keeps the game's name;
   - the game's own options: Hide Healing / Mana Potions first; Force Show Undiscovered / Unowned for a unique or set
     the filter hides (the game's name, the item stays visible);

      f = (it, c) => {
        const v = addValue(it, c, F, parts);
        return v === undefined ? MAYBE : cmp(v, op, a, 0);
      };
    } else {
      let done = false;
      for (const [pre, sid] of SKILL_PREFIXES) {
        if (!key.startsWith(pre)) continue;
        done = true;
        const n = readInt(key.slice(pre.length));
        if (n === null || n < 0) break;
        if (pre === "CHARSTAT") { if (n <= F.statMax) f = (it, c) => cmp(charStat(c, n), op, a, b); }
        else if (pre === "STAT") { if (n <= F.statMax) f = (it) => itemStat(it, n, 0, op, a, b); }
        else if (pre === "CLSK") { if (n < 7) f = (it) => itemStat(it, sid, n, op, a, b); }
        else if (pre === "TABSK") { if (n <= 50) f = (it) => itemStat(it, sid, n, op, a, b); }
        else if (pre === "CHSK") { if (n <= F.skillMax) f = (it) => cmp(charged(it, n), op, a, b); }
        else if (n <= F.skillMax) f = (it) => itemStat(it, sid, n, op, a, b);
        break;
      }
      if (!done && key.startsWith("MULTI")) {
        done = true;
        const m = /(\d{1,10}),(\d{1,10})/.exec(key);
        if (m && +m[1] <= 2147483647 && +m[2] <= 2147483647) {
          const s1 = +m[1], s2 = +m[2];
          f = (it) => itemStat(it, s1, s2, op, a, b);
        }
      }
      if (!done && F.formulas[key]) {
        const node = F.formulas[key];
        f = (it, c) => {
          const r = runFormula(node, it, c, F);
          if (r.unknown) return MAYBE;
          if (r.err) return 0;
          return op ? cmp(r.v, op, a, b) : (r.v !== 0 ? 1 : 0);
        };
      }
    }
    if (!f && rec && kind !== "AND" && kind !== "OR" && key) {
      rec.push({token, why: WORDS[key] ? "a word that needs a comparison" : /^(SK|OS|CHSK|CLSK|TABSK|STAT|CHARSTAT)/.test(key) ?
        "its number is out of range or missing" : "BH doesn't know this word"});
    }
    if (f) {
      if (st.last === "v" || st.last === ")") out.push({k: "and"});
      out.push({k: "v", f, word: token, only});
      st.last = "v";
    }
    for (const k of end) nonOperand(k);
  }

  const ALWAYS = {k: "always"};

  /* Condition::ProcessConditions (shunting-yard) and Rule::Convert: the tree, ALWAYS when no condition is left (an
     empty condition, or only words BH doesn't know), or null (never matches). */
  function tree(conds) {
    const rpn = [], stack = [];
    let cut = false;
    for (const c of conds) {
      if (c.k === "v") rpn.push(c);
      else if (c.k === "and" || c.k === "or" || c.k === "not") {
        if (c.k !== "not") {
          while (stack.length) {
            const t = stack[stack.length - 1].k;
            if (t === "not" || t === "and" || t === "or") rpn.push(stack.pop()); else break;
          }
        }
        stack.push(c);
      } else if (c.k === "(") stack.push(c);
      else if (c.k === ")") {
        let found = false;
        while (stack.length) {
          const s = stack.pop();
          if (s.k === "(") { found = true; break; }
          rpn.push(s);
        }
        if (!found) { cut = true; break; }
      }
    }
    if (!cut) {
      while (stack.length) {
        const s = stack.pop();
        if (s.k === "(" || s.k === ")") break;
        rpn.push(s);
      }
    }
    if (!rpn.length) return ALWAYS;  // Rule::Evaluate: a rule with no conditions left always matches
    const st = [];
    for (const c of rpn) {
      if (c.k === "v") st.push(c);
      else if (c.k === "and" || c.k === "or") {
        if (st.length < 2) return null;
        const rhs = st.pop(), lhs = st.pop();
        st.push({k: c.k, lhs, rhs});
      } else if (c.k === "not") {
        if (!st.length) return null;
        st.push({k: "not", lhs: st.pop()});
      } else return null;
    }
    return st.length === 1 ? st[0] : null;
  }

  /* What a condition needs of every item it can match: {codes: Set | null, quals: Set | null} (null: anything).
     An AND needs what either side needs, an OR what both sides need together; a ! needs nothing. */
  function needs(n, key) {
    if (!n) return null;
    if (n.k === "v") return n.only && n.only[key] ? new Set(n.only[key]) : null;
    if (n.k === "not" || n.k === "always") return null;
    const a = needs(n.lhs, key), b = needs(n.rhs, key);
    if (n.k === "and") {
      if (a && b) return new Set([...a].filter((x) => b.has(x)));
      return a || b;
    }
    if (a && b) return new Set([...a, ...b]);
    return null;
  }

  function evalTree(n, it, c, F) {
    switch (n.k) {
      case "v": return n.f(it, c, F);
      case "always": return 1;
      case "and": { const x = evalTree(n.lhs, it, c, F); return x === 0 ? 0 : Math.min(x, evalTree(n.rhs, it, c, F)); }
      case "or": { const x = evalTree(n.lhs, it, c, F); return x === 1 ? 1 : Math.max(x, evalTree(n.rhs, it, c, F)); }
      case "not": return 1 - evalTree(n.lhs, it, c, F);
    }
    return 0;
  }

  /* ================================================================ outputs */

  const UPPER_RE = /^(?:(?:%[^%]*%)|[^%])*%((?:\w|_|-)*?[a-z]+?(?:\w|_|-)*?)%/;
  const LEGACY = [["WHITE", 0x20], ["RED", 0x0A], ["GREEN", 0x84], ["BLUE", 0x97], ["GOLD", 0x0D], ["GRAY", 0xD0],
    ["BLACK", 0x00], ["TAN", 0x5A], ["ORANGE", 0x60], ["YELLOW", 0x0C], ["PURPLE", 0x9B], ["DARK_GREEN", 0x76],
    ["CORAL", 0x66], ["SAGE", 0x82], ["TEAL", 0xCB], ["LIGHT_GRAY", 0xD6]];

  function takeOut(text, re) {
    const m = re.exec(text);
    return m ? [text.slice(0, m.index) + text.slice(m.index + m[0].length), m] : [text, null];
  }

  /* BuildAction: {name, desc (replacement parts), text, descText (as written), cont, border, map, dot, px, line,
     notify, tier, sound, notifies}. */
  function action(out, F) {
    let name = out;
    for (let n = 0; n < 1000; n++) {
      const m = UPPER_RE.exec(name);
      if (!m) break;
      const start = m[0].length - m[1].length - 1;
      name = name.slice(0, start) + m[1].replace(/[a-z]/g, (x) => x.toUpperCase()) + name.slice(start + m[1].length);
    }
    const a = {cont: false, border: null, map: null, dot: null, px: null, line: null, notify: null, tier: -1, sound: 0};
    for (const [k, f] of [["BORDER", "border"], ["MAP", "map"], ["DOT", "dot"], ["PX", "px"], ["LINE", "line"],
                          ["NOTIFY", "notify"]]) {
      const [t, m] = takeOut(name, new RegExp("%" + k + "-([a-f0-9]{1,4})%", "i"));
      name = t;
      if (m) a[f] = parseInt(m[1], 16);
    }
    {
      const [t, m] = takeOut(name, /%TIER-([0-9])%/i);
      name = t;
      if (m) a.tier = +m[1];
    }
    let desc = "";
    const l = name.indexOf("{"), r = name.indexOf("}");
    if (l >= 0 && r >= 0 && l < r) {
      desc = name.slice(l + 1, r);
      name = name.slice(0, l) + name.slice(r + 1);
    }
    {
      const [t, m] = takeOut(name, /%SOUNDID-([0-9]{1,4})%/i);
      name = t;
      if (m && +m[1] < F.soundCount) a.sound = +m[1];
    }
    const legacy = name.indexOf("%MAP%");
    if (legacy >= 0) {
      let color = 0x20, last = 0;
      for (const [c, v] of LEGACY) {
        const p = name.indexOf("%" + c + "%");
        if (p >= 0 && p < legacy && p >= last) { color = v; last = p; }
      }
      name = name.slice(0, legacy) + name.slice(legacy + 5);
      a.map = color;
      if (a.border === null) a.border = color;
    }
    const done = name.indexOf("%CONTINUE%");
    if (done >= 0) { name = name.slice(0, done) + name.slice(done + 10); a.cont = true; }
    a.text = name;
    a.descText = desc;
    a.name = replacements(name, F);
    a.desc = replacements(desc, F);
    a.notifies = a.border !== null || a.map !== null || a.dot !== null || a.px !== null || a.line !== null ||
                 a.sound !== 0;
    return a;
  }

  const COLORS = dict({WHITE: "0", RED: "1", GREEN: "2", BLUE: "3", GOLD: "4", GRAY: "5", TAN: "7", ORANGE: "8",
    YELLOW: "9", PURPLE: ";", DARK_GREEN: ":", BLACK: "\x02", CORAL: "\x06", SAGE: "\x07", TEAL: "\x09",
    LIGHT_GRAY: "\x0C", FULL_TRANS: "\x40", THREE_FOURTHS_TRANS: "\x41", HALF_TRANS: "\x42", QUARTER_TRANS: "\x43"});
  const STATIC = new Set(["NAME", "BASENAME", "SOCKETS", "RUNENUM", "RUNENAME", "GEMLEVEL", "GEMTYPE", "ILVL", "ALVL",
    "CRAFTALVL", "REROLLALVL", "LVLREQ", "WPNSPD", "RANGE", "CODE", "LBRACE", "RBRACE", "PERCENT", "BUYPRICE",
    "SELLPRICE", "PRICE", "QTY", "RES", "ED", "CS", "CL", "NL", "REQSTR", "REQDEX", "REQLVL", "BASEMINONEH",
    "BASEMAXONEH", "BASEMINTWOH", "BASEMAXTWOH", "BASEMINTHROW", "BASEMAXTHROW", "BASEMINKICK", "BASEMAXKICK",
    "BASEMINSMITE", "BASEMAXSMITE", "BASEBLOCK", "ALLATTRIB", "MAXRES", "PLUSDEF", "UPSTR", "UPDEX", "UPLVL",
    "MAXSOCKETS", "MINDMG", "MAXDMG", "EDEF", "EDAM", "DEF", "FRES", "CRES", "LRES", "PRES", "IAS", "FCR", "FHR", "FBR",
    "LIFE", "MANA", "ARPER", "MFIND", "GFIND", "STR", "DEX", "FRW", "AR", "DTM", "MAEK", "REPLIFE", "REPQUANT",
    "REPAIR"]);
  const DYNAMIC = dict({STAT: 1, SK: 1, OS: 1, CLSK: 1, TABSK: 1, CHARSTAT: 1, MULTI: 2});
  const KEYWORD_RE = /%([A-Z_]+)(?:(\d{1,9})(?:,(\d{1,9}))?)?%/g;

  /* BuildReplacementActions: [string | {k, p1, p2} | {formula, ref}]. */
  function replacements(text, F) {
    const out = [];
    let last = 0;
    while (last < text.length) {
      KEYWORD_RE.lastIndex = last;
      const m = KEYWORD_RE.exec(text);
      if (!m) break;
      if (m.index > last) out.push(text.slice(last, m.index));
      const name = m[1], count = (m[2] ? 1 : 0) + (m[3] ? 1 : 0);
      let spec;
      if (COLORS[name] !== undefined) spec = count ? m[0] : "ÿc" + COLORS[name];
      else if (STATIC.has(name)) spec = count ? m[0] : {k: name};
      else if (DYNAMIC[name] !== undefined) spec = count !== DYNAMIC[name] ? m[0] : {k: name, p1: +m[2], p2: m[3] ? +m[3] : 0};
      else if (F.formulas[name]) spec = count ? m[0] : {formula: F.formulas[name], ref: name};
      if (spec === undefined) {  // no such keyword: its text but the last %, and look again from that %
        out.push(m[0].slice(0, -1));
        last = m.index + m[0].length - 1;
        continue;
      }
      out.push(spec);
      last = m.index + m[0].length;
    }
    if (last < text.length) out.push(text.slice(last));
    return out;
  }

  const fmtInt = (v) => v === undefined ? "?" : String(Math.trunc(v) | 0);
  const GEM_LEVELS = ["NONE", "Chipped", "Flawed", "Normal", "Flawless", "Perfect"];
  const GEM_TYPES = ["NONE", "Amethyst", "Diamond", "Emerald", "Ruby", "Sapphire", "Topaz", "Skull"];
  function stripColor(s) { return /^ÿc./.test(s) ? s.slice(3) : s; }

  /* ReplacementValue::Replace; s: the ReplaceContext {name, limit, nlAllowed, nmagStaffmod, blockedNL}. */
  function replaceOne(spec, s, it, c, F) {
    if (typeof spec === "string") return spec;
    if (spec.formula) {
      const r = runFormula(spec.formula, it, c, F);
      if (r.unknown) return "?";
      return r.err ? "f_err" : formatNumber(r.v);
    }
    const b = it.base || {};
    switch (spec.k) {
      case "NAME": if (s.name.length > 1023) s.name = s.name.slice(0, 1023); return s.name;
      case "BASENAME": return stripColor(b.name || "");
      case "LBRACE": return "{";
      case "RBRACE": return "}";
      case "PERCENT": return "%";
      case "CS": return "\b";
      case "CL": case "NL": {
        const ch = spec.k === "CL" ? "\r" : "\n";
        if (s.blockedNL) return "";
        if (!s.limit || s.nlAllowed) return ch;
        if (s.nmagStaffmod) { s.blockedNL = true; return ch; }
        return "";
      }
      case "SOCKETS": return fmtInt(unitStat(it, 194, 0));
      case "RUNENUM": { const r = rune(it); return r === undefined ? "?" : String(r || 0); }
      case "RUNENAME": {
        if (!b.rune) return "";
        const n = b.name || "", k = n.indexOf(" ");
        return k < 0 ? n : n.slice(0, k);
      }
      case "GEMLEVEL": return b.gem ? GEM_LEVELS[b.gem[0]] || "" : "";
      case "GEMTYPE": return b.gem ? GEM_TYPES[b.gem[1]] || "" : "";
      case "ILVL": return fmtInt(it.ilvl);
      case "ALVL": return fmtInt(alvl(it));
      case "CRAFTALVL": return fmtInt(craftAlvl(it, c));
      case "REROLLALVL": return fmtInt(rerollAlvl(it, c));
      case "LVLREQ": return fmtInt(it.lvlreq);
      case "WPNSPD": return String(b.speed || 0);
      case "RANGE": return String(b.range || 0);
      case "CODE": return it.code || "";
      case "BUYPRICE": return b.quest ? "" : fmtInt(it.buy);
      case "SELLPRICE": case "PRICE": return b.quest ? "" : fmtInt(it.sell);
      case "QTY": return fmtInt(unitStat(it, 70, 0));
      case "RES": return fmtInt(minOfAll(it, [39, 41, 43, 45]));
      case "ED": return fmtInt(edValue(it));
      case "REQSTR": return fmtInt(reqStat(it, "STR"));
      case "REQDEX": return fmtInt(reqStat(it, "DEX"));
      case "REQLVL": return fmtInt(reqStat(it, "LEVEL"));
      case "BASEBLOCK": return fmtInt(it.base ? b.block || 0 : undefined);
      case "ALLATTRIB": return fmtInt(minOfAll(it, [0, 2, 1, 3]));
      case "MAXRES": return fmtInt(minOfAll(it, [40, 44, 42, 46]));
      case "PLUSDEF": return fmtInt(listStat(it, 31));
      case "UPSTR": return fmtInt(upStat(it, "STR"));
      case "UPDEX": return fmtInt(upStat(it, "DEX"));
      case "UPLVL": return fmtInt(upStat(it, "LEVEL"));
      case "MAXSOCKETS": return fmtInt(maxSockets(it));
      case "MINDMG": return fmtInt(minMax(it, false));
      case "MAXDMG": return fmtInt(minMax(it, true));
      case "STAT": return spec.p1 > F.statMax ? "" : fmtInt(adjusted(it, spec.p1, 0));
      case "SK": return spec.p1 > F.skillMax ? "" : fmtInt(unitStat(it, 107, spec.p1));
      case "OS": return spec.p1 > F.skillMax ? "" : fmtInt(unitStat(it, 97, spec.p1));
      case "CLSK": return spec.p1 > F.skillMax ? "" : fmtInt(unitStat(it, 83, spec.p1));
      case "TABSK": return spec.p1 > F.skillMax ? "" : fmtInt(unitStat(it, 188, spec.p1));
      case "CHARSTAT": return spec.p1 > F.statMax ? "" : fmtInt(charStat(c, spec.p1));
      case "MULTI": return spec.p1 > F.statMax ? "" : fmtInt(unitStat(it, spec.p1, spec.p2));
    }
    if (spec.k.startsWith("BASEM")) return fmtInt(baseDamage(it, spec.k.slice(4)));
    if (STAT_WORDS[spec.k] !== undefined) return fmtInt(adjusted(it, STAT_WORDS[spec.k], 0));
    return "";
  }

  function applyParts(parts, s, it, c, F) {
    let out = "";
    for (const p of parts) out += replaceOne(p, s, it, c, F);
    return out;
  }

  const WS = (ch) => ch === " " || ch === "\t" || ch === "\n" || ch === "\r" || ch === "\v" || ch === "\f";
  const CODE_RE = /ÿc[0-9;:\x01-\x1F]/g;
  function visibleLength(s) { return s.replace(CODE_RE, "").length; }

  /* TrimItemText: {text, cut (visible characters the 56 / 512 limit cut)}. limit: the visible limit, 0 for a
     description. */
  function trim(text, limit, code) {
    let out = "";
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ch === "\r") {
        if (!out.length || out[out.length - 1] === "\n") continue;
        if (i + 1 < text.length && text[i + 1] !== "\n" && text[i + 1] !== "\r") out += "\n";
      } else if (ch === "\b") {
        if (!out.length || WS(out[out.length - 1]) || out[out.length - 1] === "\b") continue;
        if (i + 1 < text.length && !WS(text[i + 1]) && text[i + 1] !== "\b") out += " ";
      } else out += ch;
    }
    let cut = 0;
    if (limit) {
      const codes = [];
      CODE_RE.lastIndex = 0;
      let m;
      while ((m = CODE_RE.exec(out))) codes.push(m.index);
      let keep = 0;
      for (const pos of codes) {
        if (pos - keep > limit) break;
        keep += 3;
      }
      if (out.length - 3 * codes.length > limit) {
        const max = limit + keep;
        cut = visibleLength(out.slice(max));
        out = out.slice(0, max);
      }
    }
    const hard = code && /^[ti]bk/.test(code) ? 127 : 512;
    if (out.length > hard - 1) out = out.slice(0, hard - 1);
    return {text: out, cut};
  }

  /* ItemNamePatch's copy: a color code too near the end dropped, then nameSize - 1 characters (127; 123 for quest
     items; 511 on the gamble screen). */
  function copyName(name, size) {
    const last = name.lastIndexOf("ÿc");
    if (last >= 0 && last > size - 5) name = name.slice(0, last);
    return name.length > size - 1 ? {text: name.slice(0, size - 1), cut: name.length - (size - 1)} : {text: name, cut: 0};
  }

  /* The chat line (MapNotify): the name's outer white space and color codes trimmed (the last leading code kept; a
     name of several lines is left as it is: the trim doesn't match across a line break), each line break " - ", at
     most 151 bytes. Its color: the quality's. */
  const CHAT_RE = /^[ \t\n\v\f\r]*(?:(?:[ \t\n\v\f\r]*?)(ÿc[0123456789;:]))*[ \t\n\v\f\r]*(.*?[^ \t\n\v\f\r])[ \t\n\v\f\r]*(?:ÿc[0123456789;:])*[ \t\n\v\f\r]*$/;
  function chatLine(name) {
    const m = CHAT_RE.exec(name);
    let s = m ? (m[1] || "") + m[2] : name;
    s = s.replace(/\n/g, " - ");
    const enc = new TextEncoder();
    if (enc.encode(s).length > 151) {
      let n = s.length;
      while (n > 0 && enc.encode(s.slice(0, n)).length > 151) n--;
      s = s.slice(0, n);
    }
    return s;
  }

  /* ================================================================ compiling a filter */

  /* BH's island refs: ISLAND_A..Z, then AA, BA, ...: its suffix counts up from the first letter. */
  function islandNamer() {
    const suffix = [];
    const name = () => "ISLAND_" + suffix.map((x) => String.fromCharCode(65 + x)).join("");
    return () => {
      for (let i = 0; i < suffix.length; i++) {
        if (suffix[i] === 25) { suffix[i] = 0; continue; }
        suffix[i]++;
        return name();
      }
      suffix.push(0);
      return name();
    };
  }

  /* ReplaceFormulaIslands: each $f(...) that compiles becomes pre + its ref + suf. */
  function islands(text, pre, suf, F, next) {
    if (text.indexOf("$f(") < 0) return text;
    let out = "", at = 0;
    while (at < text.length) {
      const start = text.indexOf("$f(", at);
      if (start < 0) { out += text.slice(at); break; }
      out += text.slice(at, start);
      let count = 0, end = text.length;
      for (let i = start + 2; i < text.length; i++) {
        if (text[i] === "(") count++;
        else if (text[i] === ")") { count--; if (count === 0) { end = i; break; } }
      }
      if (end < text.length) {
        const node = compileFormula(text.slice(start + 3, end));
        if (node) {
          const ref = next();
          F.formulas[ref] = node;
          F.formulaText[ref] = text.slice(start + 3, end);
          out += pre + ref + suf;
        } else out += text.slice(start, end + 1);
        at = end + 1;
        continue;
      }
      out += "$f(";
      at = start + 3;
    }
    return out;
  }

  /* A version's lines (alias form, toggles as they are) as BH reads them. opts: {statMax, skillMax, soundCount}.
     -> {rules: [{i, n, cond, out, tree, act}], mapRules, byLine, formulas}. */
  function compile(lines, opts) {
    opts = opts || {};
    const core = EZ.core;
    const entries = core.bhEntries(lines);
    const aliases = core.bhAliases(entries);
    const rules = core.ruleEntries(lines, entries).filter((r) => !r.prefix);
    const texts = core.substitute([rules.map((r) => r.cond), rules.map((r) => r.out)], aliases);
    const F = {formulas: dict(), formulaText: dict(), statMax: opts.statMax || 1023, skillMax: opts.skillMax || 1023,
               soundCount: opts.soundCount || 10000, rules: [], mapRules: [], byLine: new Map()};
    for (const e of entries) {
      const m = /^Formula\[(.*)\]$/.exec(e.key);
      if (!m) continue;
      const node = compileFormula(e.value);
      if (!node) continue;
      const ref = "FORMULA" + m[1].replace(/[a-z]/g, (x) => x.toUpperCase());
      F.formulas[ref] = node;
      F.formulaText[ref] = e.value;
    }
    const next = islandNamer();
    for (let n = 0; n < rules.length; n++) {
      const cond = islands(texts[0][n], "", "", F, next);
      const out = islands(texts[1][n], "%", "%", F, next);
      const conds = [], st = {last: null};
      for (const tok of cond.split(/[ \t\n\r\v\f]+/)) if (tok) buildConditions(tok, conds, st, F);
      const t = tree(conds);
      const r = {i: rules[n].i, n, cond: texts[0][n], out: texts[1][n], tree: t, act: action(out, F),
                 codes: needs(t, "codes"), quals: needs(t, "quals")};
      F.rules.push(r);
      F.byLine.set(r.i, r);
      if (r.act.notifies) F.mapRules.push(r);
    }
    F.lists = new Map();
    return F;

    const a = EZ.engine.analyze(isl, condF);
    for (const d of a.dropped) {
      say(n, "error", `BH drops '${d.token}' (${d.why}): the rest of the condition still counts, so the rule matches ` +
        "more items than you meant.", d.token);
    }
    const act = EZ.engine.action(EZ.engine.islandsOf(outText, "%", "%", {formulas: condF.formulas, formulaText: {}},
                                                     namer), condF);
    const hides = !act.cont && !act.text.length;
    if (a.never) {
      say(n, "error", "BH can't build this condition (an AND, OR or ! without what it joins): the rule never matches.");
    } else if (a.always) {
      const stopTop = env.block === "top" && !act.cont;
      say(n, stopTop || cond.trim() ? "warning" : "info", (cond.trim() ? "No condition is left once BH drops what it " +
        "can't read: " : "No condition: ") + "the rule matches every item" + (stopTop ? ", and above Erazure's rules it " +
        "decides every item's look (Erazure's own rules never run)." : "."));
    }
    if (env.codes) {
      for (const code of a.codes) {
        if (!env.codes.has(code)) {
          say(n, "warning", `'${code}' is no item code of the game: it matches nothing. (A word of 3 or more letters ` +
            "that starts in lower case is read as an item code.)", code);

        "description of its own.");

          w === "TIER" ? " (%TIER-4%)" : DYNAMIC[w] !== undefined ? ` (it needs ${DYNAMIC[w]} number${DYNAMIC[w] > 1 ?
          "s" : ""}: %${w}${DYNAMIC[w] > 1 ? "107,54" : "127"}%)` : "";
        say(n, "error", `${m[0]} is no keyword BH knows: it shows as text${hint}.`, m[0]);
        KEYWORD_RE.lastIndex = m.index + m[0].length - 1;
      }
    }
    for (const b of badIslands(act.text + act.descText)) {
      say(n, "error", `BH can't read the formula ${b.slice(0, 40)}: it shows as text.`, b);
    }
    if (/%SOUNDID-\d{1,4}%/i.test(outText) && !act.sound) {
      say(n, "warning", "That sound number is past the game's sounds: no sound plays.");
    }
    // hiding and layers
    if (hides) {
      if (!/\bGROUND\b/.test(cond)) {
        say(n, "warning", "This hides the item everywhere BH names it: your inventory, stash and shops too. Add GROUND " +
          "!TOWN to hide it only on the ground outside town.");
      } else if (!/!TOWN\b/.test(cond0) && !/!\s*TOWN\b/.test(cond0)) {
        say(n, "info", "This hides the item on the ground in town too (towns and the guild halls). Erazure adds !TOWN " +
          "to every hide.");
      }

    if (act.cont && !act.text.length) {
      say(n, "warning", "A %CONTINUE% rule with no text empties the name for every later rule (Erazure's too): " +
        "write %NAME% to keep it.");
    } else if (act.cont && act.name.every((p) => typeof p === "string" || p.k !== "NAME") &&
               act.name.some((p) => typeof p !== "string" || p.replace(/ÿc./g, "").trim())) {
      say(n, "info", "This %CONTINUE% rule's text has no %NAME%: every later rule (Erazure's too) gets your text " +
        "instead of the item's name.");
    }
    if (out0.indexOf("{") < 0 && out0.trim()) {
      say(n, "info", "Without { } this rule empties the description earlier rules wrote. Write {%NAME%} to keep it.");
    }
    // sizes and letters
    const label = measure(act.name), desc = measure(act.desc);
    const max = SHOP_RE.test(cond) ? SHOP_MAX : NAME_MAX;
    if (!hides) {
      if (label.shown > max) {
        say(n, "warning", `This label has at least ${label.shown} letters${label.name ? " besides the item's name" : ""}: ` +
          `BH shows ${max} and cuts the rest (the top line's right end).`);
      } else if (label.name && label.shown + 14 > max) {
        say(n, "info", `With the item's name (often 14 letters or more) this label may pass BH's ${max} letters: ` +
          "BH cuts the top line's right end.");
      }
      if (label.raw > COPY_MAX) {
        say(n, "warning", `This label holds at least ${label.raw} characters with its color codes: BH hands the game ` +
          `${COPY_MAX} and cuts the rest.`);
      }
    }
    if (desc.raw > DESC_MAX) {
      say(n, "warning", `The description has at least ${desc.raw} characters: BH ends a long description with "..."`);
    }
    if (fs) {
      const missing = new Set(), preview = new Set();
      for (const [chars, set] of [[label.chars, fs.label], [desc.chars, fs.label]]) {
        for (const ch of chars) {
          const cp = ch.codePointAt(0);
          if (cp < 0x20) continue;
          if (!set.has(cp) && !fs.sym.has(cp)) missing.add(ch);
          else if (!fs.sheet.has(cp)) preview.add(ch);
        }
      }
      for (const ch of missing) say(n, "warning", `The game has no letter '${ch}': it draws ☹ instead.`, ch);
      for (const ch of preview) say(n, "info", `The preview can't draw '${ch}' (the game can).`, ch);
    }
  }

  /* {error, warning, info} counts. */
  function counts(findings) {
    const c = {error: 0, warning: 0, info: 0};
    for (const f of findings) c[f.level]++;
    return c;
  }

  return {lines, context, counts, andAfterOr, balanced, measure};
})();

    EQUIPPED: "equipped", MERC: "on the mercenary", SHOP: "in a shop", COMPENDIUM: "in the Compendium",

    CRAFTALVL: "affix level if crafted", LVLREQ: "required level", SOCK: "sockets", SOCKETS: "sockets",
    DIFF: "difficulty", QTY: "stack of", GOLD: "gold", RUNE: "rune", ED: "ED", EDEF: "+% defense", EDAM: "+% damage",
    DEF: "defense", RES: "all res", FRES: "fire res", CRES: "cold res", LRES: "lightning res", PRES: "poison res",
    MAXRES: "max res", ALLSK: "+ all skills", FCR: "FCR", IAS: "IAS", FHR: "FHR", FBR: "FBR", FRW: "FRW",
    LIFE: "life", MANA: "mana", STR: "strength", DEX: "dexterity", ALLATTRIB: "all attributes", MFIND: "magic find",
